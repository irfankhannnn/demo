version: '3.8'

services:
  whatsapp-platform:
    build: .
    container_name: whatsapp-platform
    restart: unless-stopped
    ports:
      - "${PORT:-3003}:${PORT:-3003}"
    env_file:
      - .env
    volumes:
      # Auth state persisted across restarts (local mode only)
      - whatsapp_auth_state:/app/auth_state
      - whatsapp_auth_backups:/app/auth-backups
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-3003}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      - LOCAL_STORAGE=true
      - NODE_ENV=${NODE_ENV:-development}

volumes:
  whatsapp_auth_state:
  whatsapp_auth_backups:
