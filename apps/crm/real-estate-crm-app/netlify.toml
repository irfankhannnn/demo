[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"

# Redirect all routes to index.html for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Environment variables reminder (set these in Netlify Dashboard > Site Settings > Environment Variables):
# - VITE_CRM_API_DOMAIN_NAME / VITE_CRM_API_BASE_PATH: CRM API custom domain + base path
# - VITE_AUTH_API_DOMAIN_NAME / VITE_AUTH_API_BASE_PATH: auth API custom domain + base path
# - VITE_TENANT_ID: Your tenant ID for multi-tenancy
# - VITE_GOOGLE_MAPS_API_KEY: Google Maps API key (REQUIRED for location picker to work)
