AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Instagram Solution frontend (frontend_insta_sol_ms) - S3 origin bucket only.
  Served through an /insta/* cache behavior on the existing CRM CloudFront
  distribution, so the app is same-origin with the CRM and its bearer token
  works with no cross-origin handoff and no CORS.

# =============================================================================
# This stack deliberately does NOT create a CloudFront distribution. The chosen
# topology is a second origin plus an /insta/* cache behavior on the EXISTING CRM
# distribution (apps/crm/real-estate-crm-app/infra/cfn-frontend.yaml).
#
# Deploy order (three steps, because the bucket and the distribution live in
# different stacks and the bucket policy has to name the distribution):
#   1. Deploy THIS stack with CrmDistributionId empty. Creates the bucket.
#   2. Deploy the CRM frontend stack passing InstaFrontendBucketDomainName =
#      this stack's InstaFrontendBucketRegionalDomainName output. That adds the
#      origin, the OAC, the SPA rewrite function and the /insta/* behavior.
#   3. Redeploy THIS stack with CrmDistributionId set to the CRM stack's
#      DistributionId output. That attaches the bucket policy which actually lets
#      the distribution read the bucket.
# Until step 3 the bucket is private and unreadable, which is the correct and
# safe intermediate state.
#
# Naming convention: <dev|prod>-realestateflow-insta-frontend-<resource>.
#
# NOTE: keep this file plain ASCII - see the note in
# apps/instagram/backend_insta_sol_ms/infra/cfn-insta-sol-ms.yaml.
# =============================================================================

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues: [dev, prod]

  BucketName:
    Type: String
    Description: S3 bucket for the built Instagram Solution frontend (globally unique)
    MinLength: 3
    MaxLength: 63
    AllowedPattern: "^[a-z0-9][a-z0-9.-]*[a-z0-9]$"
    ConstraintDescription: Bucket name must be lowercase, 3-63 chars, letters/numbers/dots/hyphens.

  CrmDistributionId:
    Type: String
    Default: ''
    Description: >
      CloudFront distribution ID of the CRM frontend that serves /insta/*. Leave
      empty on the first deploy (step 1 above); set it on the redeploy (step 3) to
      attach the bucket policy. Empty means no bucket policy is created and the
      bucket stays unreadable.

Conditions:
  HasCrmDistribution: !Not [!Equals [!Ref CrmDistributionId, '']]

Resources:
  # Retain: this bucket is the deployed artifact for the app. Versioning is on so
  # a bad deploy can be rolled back object-by-object, and the CI/CD wrapper also
  # keeps a permanent per-build dist.tar.gz archive in the artifact bucket.
  InstaFrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      # No public access. CloudFront reaches it through Origin Access Control,
      # which is defined on the CRM stack alongside the distribution that uses it.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Service
          Value: realestateflow-insta-frontend

  InstaFrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: HasCrmDistribution
    Properties:
      Bucket: !Ref InstaFrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${InstaFrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                # Scoped to exactly the one distribution allowed to serve this
                # bucket. Without this condition any CloudFront distribution in
                # any account could read it.
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${CrmDistributionId}"

Outputs:
  InstaFrontendBucketName:
    Description: S3 bucket holding the built Instagram Solution frontend
    Value: !Ref InstaFrontendBucket
    Export:
      Name: !Sub "${EnvironmentName}-realestateflow-insta-frontend-bucket"

  InstaFrontendBucketRegionalDomainName:
    Description: >
      Pass this as InstaFrontendBucketDomainName to the CRM frontend stack to wire
      up the /insta/* behavior.
    Value: !GetAtt InstaFrontendBucket.RegionalDomainName
    Export:
      Name: !Sub "${EnvironmentName}-realestateflow-insta-frontend-origin-domain"

  BucketPolicyAttached:
    Description: Whether the CloudFront read policy is attached yet (step 3 of the deploy order)
    Value: !If [HasCrmDistribution, "yes", "no - redeploy with CrmDistributionId"]
