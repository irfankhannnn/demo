AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Follow-up Agent Service - schedules, retries and escalates AI follow-up calls
  for the RealtyFlow CRM. Consumes CRM lead/meeting events and ai-calling-service
  call.ended events from the default EventBridge bus, places calls through
  ai-calling-service, and reports outcomes and escalations back to the CRM.

# =============================================================================
# Naming: every physical resource is <env>-realestateflow-followup-<resource>
# (env FIRST), matching the other services in this account. Nothing here is
# hardcoded to an environment. Keep this file plain ASCII - AWS CLI v2 on
# Windows reads it in cp1252.
# =============================================================================

Parameters:

  EnvironmentName:
    Type: String
    AllowedValues: [dev, prod]
    Description: >-
      Deployment environment. Forced from deploy.sh's CLI argument, never read
      from whatever the .env file happens to say.

  # ---- Lambda packaging -----------------------------------------------------

  LambdaRuntime:
    Type: String
    Default: nodejs20.x
    AllowedValues: [nodejs20.x, nodejs22.x]
    Description: >-
      nodejs20.x preinstalls the AWS SDK v3 clients this service needs
      (DynamoDB, Secrets Manager). nodejs22.x does not ship all of them.

  LambdaMemorySize:
    Type: Number
    Default: 512
    MinValue: 256
    MaxValue: 3008

  LambdaTimeout:
    Type: Number
    Default: 30
    MinValue: 10
    MaxValue: 900
    Description: API Lambda timeout. Requests are short CRM/DynamoDB round-trips.

  WorkerTimeout:
    Type: Number
    Default: 120
    MinValue: 30
    MaxValue: 900
    Description: >-
      Worker Lambda timeout. One dispatcher tick may place several calls, each a
      CRM snapshot plus an ai-calling-service round-trip.

  LambdaCodeS3Bucket:
    Type: String
    Description: Artifact bucket holding the Lambda deployment package

  LambdaCodeS3Key:
    Type: String
    Description: S3 key of the Lambda deployment package (set fresh every deploy)

  # ---- Data store -----------------------------------------------------------

  FollowupTableName:
    Type: String
    Description: >-
      DynamoDB table for follow-up jobs and attempts. Must be
      <env>-realestateflow-followup-data - deploy.sh enforces the prefix.

  # ---- CRM integration (this service -> CRM) --------------------------------

  CrmInternalApiDomainName:
    Type: String
    AllowedPattern: "^[A-Za-z0-9.-]+$"
    Description: >-
      API Gateway custom domain the CRM API is mapped on (host only). Used for
      the lead snapshot, escalations and notes. Raw execute-api hosts are rejected.

  CrmInternalApiBasePath:
    Type: String
    AllowedPattern: "^[A-Za-z0-9_-]+$"
    Description: The CRM API's base path on that domain (devrealestatecrm / prodrealestatecrm).

  CrmInternalApiKey:
    Type: String
    NoEcho: true
    Description: >-
      Shared secret presented as x-api-key to the CRM's /api/internal/followups/*
      routes. Must equal agency-app/api/.env.<env>'s FOLLOWUP_INTERNAL_API_KEY.

  # ---- ai-calling-service integration (this service -> ai-calling) ----------

  AiCallingServiceDomainName:
    Type: String
    AllowedPattern: "^[A-Za-z0-9.-]+$"
    Description: ai-calling-service's custom domain (host only).

  AiCallingServiceBasePath:
    Type: String
    AllowedPattern: "^[A-Za-z0-9_-]+$"
    Description: ai-calling-service's base path (devrealestateagencyai / prodrealestateagencyai).

  AiCallingCallerApiKey:
    Type: String
    NoEcho: true
    Description: >-
      Presented as x-api-key on ai-calling-service's /api/ai-calling/* routes.
      Must equal agency-app/ai-calling/.env.<env>'s CRM_CALLER_API_KEY. Tenant-
      crossing credential - server-side only.

  # ---- Inbound auth (CRM -> this service) -----------------------------------

  CrmCallerApiKey:
    Type: String
    NoEcho: true
    Description: >-
      Shared secret the CRM backend presents on /api/followup/* routes. Must
      equal agency-app/api/.env.<env>'s FOLLOWUP_CALLER_API_KEY. x-tenant-id is trusted
      only because the caller proved it holds this key.

  # ---- API surface ----------------------------------------------------------

  ApiStageName:
    Type: String
    Default: v1

  AllowedOrigins:
    Type: String
    Description: >-
      Comma-separated CORS allowlist. Only the CRM backend calls this service;
      the first entry is used for API Gateway's own 4XX/5XX responses.

  FollowupApiDomainName:
    Type: String
    AllowedPattern: "^[A-Za-z0-9.-]+$"
    Description: >-
      Shared API Gateway custom domain: services-api.realestateflow.in for prod,
      services-api.cloudberrysolutions.in for dev.

  FollowupApiBasePath:
    Type: String
    AllowedPattern: "^[A-Za-z0-9_-]+$"
    Description: Single base path segment - prodrealestatefollowup / devrealestatefollowup.

  EnableCustomDomainMapping:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']

  EnableBasePathStrip:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      Must be 'true' together with EnableCustomDomainMapping. API Gateway does
      not strip the base path from a Lambda proxy event; lambda-api.js does.

  # ---- Scheduling policy ----------------------------------------------------

  DispatchScheduleExpression:
    Type: String
    Default: 'rate(5 minutes)'
    Description: How often the worker places due calls and sweeps stuck ones.

  DefaultMaxAttempts:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 5

  DefaultRetryGapMinutes:
    Type: Number
    Default: 45
    MinValue: 5
    MaxValue: 720

  DefaultPostVisitDelayMinutes:
    Type: Number
    Default: 120
    MinValue: 0
    MaxValue: 1440

  DefaultBusinessHoursStart:
    Type: String
    Default: '10:00'
    AllowedPattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"

  DefaultBusinessHoursEnd:
    Type: String
    Default: '19:00'
    AllowedPattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"

  DefaultTimezone:
    Type: String
    Default: Asia/Kolkata

  CallWatchdogMinutes:
    Type: Number
    Default: 20
    MinValue: 5
    MaxValue: 180
    Description: A job stuck in "calling" longer than this counts as a failed attempt.

  # ---- Operations -----------------------------------------------------------

  AlertsTopicArn:
    Type: String
    Default: ''
    Description: >-
      Optional SNS topic ARN for CloudWatch alarms (worker errors, DLQ depth).
      Blank disables the alarms.

  LogLevel:
    Type: String
    Default: info
    AllowedValues: [debug, info, warn, error]

  LogRetentionDays:
    Type: Number
    Default: 30

Rules:
  CustomDomainMappingRequired:
    Assertions:
      - Assert: !Equals [!Ref EnableCustomDomainMapping, 'true']
        AssertDescription: >-
          EnableCustomDomainMapping must be 'true'. The CRM reaches this service
          only through the custom domain + base path.
      - Assert: !Equals [!Ref EnableBasePathStrip, 'true']
        AssertDescription: >-
          EnableBasePathStrip must be 'true' with the mapping on, or every
          request 404s.

Conditions:
  CustomDomainMappingEnabled: !Equals [!Ref EnableCustomDomainMapping, 'true']
  HasAlertsTopic: !Not [!Equals [!Ref AlertsTopicArn, '']]

Resources:

  # ---------------------------------------------------------------------------
  # DynamoDB
  # ---------------------------------------------------------------------------

  # Jobs, attempts and dedupe guards. Holds customer names and call summaries,
  # so Retain + PITR + SSE. TTL expires finished jobs and stale guards.
  FollowupTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref FollowupTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
        - AttributeName: GSI3PK
          AttributeType: S
        - AttributeName: GSI3SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        # Due jobs by day bucket, and the CALLING partition for the watchdog.
        - IndexName: due-index
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        # Jobs for one tenant, newest first - the CRM's lead timeline view.
        - IndexName: tenant-index
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        # call.ended -> job lookup by callSessionId.
        - IndexName: call-index
          KeySchema:
            - AttributeName: GSI3PK
              KeyType: HASH
            - AttributeName: GSI3SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Service
          Value: realestateflow-followup

  # ---------------------------------------------------------------------------
  # Secrets Manager
  # ---------------------------------------------------------------------------

  FollowupSecrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${EnvironmentName}-realestateflow-followup-credentials"
      Description: CRM / ai-calling shared secrets for the follow-up agent service
      SecretString: !Sub |
        {
          "CRM_INTERNAL_API_KEY": "${CrmInternalApiKey}",
          "AI_CALLING_CALLER_API_KEY": "${AiCallingCallerApiKey}",
          "CRM_CALLER_API_KEY": "${CrmCallerApiKey}"
        }
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Service
          Value: realestateflow-followup

  # ---------------------------------------------------------------------------
  # Dead-letter queue for the worker's async invocations
  # ---------------------------------------------------------------------------

  WorkerDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${EnvironmentName}-realestateflow-followup-worker-dlq"
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Service
          Value: realestateflow-followup

  # ---------------------------------------------------------------------------
  # Lambda
  # ---------------------------------------------------------------------------

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${EnvironmentName}-realestateflow-followup-api-lambda"
      RetentionInDays: !Ref LogRetentionDays

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${EnvironmentName}-realestateflow-followup-worker-lambda"
      RetentionInDays: !Ref LogRetentionDays

  FollowupLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-realestateflow-followup-lambda-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: followup-lambda-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${EnvironmentName}-realestateflow-followup-api-lambda:*"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${EnvironmentName}-realestateflow-followup-worker-lambda:*"
              # Exactly this service's own table. CRM data is reached over the
              # internal API with an api key, never by direct table access.
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt FollowupTable.Arn
                  - !Sub "${FollowupTable.Arn}/index/*"
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref FollowupSecrets
              # Lambda writes failed async events to the DLQ on our behalf.
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt WorkerDlq.Arn

  ApiLambda:
    Type: AWS::Lambda::Function
    DependsOn: ApiLogGroup
    Properties:
      FunctionName: !Sub "${EnvironmentName}-realestateflow-followup-api-lambda"
      Runtime: !Ref LambdaRuntime
      Handler: src/lambda-api.handler
      Role: !GetAtt FollowupLambdaRole.Arn
      MemorySize: !Ref LambdaMemorySize
      Timeout: !Ref LambdaTimeout
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      TracingConfig:
        Mode: Active
      Environment:
        # Secrets are NOT here - they live in Secrets Manager and are resolved
        # at cold start via SECRETS_ARN.
        Variables:
          NODE_ENV: production
          ENVIRONMENT: !Ref EnvironmentName
          FOLLOWUP_TABLE_NAME: !Ref FollowupTableName
          CRM_INTERNAL_API_DOMAIN_NAME: !Ref CrmInternalApiDomainName
          CRM_INTERNAL_API_BASE_PATH: !Ref CrmInternalApiBasePath
          AI_CALLING_SERVICE_DOMAIN_NAME: !Ref AiCallingServiceDomainName
          AI_CALLING_SERVICE_BASE_PATH: !Ref AiCallingServiceBasePath
          DEFAULT_MAX_ATTEMPTS: !Ref DefaultMaxAttempts
          DEFAULT_RETRY_GAP_MINUTES: !Ref DefaultRetryGapMinutes
          DEFAULT_POST_VISIT_DELAY_MINUTES: !Ref DefaultPostVisitDelayMinutes
          DEFAULT_BUSINESS_HOURS_START: !Ref DefaultBusinessHoursStart
          DEFAULT_BUSINESS_HOURS_END: !Ref DefaultBusinessHoursEnd
          DEFAULT_TIMEZONE: !Ref DefaultTimezone
          CALL_WATCHDOG_MINUTES: !Ref CallWatchdogMinutes
          API_BASE_PATH_PREFIX: !Ref FollowupApiBasePath
          ENABLE_BASE_PATH_STRIP: !Ref EnableBasePathStrip
          ALLOWED_ORIGINS: !Ref AllowedOrigins
          LOG_LEVEL: !Ref LogLevel
          SECRETS_ARN: !Ref FollowupSecrets
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Service
          Value: realestateflow-followup

  WorkerLambda:
    Type: AWS::Lambda::Function
    DependsOn: WorkerLogGroup
    Properties:
      FunctionName: !Sub "${EnvironmentName}-realestateflow-followup-worker-lambda"
      Runtime: !Ref LambdaRuntime
      Handler: src/lambda-worker.handler
      Role: !GetAtt FollowupLambdaRole.Arn
      MemorySize: !Ref LambdaMemorySize
      Timeout: !Ref WorkerTimeout
      # One tick at a time: the dispatcher claims jobs conditionally, but a
      # single in-flight worker keeps the ordering simple to reason about.
      ReservedConcurrentExecutions: 2
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          NODE_ENV: production
          ENVIRONMENT: !Ref EnvironmentName
          FOLLOWUP_TABLE_NAME: !Ref FollowupTableName
          CRM_INTERNAL_API_DOMAIN_NAME: !Ref CrmInternalApiDomainName
          CRM_INTERNAL_API_BASE_PATH: !Ref CrmInternalApiBasePath
          AI_CALLING_SERVICE_DOMAIN_NAME: !Ref AiCallingServiceDomainName
          AI_CALLING_SERVICE_BASE_PATH: !Ref AiCallingServiceBasePath
          DEFAULT_MAX_ATTEMPTS: !Ref DefaultMaxAttempts
          DEFAULT_RETRY_GAP_MINUTES: !Ref DefaultRetryGapMinutes
          DEFAULT_POST_VISIT_DELAY_MINUTES: !Ref DefaultPostVisitDelayMinutes
          DEFAULT_BUSINESS_HOURS_START: !Ref DefaultBusinessHoursStart
          DEFAULT_BUSINESS_HOURS_END: !Ref DefaultBusinessHoursEnd
          DEFAULT_TIMEZONE: !Ref DefaultTimezone
          CALL_WATCHDOG_MINUTES: !Ref CallWatchdogMinutes
          LOG_LEVEL: !Ref LogLevel
          SECRETS_ARN: !Ref FollowupSecrets
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Service
          Value: realestateflow-followup

  # Async invocation policy: two retries, then the event lands in the DLQ with
  # its original payload so it can be replayed after a fix.
  WorkerInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref WorkerLambda
      Qualifier: "$LATEST"
      MaximumRetryAttempts: 2
      MaximumEventAgeInSeconds: 3600
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt WorkerDlq.Arn

  # ---------------------------------------------------------------------------
  # EventBridge rules (default bus)
  # ---------------------------------------------------------------------------

  DispatchScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${EnvironmentName}-realestateflow-followup-dispatch"
      Description: Place due follow-up calls and sweep stuck ones
      ScheduleExpression: !Ref DispatchScheduleExpression
      State: ENABLED
      Targets:
        - Arn: !GetAtt WorkerLambda.Arn
          Id: FollowupDispatchTarget

  DispatchSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WorkerLambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DispatchScheduleRule.Arn

  LeadCreatedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${EnvironmentName}-realestateflow-followup-lead-created"
      Description: Schedule a site-visit confirmation call for new Instagram leads
      EventPattern:
        source:
          - 'crm.leads'
        detail-type:
          - 'lead.created'
      State: ENABLED
      Targets:
        - Arn: !GetAtt WorkerLambda.Arn
          Id: FollowupLeadCreatedTarget

  LeadCreatedPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WorkerLambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt LeadCreatedRule.Arn

  MeetingRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${EnvironmentName}-realestateflow-followup-meeting"
      Description: Schedule a post-visit call when a site visit is completed
      EventPattern:
        source:
          - 'crm.meetings'
        detail-type:
          - 'meeting.completed'
          - 'meeting.cancelled'
      State: ENABLED
      Targets:
        - Arn: !GetAtt WorkerLambda.Arn
          Id: FollowupMeetingTarget

  MeetingPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WorkerLambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt MeetingRule.Arn

  CallEndedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${EnvironmentName}-realestateflow-followup-call-ended"
      Description: Apply retry / escalation rules when a follow-up call ends
      EventPattern:
        source:
          - 'aicalling.calls'
        detail-type:
          - 'call.ended'
      State: ENABLED
      Targets:
        - Arn: !GetAtt WorkerLambda.Arn
          Id: FollowupCallEndedTarget

  CallEndedPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WorkerLambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt CallEndedRule.Arn

  # ---------------------------------------------------------------------------
  # API Gateway (management API for the CRM backend)
  # ---------------------------------------------------------------------------

  FollowupApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "${EnvironmentName}-realestateflow-followup-api"
      Description: Follow-up Agent Service API
      EndpointConfiguration:
        Types: [REGIONAL]
      MinimumCompressionSize: 1024

  ApiGatewayResponseDefault4XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref FollowupApi
      ResponseType: DEFAULT_4XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: !Sub
          - "'${FirstOrigin}'"
          - FirstOrigin: !Select [0, !Split [",", !Ref AllowedOrigins]]
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,x-tenant-id,x-api-key'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"

  ApiGatewayResponseDefault5XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref FollowupApi
      ResponseType: DEFAULT_5XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: !Sub
          - "'${FirstOrigin}'"
          - FirstOrigin: !Select [0, !Split [",", !Ref AllowedOrigins]]
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,x-tenant-id,x-api-key'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"

  ApiProxyResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref FollowupApi
      ParentId: !GetAtt FollowupApi.RootResourceId
      PathPart: "{proxy+}"

  # Authorization is enforced inside the Lambda (shared api key + tenant
  # header), same as ai-calling-service. NONE here means "no gateway-level
  # auth", never "no auth".
  ApiRootMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref FollowupApi
      ResourceId: !GetAtt FollowupApi.RootResourceId
      HttpMethod: ANY
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiLambda.Arn}/invocations"

  ApiProxyMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref FollowupApi
      ResourceId: !Ref ApiProxyResource
      HttpMethod: ANY
      AuthorizationType: NONE
      RequestParameters:
        method.request.path.proxy: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiLambda.Arn}/invocations"

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - ApiRootMethod
      - ApiProxyMethod
    Properties:
      RestApiId: !Ref FollowupApi

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref FollowupApi
      DeploymentId: !Ref ApiDeployment
      StageName: !Ref ApiStageName
      TracingEnabled: true
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          MetricsEnabled: true
          # Never ON: request logging would put customer names and call
          # summaries into CloudWatch in full.
          DataTraceEnabled: false
          LoggingLevel: ERROR
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Service
          Value: realestateflow-followup

  FollowupApiBasePathMapping:
    Type: AWS::ApiGateway::BasePathMapping
    Condition: CustomDomainMappingEnabled
    DependsOn: ApiStage
    Properties:
      DomainName: !Ref FollowupApiDomainName
      RestApiId: !Ref FollowupApi
      BasePath: !Ref FollowupApiBasePath
      Stage: !Ref ApiStageName

  ApiLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${FollowupApi}/*/*/*"

  # ---------------------------------------------------------------------------
  # Alarms (optional)
  # ---------------------------------------------------------------------------

  WorkerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlertsTopic
    Properties:
      AlarmName: !Sub "${EnvironmentName}-realestateflow-followup-worker-errors"
      AlarmDescription: Follow-up worker Lambda is failing
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref WorkerLambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopicArn]
      OKActions: [!Ref AlertsTopicArn]

  WorkerDlqDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlertsTopic
    Properties:
      AlarmName: !Sub "${EnvironmentName}-realestateflow-followup-worker-dlq-depth"
      AlarmDescription: Follow-up events landed in the dead-letter queue
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt WorkerDlq.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopicArn]
      OKActions: [!Ref AlertsTopicArn]

Outputs:

  FollowupTableNameOutput:
    Description: Follow-up DynamoDB table name
    Value: !Ref FollowupTableName
    Export:
      Name: !Sub "${AWS::StackName}-TableName"

  FollowupApiId:
    Description: REST API id (deploy.sh uses this to force a stage deployment)
    Value: !Ref FollowupApi
    Export:
      Name: !Sub "${AWS::StackName}-ApiId"

  FollowupApiBaseUrl:
    Condition: CustomDomainMappingEnabled
    Description: Public base URL (custom domain + base path) the CRM backend calls
    Value: !Sub "https://${FollowupApiDomainName}/${FollowupApiBasePath}"
    Export:
      Name: !Sub "${AWS::StackName}-FollowupApiBaseUrl"

  ApiLambdaName:
    Description: API Lambda function name (used by rollback-code)
    Value: !Ref ApiLambda
    Export:
      Name: !Sub "${AWS::StackName}-ApiLambdaName"

  WorkerLambdaName:
    Description: Worker Lambda function name (used by rollback-code)
    Value: !Ref WorkerLambda
    Export:
      Name: !Sub "${AWS::StackName}-WorkerLambdaName"

  WorkerDlqUrl:
    Description: Dead-letter queue for failed worker invocations
    Value: !Ref WorkerDlq
    Export:
      Name: !Sub "${AWS::StackName}-WorkerDlqUrl"

  SecretsArn:
    Description: Secrets Manager ARN the Lambdas resolve at cold start
    Value: !Ref FollowupSecrets
    Export:
      Name: !Sub "${AWS::StackName}-SecretsArn"
