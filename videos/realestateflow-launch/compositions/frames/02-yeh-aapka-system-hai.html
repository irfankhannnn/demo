  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var FRAME_ID = "02-yeh-aapka-system-hai";

      // ---------------------------------------------------------------
      // Deterministic per-element table. Every position, tilt, depth and
      // entry edge derives from the element INDEX — no Math.random(),
      // no Date.now(). Identical on every render and every seek.
      // Offsets are px from the stage centre (canvas 470, 860).
      // ---------------------------------------------------------------
      var CARDS = [
        // i, spreadX, spreadY, tilt, depth, edge
        { x: -95, y: -520, rot: -2.6, depth: 3, edge: "top" },
        { x: -215, y: -335, rot: 3.1, depth: 2, edge: "left" },
        { x: 175, y: -175, rot: -1.8, depth: 1, edge: "right" },
        { x: -180, y: 195, rot: 2.4, depth: 1, edge: "bottom" },
        { x: 190, y: 370, rot: -3.2, depth: 2, edge: "left" },
        { x: -85, y: 545, rot: 2.0, depth: 3, edge: "top" },
      ];

      // depth ladder — back cards smaller and dimmed, front cards full contrast
      var DEPTH = {
        1: { scale: 1.0, opacity: 1.0, dof: 0, dim: 1.0 },
        2: { scale: 0.88, opacity: 0.86, dof: 5, dim: 0.74 },
        3: { scale: 0.74, opacity: 0.66, dof: 11, dim: 0.52 },
      };

      // off-stage entry points, one per edge
      var OFF = { top: -1150, bottom: 1150, left: -900, right: 900 };

      // scene 1 : 0.0–0.8  · scene 2 : 0.8–2.4
      var ENTER_AT = [0.0, 0.12, 0.82, 1.1, 1.38, 1.66];
      var ENTER_DUR = 0.75;

      // scene 3 : 2.4–3.2 — cluster -> inward close + depth-of-field
      var CLOSE_AT = 2.42;
      var CLOSE_DUR = 0.78;
      var CLOSE_K = 0.6; // center-outward-expansion, run INWARD
      var CROWD_SWELL = 1.07;

      // scene 4 : 3.2–4.5 — crowd dims + freezes, payoff lands
      var DIM_AT = 3.24;
      var DIM_DUR = 0.34;
      var POP_AT = 3.34;
      var POP_DUR = 0.6;

      var tl = gsap.timeline({ paused: true });
      var cards = gsap.utils.toArray("#f02-crowd-inner .f02-card");

      cards.forEach(function (el, i) {
        var c = CARDS[i];
        var d = DEPTH[c.depth];

        var startX = c.x;
        var startY = c.y;
        if (c.edge === "top" || c.edge === "bottom") startY = OFF[c.edge];
        else startX = OFF[c.edge];

        // ---- Scenes 1 & 2 — arrival from an edge, long-tail settle ----
        tl.fromTo(
          el,
          {
            xPercent: -50,
            yPercent: -50,
            x: startX,
            y: startY,
            rotation: c.rot,
            scale: d.scale,
          },
          {
            x: c.x,
            y: c.y,
            rotation: c.rot,
            scale: d.scale,
            duration: ENTER_DUR,
            ease: "power3.out",
          },
          ENTER_AT[i],
        );
        tl.fromTo(
          el,
          { opacity: 0 },
          { opacity: d.opacity, duration: 0.3, ease: "power1.out" },
          ENTER_AT[i],
        );

        // ---- Scene 3 — the signature move: the crowd closes IN ----
        tl.to(
          el,
          {
            x: c.x * CLOSE_K,
            y: c.y * CLOSE_K,
            scale: d.scale * CROWD_SWELL,
            duration: CLOSE_DUR,
            ease: "power2.inOut",
          },
          CLOSE_AT,
        );

        // ---- Scene 3 — depth-of-field settles on the OUTER ring.
        //      Depth 1 (the cards hugging the open centre) stays sharp. ----
        if (d.dof > 0) {
          tl.to(
            el,
            {
              "--dof": d.dof + "px",
              opacity: d.dim,
              duration: CLOSE_DUR,
              ease: "power2.inOut",
            },
            CLOSE_AT,
          );
        }
      });

      // ---- Scene 4 — the crowd dims to ~45% and FREEZES ----
      tl.to(
        "#f02-crowd-inner",
        { opacity: 0.58, duration: DIM_DUR, ease: "power2.out" },
        DIM_AT,
      );

      // ---- Scene 4 — payoff lands flat on top (spring-pop, smooth settle) ----
      tl.fromTo(
        "#f02-payoff",
        { scale: 0, opacity: 0 },
        {
          scale: 1,
          opacity: 1,
          duration: POP_DUR,
          ease: "power3.out",
        },
        POP_AT,
      );

      // held still to 4.5s — deadpan. No exit tween (not the final frame).

      window.__timelines = window.__timelines || {};
      window.__timelines[FRAME_ID] = tl;
    })();
  </script>
