    (function () {
      var P = ".fr-01-sochna-pada-";
      var TOTAL = 4;

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var question = document.querySelector(P + "question");
      var payoff = document.querySelector(P + "payoff");
      var payoffInner = document.querySelector(P + "payoff-inner");
      var words = gsap.utils.toArray(P + "word");

      /* ── Scene 1 (0.0–1.6s) ─────────────────────────────────────────
         Per-word staggered reveal on a long-tail settle (power3.out).
         First word is on screen at t=0; the last lands ~1.15s, leaving
         a beat of quiet before the hold. Nothing else is in frame. */
      var STAGGER = 0.075;
      words.forEach(function (el, i) {
        tl.fromTo(
          el,
          { opacity: 0, yPercent: 42 },
          { opacity: 1, yPercent: 0, duration: 0.62, ease: "power3.out" },
          i * STAGGER
        );
      });

      /* ── Scene 2 (1.6–2.6s) ─────────────────────────────────────────
         DELIBERATE COMPLETELY STILL HOLD. No tween is authored in this
         window — no jitter, no drift, no camera. The silence is the
         persuasion; the viewer tries to answer and cannot. */

      /* ── Scene 3 (2.6–4.0s) ─────────────────────────────────────────
         discrete-text-sequence: entire text STATES replaced at a
         threshold. One linear driver, reverse-search for the latest
         state whose t has passed, DOM swap only on transition
         (lastKey guard). The jump is instant — a hard cut, never a
         fade — which is what makes the replacement read as a cut. */
      var SWAP_AT = 2.6;
      var STATES = [
        { t: 0.0, key: "question" },
        { t: SWAP_AT, key: "payoff" },
      ];

      function stateAt(time) {
        for (var i = STATES.length - 1; i >= 0; i--) {
          if (time >= STATES[i].t) return STATES[i].key;
        }
        return STATES[0].key;
      }

      var driver = { t: 0 };
      var lastKey = "";

      tl.to(
        driver,
        {
          t: TOTAL,
          duration: TOTAL,
          ease: "none",
          onUpdate: function () {
            var key = stateAt(driver.t);
            if (key === lastKey) return;
            lastKey = key;
            /* NOTE: must be `display`, not `visibility`. CSS `visibility` is
               inherited but a descendant can override a hidden ancestor back to
               `visible` — so an inline visibility:visible here survives the
               harness hiding this frame's clip at t=4s, and the payoff then
               bleeds over every later frame in the video. `display:none` on the
               element itself cannot be overridden that way. */
            question.style.display = key === "question" ? "block" : "none";
            payoff.style.display = key === "payoff" ? "block" : "none";
          },
        },
        0
      );

      /* spring-pop-entrance — scale 0 → 1 on a smooth long-tail settle.
         power3.out, no overshoot. fromTo so t=0 is correct under seek.
         transform-origin 0% 50% = the anchor the question vacated. */
      tl.fromTo(
        payoff,
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" },
        SWAP_AT

         bounded 2px rise-and-return on an inner wrapper (so it never
         fights the pop's transform), landing back at rest by t=4.0. */
      tl.to(payoffInner, { y: -2, duration: 0.45, ease: "sine.inOut" }, 3.15);
      tl.to(payoffInner, { y: 0, duration: 0.4, ease: "sine.inOut" }, 3.6);
