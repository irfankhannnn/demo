  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="05-khata-book"]');

      var label = root.querySelector("#f05-label");
      var words = Array.prototype.slice.call(root.querySelectorAll(".f05-word"));
      var card = root.querySelector("#f05-card");
      var edge = root.querySelector("#f05-cardedge");
      var inner = root.querySelector("#f05-cardinner");
      var rows = Array.prototype.slice.call(root.querySelectorAll(".f05-row"));
      var amt2 = root.querySelector("#f05-amt2");
      var settled = root.querySelector("#f05-settled");

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* ——— Scene 1 (0.0–0.7s): the marigold Khata tile from frame 04 morphs up
         and outward into the full ledger card. Frame 04's tile sits at grid
         col 3 / row 3 — centre (599.5, 884.5), 199x205. This card's centre is
         (491, 893). The fromTo below starts the card exactly on that tile's
         centre and scale, so the cut reads as one continuous object.
         card-morph-anchor: uniform scale only, never width/height. ——— */
      var TILE_DX = 108.5;
      var TILE_DY = -8.5;
      var TILE_SCALE = 0.25;

      tl.fromTo(
        card,
        {
          x: TILE_DX,
          y: TILE_DY,
          scale: TILE_SCALE,
          backgroundColor: "rgb(255, 122, 26)",
          borderRadius: 14,
        },
        {
          x: 0,
          y: 0,
          scale: 1,
          backgroundColor: "rgb(37, 28, 22)",
          borderRadius: 18,
          duration: 0.66,
          ease: "power3.out",
        },
        0.0,
      );

      /* the marigold top edge resolves as the card's ground recedes */
      tl.fromTo(edge, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.34);

      /* card contents stay out until the card itself has arrived */
      tl.fromTo(inner, { opacity: 0 }, { opacity: 1, duration: 0.20, ease: "power2.out" }, 0.36);

      tl.fromTo(label, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.36, ease: "power3.out" }, 0.04);

      /* ——— Scene 2 (0.7–1.6s): headline per-word reveal ——— */
      var WORD_AT = 0.68;
      var WORD_STAGGER = 0.075;

      words.forEach(function (el, i) {
        tl.fromTo(
          el,
          { opacity: 0, y: 22 },
          { opacity: 1, y: 0, duration: 0.44, ease: "power3.out" },
          WORD_AT + i * WORD_STAGGER,
        );
      });
      /* last word (i=7) lands at 0.68 + 0.525 + 0.44 = 1.645s */

      /* ——— Scene 3 (1.6–2.4s): four ledger rows cascade, index-derived stagger ——— */
      var ROW_AT = 1.6;
      var ROW_STAGGER = 0.14;

      rows.forEach(function (el, i) {
        tl.fromTo(
          el,
          { opacity: 0, y: 26 },
          { opacity: 1, y: 0, duration: 0.46, ease: "power3.out" },
          ROW_AT + i * ROW_STAGGER,
        );
      });
      /* last row (i=3) lands at 1.6 + 0.42 + 0.46 = 2.48s */

      /* ——— Scene 4 (2.4–3.0s): row 2 resolves to Settled — the ONLY green in
         the video. asr-keyword-glow, settling FLAT (no residual bloom). ——— */
      tl.to(amt2, { opacity: 0, y: -10, duration: 0.2, ease: "power2.in" }, 2.44);
      tl.fromTo(
        settled,
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.34, ease: "power3.out" },
        2.6,
      );

      /* glow envelope decays fully to zero so the plane stays flat at rest */
      var driver = { t: 0 };
      tl.to(
        driver,
        {
          t: 1,
          duration: 0.4,
          ease: "none",
          onUpdate: function () {
            var t = driver.t;
            var g = t < 0.4 ? t / 0.4 : 1 - (t - 0.4) / 0.6;
            if (g < 0) g = 0;
            settled.style.textShadow = "0 0 " + 16 * g + "px rgba(31, 170, 89, " + 0.7 * g + ")";
          },
        },
        2.6,
      );

      /* held still to 3.0s — no drift, no push. */

      window.__timelines["05-khata-book"] = tl;
    })();
  </script>
