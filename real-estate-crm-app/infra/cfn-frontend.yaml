AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CRM Frontend (real-estate-crm-app) — static hosting via S3 + CloudFront.

  Deploy this stack in ap-south-1 (Mumbai) so the S3 origin bucket lives in
  that region. CloudFront itself is a global edge network — no region choice
  needed for the distribution — but PriceClass_200/PriceClass_All are
  required for the distribution to serve out of Indian edge locations.

  NOTE: If you set CustomDomainName, AcmCertificateArn MUST reference a
  certificate issued in us-east-1 — this is a hard CloudFront requirement
  regardless of which region this stack is deployed in.

  Naming convention: every physical resource this stack creates is named
  <dev|prod>-realestateflow-crm-frontend-<resource> (env first), matching
  the convention already live on prod-realestateflow-networking-common.
  infra/deploy.sh derives BucketName as ${EnvironmentName}-${SERVICE_NAME}
  by default (SERVICE_NAME=realestateflow-crm-frontend) unless overridden.

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues: [dev, prod]
    Description: Deployment environment (matches the .env.<EnvironmentName> file used to build the app)

  BucketName:
    Type: String
    Description: S3 bucket name for the built frontend assets (must be globally unique)
    MinLength: 3
    MaxLength: 63
    AllowedPattern: "^[a-z0-9][a-z0-9.-]*[a-z0-9]$"
    ConstraintDescription: >
      Bucket name must be lowercase, 3-63 characters, and can contain
      letters, numbers, dots, and hyphens.

  IndexDocument:
    Type: String
    Default: index.html
    Description: SPA entry document served at the site root

  ErrorDocument:
    Type: String
    Default: index.html
    Description: >
      Document returned (with a 200) for 403/404 responses from S3, so
      client-side routes (React Router) resolve correctly on refresh/deep-link.

  PriceClass:
    Type: String
    Default: PriceClass_200
    AllowedValues:
      - PriceClass_100
      - PriceClass_200
      - PriceClass_All
    Description: >
      CloudFront price class. PriceClass_200 includes Asia/India edge
      locations; PriceClass_100 (US/Canada/Europe only) excludes India.

  CustomDomainName:
    Type: String
    Default: ''
    Description: Optional CNAME/alias for the distribution (e.g. crm.realestateflow.in)

  AcmCertificateArn:
    Type: String
    Default: ''
    Description: >
      ACM certificate ARN for CustomDomainName. Must be issued in us-east-1.
      Required only when CustomDomainName is set.

  HostedZoneId:
    Type: String
    Default: ''
    Description: Optional Route53 hosted zone ID to create an alias record for CustomDomainName

  WafWebAclArn:
    Type: String
    Default: ''
    Description: Optional AWS WAF WebACL ARN (must be scope CLOUDFRONT, created in us-east-1)

  InstaFrontendBucketDomainName:
    Type: String
    Default: ''
    Description: >
      Optional. Regional domain name of the Instagram Solution frontend bucket
      (the InstaFrontendBucketRegionalDomainName output of the
      <env>-realestateflow-insta-frontend stack). When set, this stack adds a
      second origin and an /insta/* cache behavior so that app is served
      same-origin from this distribution, and the CRM's existing bearer token
      works with no cross-origin handoff and no CORS.

      Leave empty and this template behaves exactly as it did before - no extra
      origin, no extra behavior, no OAC. See
      docs/insta-sol-ms-docs/09-CLOUDFRONT-INTEGRATION.md for the deploy order.

  InstaFrontendPathPattern:
    Type: String
    Default: /insta/*
    Description: Path pattern routed to the Instagram Solution frontend origin.

Conditions:
  HasCustomDomain: !Not [!Equals [!Ref CustomDomainName, '']]
  HasInstaFrontend: !Not [!Equals [!Ref InstaFrontendBucketDomainName, '']]
  HasHostedZone: !And
    - !Condition HasCustomDomain
    - !Not [!Equals [!Ref HostedZoneId, '']]
  HasWaf: !Not [!Equals [!Ref WafWebAclArn, '']]

Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Service
          Value: realestateflow-crm-frontend

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${EnvironmentName}-realestateflow-crm-frontend-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Separate OAC for the Instagram Solution bucket. CloudFront requires one OAC
  # per origin - they cannot be shared - and it lives here rather than in the
  # insta stack because OAC is only meaningful alongside the distribution that
  # uses it.
  # CloudFront's CustomErrorResponses are distribution-wide, not per-behavior, so
  # the existing 403/404 -> /index.html rule would send a deep link like
  # /insta/enquiries to the CRM's index.html and boot the user into the wrong app.
  # This function rewrites any extensionless /insta/* path to /insta/index.html at
  # the edge, before the origin request, so the insta SPA resolves its own routes.
  InstaSpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Condition: HasInstaFrontend
    Properties:
      Name: !Sub "${EnvironmentName}-realestateflow-insta-spa-rewrite"
      AutoPublish: true
      FunctionConfig:
        Comment: Rewrites extensionless /insta/* requests to /insta/index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          // Anything with a file extension is a real asset - leave it alone.
          if (uri.indexOf('.') !== -1) {
            return request;
          }
          request.uri = '/insta/index.html';
          return request;
        }

  InstaOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: HasInstaFrontend
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${EnvironmentName}-realestateflow-insta-frontend-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${EnvironmentName} CRM frontend (real-estate-crm-app)"
        DefaultRootObject: !Ref IndexDocument
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: !Ref PriceClass
        Aliases: !If
          - HasCustomDomain
          - [!Ref CustomDomainName]
          - !Ref "AWS::NoValue"
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref AcmCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        WebACLId: !If [HasWaf, !Ref WafWebAclArn, !Ref "AWS::NoValue"]
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - !If
            - HasInstaFrontend
            - Id: InstaS3Origin
              DomainName: !Ref InstaFrontendBucketDomainName
              OriginAccessControlId: !GetAtt InstaOriginAccessControl.Id
              S3OriginConfig:
                OriginAccessIdentity: ''
            - !Ref "AWS::NoValue"
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          # Managed-CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CacheBehaviors:
          - !If
            - HasInstaFrontend
            - PathPattern: !Ref InstaFrontendPathPattern
              TargetOriginId: InstaS3Origin
              ViewerProtocolPolicy: redirect-to-https
              Compress: true
              AllowedMethods: [GET, HEAD, OPTIONS]
              CachedMethods: [GET, HEAD]
              # Managed-CachingOptimized. The insta app is a hashed-asset Vite
              # build behind an unhashed index.html, same shape as the CRM app,
              # so the same policy is correct.
              CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
              FunctionAssociations:
                - EventType: viewer-request
                  FunctionARN: !GetAtt InstaSpaRewriteFunction.FunctionARN
            - !Ref "AWS::NoValue"
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: !Sub "/${ErrorDocument}"
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: !Sub "/${ErrorDocument}"
            ErrorCachingMinTTL: 10
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Service
          Value: realestateflow-crm-frontend

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  DnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasHostedZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref CustomDomainName
      Type: A
      AliasTarget:
        # Fixed CloudFront alias hosted zone ID (same for every CloudFront distribution)
        HostedZoneId: Z2FDTNDATAQYW2
        DNSName: !GetAtt Distribution.DomainName

Outputs:
  BucketName:
    Description: S3 bucket holding the built frontend assets
    Value: !Ref FrontendBucket

  DistributionId:
    Description: CloudFront distribution ID (used for cache invalidation)
    Value: !Ref Distribution

  DistributionDomainName:
    Description: CloudFront default domain (*.cloudfront.net)
    Value: !GetAtt Distribution.DomainName

  WebsiteURL:
    Description: Public URL for the deployed frontend
    Value: !If
      - HasCustomDomain
      - !Sub "https://${CustomDomainName}"
      - !Sub "https://${Distribution.DomainName}"

  InstaAppURL:
    Condition: HasInstaFrontend
    Description: >
      Public URL for the Instagram Solution app. This is the target the CRM's
      "Instagram" nav item redirects to; because it is the same origin, the CRM's
      stored bearer token is readable by the app with no handoff.
    Value: !If
      - HasCustomDomain
      - !Sub "https://${CustomDomainName}/insta/"
      - !Sub "https://${Distribution.DomainName}/insta/"
