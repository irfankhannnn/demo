AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CRM Frontend (real-estate-crm-app) — static hosting via S3 + CloudFront.

  Deploy this stack in ap-south-1 (Mumbai) so the S3 origin bucket lives in
  that region. CloudFront itself is a global edge network — no region choice
  needed for the distribution — but PriceClass_200/PriceClass_All are
  required for the distribution to serve out of Indian edge locations.

  NOTE: If you set CustomDomainName, AcmCertificateArn MUST reference a
  certificate issued in us-east-1 — this is a hard CloudFront requirement
  regardless of which region this stack is deployed in.

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues: [nonprod, prod]
    Description: Deployment environment (matches the .env.<EnvironmentName> file used to build the app)

  BucketName:
    Type: String
    Description: S3 bucket name for the built frontend assets (must be globally unique)
    MinLength: 3
    MaxLength: 63
    AllowedPattern: "^[a-z0-9][a-z0-9.-]*[a-z0-9]$"
    ConstraintDescription: >
      Bucket name must be lowercase, 3-63 characters, and can contain
      letters, numbers, dots, and hyphens.

  IndexDocument:
    Type: String
    Default: index.html
    Description: SPA entry document served at the site root

  ErrorDocument:
    Type: String
    Default: index.html
    Description: >
      Document returned (with a 200) for 403/404 responses from S3, so
      client-side routes (React Router) resolve correctly on refresh/deep-link.

  PriceClass:
    Type: String
    Default: PriceClass_200
    AllowedValues:
      - PriceClass_100
      - PriceClass_200
      - PriceClass_All
    Description: >
      CloudFront price class. PriceClass_200 includes Asia/India edge
      locations; PriceClass_100 (US/Canada/Europe only) excludes India.

  CustomDomainName:
    Type: String
    Default: ''
    Description: Optional CNAME/alias for the distribution (e.g. crm.realestateflow.in)

  AcmCertificateArn:
    Type: String
    Default: ''
    Description: >
      ACM certificate ARN for CustomDomainName. Must be issued in us-east-1.
      Required only when CustomDomainName is set.

  HostedZoneId:
    Type: String
    Default: ''
    Description: Optional Route53 hosted zone ID to create an alias record for CustomDomainName

  WafWebAclArn:
    Type: String
    Default: ''
    Description: Optional AWS WAF WebACL ARN (must be scope CLOUDFRONT, created in us-east-1)

Conditions:
  HasCustomDomain: !Not [!Equals [!Ref CustomDomainName, '']]
  HasHostedZone: !And
    - !Condition HasCustomDomain
    - !Not [!Equals [!Ref HostedZoneId, '']]
  HasWaf: !Not [!Equals [!Ref WafWebAclArn, '']]

Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Service
          Value: crm-frontend

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${EnvironmentName}-crm-frontend-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${EnvironmentName} CRM frontend (real-estate-crm-app)"
        DefaultRootObject: !Ref IndexDocument
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: !Ref PriceClass
        Aliases: !If
          - HasCustomDomain
          - [!Ref CustomDomainName]
          - !Ref "AWS::NoValue"
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref AcmCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        WebACLId: !If [HasWaf, !Ref WafWebAclArn, !Ref "AWS::NoValue"]
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          # Managed-CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: !Sub "/${ErrorDocument}"
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: !Sub "/${ErrorDocument}"
            ErrorCachingMinTTL: 10
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Service
          Value: crm-frontend

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  DnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasHostedZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref CustomDomainName
      Type: A
      AliasTarget:
        # Fixed CloudFront alias hosted zone ID (same for every CloudFront distribution)
        HostedZoneId: Z2FDTNDATAQYW2
        DNSName: !GetAtt Distribution.DomainName

Outputs:
  BucketName:
    Description: S3 bucket holding the built frontend assets
    Value: !Ref FrontendBucket

  DistributionId:
    Description: CloudFront distribution ID (used for cache invalidation)
    Value: !Ref Distribution

  DistributionDomainName:
    Description: CloudFront default domain (*.cloudfront.net)
    Value: !GetAtt Distribution.DomainName

  WebsiteURL:
    Description: Public URL for the deployed frontend
    Value: !If
      - HasCustomDomain
      - !Sub "https://${CustomDomainName}"
      - !Sub "https://${Distribution.DomainName}"
