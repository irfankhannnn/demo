AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFormation template for RealtyFlow MCP Server (Model Context Protocol)
  - Separate Lambda + API Gateway for MCP integration with Claude, ChatGPT, and other AI apps'

Parameters:
  ServiceName:
    Type: String
    Default: realtyflow-mcp
    Description: Service name for resource naming
  
  Env:
    Type: String
    Default: prod
    AllowedValues: [dev, test, prod]
    Description: Environment name
  
  LambdaMemorySize:
    Type: Number
    Default: 512
    MinValue: 128
    MaxValue: 10240
    Description: Lambda memory size in MB
  
  LambdaTimeout:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 900
    Description: Lambda timeout in seconds
  
  LogRetentionInDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1827, 3653]
    Description: CloudWatch log retention in days
  
  LambdaPackagesBucketName:
    Type: String
    Description: S3 bucket name where MCP Lambda deployment package is stored
  
  LambdaCodeS3Key:
    Type: String
    Default: mcp-function.zip
    Description: S3 object key for the packaged Lambda zip
  
  CRMDynamoDBTableName:
    Type: String
    Description: Name of the existing CRM DynamoDB table
  
  OAuthCodesTableName:
    Type: String
    Default: realtyflow-oauth-codes
    Description: DynamoDB table name for OAuth authorization codes
  
  JWTSecret:
    Type: String
    NoEcho: true
    Description: Secret key for JWT token signing
  
  JWTRefreshSecret:
    Type: String
    NoEcho: true
    Description: Secret key for JWT refresh token signing
  
  DomainName:
    Type: String
    Default: ''
    Description: (Optional) Custom domain name for API Gateway
  
  CognitoUserPoolId:
    Type: String
    Description: Cognito User Pool ID for OAuth authorization page
  
  CognitoClientId:
    Type: String
    Description: Cognito Client ID for OAuth authorization page

Conditions:
  HasCustomDomain: !Not [!Equals [!Ref DomainName, '']]

Resources:
  # ============================================================================
  # IAM ROLES
  # ============================================================================

  McpLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ServiceName}-${Env}-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchGetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:BatchWriteItem
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CRMDynamoDBTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CRMDynamoDBTableName}/index/*'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${OAuthCodesTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${OAuthCodesTableName}/index/*'

  JwtAuthorizerLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ServiceName}-${Env}-authorizer-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  # ============================================================================
  # DYNAMODB TABLES
  # ============================================================================

  OAuthCodesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref OAuthCodesTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: code
          AttributeType: S
      KeySchema:
        - AttributeName: code
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      Tags:
        - Key: Service
          Value: !Ref ServiceName
        - Key: Environment
          Value: !Ref Env

  # ============================================================================
  # LAMBDA FUNCTIONS
  # ============================================================================

  McpLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ServiceName}-${Env}-mcp'
      Runtime: nodejs20.x
      Handler: server/mcp-server/lambdaHandler.handler
      Role: !GetAtt McpLambdaExecutionRole.Arn
      MemorySize: !Ref LambdaMemorySize
      Timeout: !Ref LambdaTimeout
      Code:
        S3Bucket: !Ref LambdaPackagesBucketName
        S3Key: !Ref LambdaCodeS3Key
      Environment:
        Variables:
          NODE_ENV: !Ref Env
          CRM_DYNAMODB_TABLE_NAME: !Ref CRMDynamoDBTableName
          OAUTH_CODES_TABLE_NAME: !Ref OAuthCodesTableName
          JWT_SECRET: !Ref JWTSecret
          JWT_REFRESH_SECRET: !Ref JWTRefreshSecret
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref CognitoClientId
      Tags:
        - Key: Service
          Value: !Ref ServiceName
        - Key: Environment
          Value: !Ref Env

  McpLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${McpLambdaFunction}'
      RetentionInDays: !Ref LogRetentionInDays

  JwtAuthorizerLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ServiceName}-${Env}-jwt-authorizer'
      Runtime: nodejs20.x
      Handler: server/authorizers/jwtAuthorizer.handler
      Role: !GetAtt JwtAuthorizerLambdaExecutionRole.Arn
      MemorySize: 256
      Timeout: 10
      Code:
        S3Bucket: !Ref LambdaPackagesBucketName
        S3Key: !Ref LambdaCodeS3Key
      Environment:
        Variables:
          JWT_SECRET: !Ref JWTSecret
      Tags:
        - Key: Service
          Value: !Ref ServiceName
        - Key: Environment
          Value: !Ref Env

  JwtAuthorizerLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${JwtAuthorizerLambdaFunction}'
      RetentionInDays: !Ref LogRetentionInDays

  # ============================================================================
  # API GATEWAY
  # ============================================================================

  McpApiGateway:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub '${ServiceName}-${Env}'
      Description: MCP Server API Gateway for Claude, ChatGPT, and other AI apps
      EndpointConfiguration:
        Types:
          - REGIONAL

  McpApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apigateway/${McpApiGateway}'
      RetentionInDays: !Ref LogRetentionInDays

  McpApiAccount:
    Type: AWS::ApiGateway::Account
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayCloudWatchRole.Arn

  ApiGatewayCloudWatchRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchLogsFullAccess

  # ============================================================================
  # JWT AUTHORIZER
  # ============================================================================

  JwtAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: !Sub '${ServiceName}-${Env}-jwt-authorizer'
      Type: TOKEN
      AuthorizerUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${JwtAuthorizerLambdaFunction.Arn}/invocations'
      AuthorizerCredentials: !GetAtt ApiGatewayAuthorizerRole.Arn
      AuthorizerResultTtlInSeconds: 300
      IdentitySource: method.request.header.Authorization

  ApiGatewayAuthorizerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeLambdaAuthorizer
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt JwtAuthorizerLambdaFunction.Arn

  JwtAuthorizerLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref JwtAuthorizerLambdaFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${McpApiGateway}/authorizers/${JwtAuthorizer}'

  # ============================================================================
  # API GATEWAY RESOURCES & METHODS
  # ============================================================================

  McpResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref McpApiGateway
      ParentId: !GetAtt McpApiGateway.RootResourceId
      PathPart: mcp

  McpMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref McpApiGateway
      ResourceId: !Ref McpResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${McpLambdaFunction.Arn}/invocations'
      MethodResponses:
        - StatusCode: 200
          ResponseModels:
            application/json: Empty

  McpLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref McpLambdaFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${McpApiGateway}/*/*'

  # ============================================================================
  # API GATEWAY DEPLOYMENT & STAGE
  # ============================================================================

  McpApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - McpMethod
    Properties:
      RestApiId: !Ref McpApiGateway
      StageName: !Ref Env

  McpApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref McpApiGateway
      DeploymentId: !Ref McpApiDeployment
      StageName: !Ref Env
      LoggingLevel: INFO
      DataTraceEnabled: false
      CloudWatchMetricsEnabled: true
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          LoggingLevel: INFO
          DataTraceEnabled: false
          MetricsEnabled: true

  # ============================================================================
  # OUTPUTS
  # ============================================================================

Outputs:
  McpApiUrl:
    Description: MCP API Gateway URL
    Value: !Sub 'https://${McpApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Env}/mcp'
    Export:
      Name: !Sub '${ServiceName}-${Env}-api-url'

  McpLambdaArn:
    Description: MCP Lambda function ARN
    Value: !GetAtt McpLambdaFunction.Arn
    Export:
      Name: !Sub '${ServiceName}-${Env}-lambda-arn'

  JwtAuthorizerArn:
    Description: JWT Authorizer Lambda function ARN
    Value: !GetAtt JwtAuthorizerLambdaFunction.Arn
    Export:
      Name: !Sub '${ServiceName}-${Env}-authorizer-arn'

  OAuthCodesTableName:
    Description: OAuth codes DynamoDB table name
    Value: !Ref OAuthCodesTable
    Export:
      Name: !Sub '${ServiceName}-${Env}-oauth-codes-table'

  ApiGatewayId:
    Description: API Gateway ID
    Value: !Ref McpApiGateway
    Export:
      Name: !Sub '${ServiceName}-${Env}-api-gateway-id'

  McpLambdaFunctionName:
    Description: MCP Lambda function name
    Value: !Ref McpLambdaFunction
    Export:
      Name: !Sub '${ServiceName}-${Env}-lambda-name'
