name: PR Engineering Change Intelligence

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to analyze'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-intelligence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup context
        id: context
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR_NUM="${{ inputs.pr_number }}"
          else
            PR_NUM="${{ github.event.pull_request.number }}"
          fi
          echo "pr_number=$PR_NUM" >> $GITHUB_OUTPUT
          echo "pr_url=${{ github.event.pull_request.html_url || format('https://github.com/{0}/pull/{1}', github.repository, inputs.pr_number) }}" >> $GITHUB_OUTPUT

      - name: Gather PR context
        env:
          ECI_OUTPUT_DIR: engineering-change-intelligence/reports/pr-${{ steps.context.outputs.pr_number }}
        run: |
          bash engineering-change-intelligence/scripts/gather-pr-context.sh \
            --pr ${{ steps.context.outputs.pr_number }} \
            --output "$ECI_OUTPUT_DIR"

      - name: Route agents
        env:
          ECI_OUTPUT_DIR: engineering-change-intelligence/reports/pr-${{ steps.context.outputs.pr_number }}
        run: |
          bash engineering-change-intelligence/scripts/route-agents.sh \
            "$ECI_OUTPUT_DIR/files-changed.txt"

      - name: Upload context artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pr-intelligence-context-${{ steps.context.outputs.pr_number }}
          path: engineering-change-intelligence/reports/pr-${{ steps.context.outputs.pr_number }}/
          retention-days: 30

      - name: Post to Slack (if report exists)
        if: env.SLACK_PR_WEBHOOK_URL != ''
        env:
          SLACK_PR_WEBHOOK_URL: ${{ secrets.SLACK_PR_WEBHOOK_URL }}
          ECI_CONTEXT: engineering-change-intelligence/reports/pr-${{ steps.context.outputs.pr_number }}/context.json
        run: |
          REPORT="engineering-change-intelligence/reports/pr-${{ steps.context.outputs.pr_number }}/release-readiness.md"
          if [ -f "$REPORT" ]; then
            bash engineering-change-intelligence/scripts/post-to-slack.sh "$REPORT"
          else
            echo "No release-readiness.md yet — run agent analysis to generate report"
          fi

      - name: Comment PR with routing info
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const routingPath = 'engineering-change-intelligence/reports/pr-${{ steps.context.outputs.pr_number }}/agent-routing.json';
            let body = '## 🤖 Engineering Change Intelligence\n\n';
            body += 'Context gathered. Agents to run:\n\n';
            try {
              const routing = JSON.parse(fs.readFileSync(routingPath, 'utf8'));
              body += routing.agents.map(a => `- \`${a}\``).join('\n');
              body += `\n\n**Files changed:** ${routing.total_files}`;
              body += '\n\n---\n';
              body += 'To complete analysis, invoke the **PR Orchestrator** agent in Cursor Cloud:\n';
              body += '```\nReview PR #${{ steps.context.outputs.pr_number }} with Engineering Change Intelligence\n```';
            } catch (e) {
              body += 'Context gathering complete. Run agent analysis for full report.';
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
