name: Marketplace Tests

# CI for the consumer marketplace (the "AI property matching" portal):
#   apps/marketplace/marketplace-api        Express on Lambda   (node --test)
#   apps/marketplace/marketplace-web        Vite React SPA      (vitest + tsc + build)
#   services/marketplace-authentication     TS Express on Lambda (build + tests)
#   apps/crm/server marketplace suites      the CRM side: indexing, listing reads, internal API
#
# Path-filtered so an unrelated PR does not pay for four installs. Deploys
# stay manual and release-tracked through infra/cicd/marketplace-*/deploy.sh,
# matching every other service in this repo.

on:
  pull_request:
    branches: [main, 'cursor/*', 'claude/*']
    paths:
      - 'apps/marketplace/**'
      - 'services/marketplace-authentication/**'
      - 'infra/cicd/marketplace-*/**'
      - 'apps/crm/server/marketplace*.js'
      - 'apps/crm/server/routes/marketplace*.js'
      - 'apps/crm/server/services/embeddings/marketplaceSearchService.js'
      - '.github/workflows/marketplace-tests.yml'
  push:
    branches: [main]
    paths:
      - 'apps/marketplace/**'
      - 'services/marketplace-authentication/**'
      - 'infra/cicd/marketplace-*/**'
      - 'apps/crm/server/marketplace*.js'
      - 'apps/crm/server/routes/marketplace*.js'

jobs:
  marketplace-api:
    name: marketplace-api (node --test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/marketplace/marketplace-api/package-lock.json
      - name: Install
        working-directory: apps/marketplace/marketplace-api
        run: npm ci
      - name: Test
        working-directory: apps/marketplace/marketplace-api
        run: npm test

  marketplace-web:
    name: marketplace-web (vitest + tsc + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/marketplace/marketplace-web/package-lock.json
      - name: Install
        working-directory: apps/marketplace/marketplace-web
        run: npm ci
      - name: Typecheck
        working-directory: apps/marketplace/marketplace-web
        run: npx tsc --noEmit
      - name: Unit tests
        working-directory: apps/marketplace/marketplace-web
        run: npm test -- --run
      - name: Build
        working-directory: apps/marketplace/marketplace-web
        run: npm run build
        env:
          VITE_MARKETPLACE_API_URL: https://ci.invalid/api
          VITE_MARKETPLACE_AUTH_URL: https://ci.invalid/auth

  marketplace-authentication:
    name: marketplace-authentication (build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: services/marketplace-authentication/package-lock.json
      - name: Install
        working-directory: services/marketplace-authentication
        run: npm ci
      - name: Build
        working-directory: services/marketplace-authentication
        run: npm run build
      - name: Test
        working-directory: services/marketplace-authentication
        run: npm test

  crm-marketplace-suites:
    name: CRM marketplace suites (Jest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/crm/server/package-lock.json
      - name: Install server dependencies
        working-directory: apps/crm/server
        run: npm ci
      - name: Run marketplace suites
        working-directory: apps/crm/server
        run: npm test -- marketplaceIndexing.test.js marketplaceListingService.test.js routes/marketplaceInternal.test.js leadNotifications.marketplace.test.js
        env:
          CRM_DYNAMODB_TABLE_NAME: ci-placeholder-crm-table
          AGENCY_CONFIG_DYNAMODB_TABLE_NAME: ci-placeholder-agency-config
          AWS_REGION: ap-south-1
