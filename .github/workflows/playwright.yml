name: Playwright Tests

on:
  pull_request:
    branches: [main, 'cursor/*']
  push:
    branches: [main]

jobs:
  playwright:
    name: Analytics + Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: real-estate-crm-app/package-lock.json

      - name: Install CRM dependencies
        working-directory: real-estate-crm-app
        run: npm ci

      - name: Build CRM app
        working-directory: real-estate-crm-app
        run: npm run build
        env:
          VITE_API_URL: http://localhost:3001
          VITE_AUTH_API_URL: http://localhost:3001
          VITE_IS_DEMO: 'false'
          VITE_RAZORPAY_KEY_ID: test_key

      - name: Install Playwright browsers
        working-directory: real-estate-crm-app
        run: npx playwright install --with-deps chromium

      - name: Start preview server
        working-directory: real-estate-crm-app
        run: npx vite preview --port 5173 &
        env:
          VITE_API_URL: http://localhost:3001

      - name: Wait for server
        run: sleep 3

      - name: Run Playwright tests
        working-directory: .
        run: |
          # Run all available test specs in tests/ directory
          # Individual specs (analytics, cookie-consent, grievance, nps, paywall) are added by their respective PRs
          if ls tests/*.spec.ts 1>/dev/null 2>&1; then
            npx playwright test tests/
          else
            echo "No test specs found — skipping (specs are added by feature PRs)"
          fi
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
