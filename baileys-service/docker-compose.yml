version: '3.8'

services:
  baileys:
    build: .
    container_name: realtyflow-baileys
    restart: unless-stopped
    ports:
      - "3003:3003"
    env_file:
      - .env
    volumes:
      - baileys_auth_state:/app/auth_state
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  baileys_auth_state:
