AWSTemplateFormatVersion: '2010-09-09'
Description: 'Team summary WhatsApp/email — daily 18:00 IST'

Parameters:
  SubscriptionsTableName:
    Type: String
    Default: 'Subscriptions'
  CrmTableName:
    Type: String
    Default: 'cloudberry-real-estate-crm'
  CreditsTableName:
    Type: String
    Default: 'cloudberry-real-estate-credits'
  CreditConfigTableName:
    Type: String
    Default: 'cloudberry-real-estate-credit-config'
  AuthServiceUrl:
    Type: String
    Default: ''
  BaileyEnabled:
    Type: String
    Default: 'false'
  BaileyApiKey:
    Type: String
    Default: ''
    NoEcho: true
  BrevoApiKey:
    Type: String
    Default: ''
    NoEcho: true
  SesFromEmail:
    Type: String
    Default: 'noreply@realestateflow.in'
  LambdaCodeS3Bucket:
    Type: String
  LambdaCodeS3Key:
    Type: String

Resources:
  TeamSummaryRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: realestateflow-team-summary-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: TeamSummaryPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SubscriptionsTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CrmTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CreditsTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CreditConfigTableName}'
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: '*'

  TeamSummaryRule:
    Type: AWS::Events::Rule
    Properties:
      Name: realestateflow-team-summary
      Description: 'Trigger team summary Lambda daily at 18:00 IST (12:30 UTC)'
      ScheduleExpression: 'cron(30 12 * * ? *)'
      State: ENABLED
      Targets:
        - Arn: !GetAtt TeamSummaryFunction.Arn
          Id: TeamSummaryTarget

  TeamSummaryFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: realestateflow-team-summary
      Runtime: nodejs20.x
      Handler: team-summary-cron.handler
      Timeout: 300
      MemorySize: 256
      Role: !GetAtt TeamSummaryRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      Environment:
        Variables:
          SUBSCRIPTIONS_TABLE: !Ref SubscriptionsTableName
          CRM_TABLE_NAME: !Ref CrmTableName
          CREDITS_TABLE_NAME: !Ref CreditsTableName
          CREDIT_CONFIG_TABLE_NAME: !Ref CreditConfigTableName
          AUTH_SERVICE_URL: !Ref AuthServiceUrl
          BAILEY_ENABLED: !Ref BaileyEnabled
          BAILEY_API_KEY: !Ref BaileyApiKey
          BREVO_API_KEY: !Ref BrevoApiKey
          AWS_SES_FROM_EMAIL: !Ref SesFromEmail
          EMAIL_PROVIDER_PRIMARY: 'ses'
          AWS_REGION_OVERRIDE: 'ap-south-1'

  TeamSummaryPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TeamSummaryFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt TeamSummaryRule.Arn
