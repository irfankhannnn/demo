AWSTemplateFormatVersion: '2010-09-09'
Description: 'Expiring agreements alert — daily 08:30 IST'

Parameters:
  CrmTableName:
    Type: String
    Default: 'cloudberry-real-estate-crm'
  AuthServiceUrl:
    Type: String
    Default: ''
  BaileyEnabled:
    Type: String
    Default: 'false'
  BaileyApiKey:
    Type: String
    Default: ''
    NoEcho: true
  BrevoApiKey:
    Type: String
    Default: ''
    NoEcho: true
  SesFromEmail:
    Type: String
    Default: 'noreply@realestateflow.in'
  SubscriptionsTableName:
    Type: String
    Default: 'Subscriptions'
  LambdaCodeS3Bucket:
    Type: String
  LambdaCodeS3Key:
    Type: String

Resources:
  ExpiringAgreementsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: realestateflow-expiring-agreements-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ExpiringAgreementsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CrmTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SubscriptionsTableName}'
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: '*'

  ExpiringAgreementsRule:
    Type: AWS::Events::Rule
    Properties:
      Name: realestateflow-expiring-agreements
      Description: 'Trigger expiring agreements alert daily at 08:30 IST (03:00 UTC)'
      ScheduleExpression: 'cron(0 3 * * ? *)'
      State: ENABLED
      Targets:
        - Arn: !GetAtt ExpiringAgreementsFunction.Arn
          Id: ExpiringAgreementsTarget

  ExpiringAgreementsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: realestateflow-expiring-agreements
      Runtime: nodejs20.x
      Handler: expiring-agreements-cron.handler
      Timeout: 300
      MemorySize: 256
      Role: !GetAtt ExpiringAgreementsRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      Environment:
        Variables:
          CRM_TABLE_NAME: !Ref CrmTableName
          SUBSCRIPTIONS_TABLE: !Ref SubscriptionsTableName
          AUTH_SERVICE_URL: !Ref AuthServiceUrl
          BAILEY_ENABLED: !Ref BaileyEnabled
          BAILEY_API_KEY: !Ref BaileyApiKey
          BREVO_API_KEY: !Ref BrevoApiKey
          AWS_SES_FROM_EMAIL: !Ref SesFromEmail
          EMAIL_PROVIDER_PRIMARY: 'ses'
          AWS_REGION_OVERRIDE: 'ap-south-1'

  ExpiringAgreementsPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ExpiringAgreementsFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ExpiringAgreementsRule.Arn
