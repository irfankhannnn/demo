# EventBridge scheduled rule — AI Employee SLA escalation
# Runs every 6 hours to check for pending provisioning rows past 24h SLA
#
# Scans AIEmployeeProvisioning where status=pending and now > expectedSLAEnd
# On breach: status → escalated, emails founder + customer, PostHog event
# NOTE: Razorpay ₹500 credit note is a manual step for M1

AWSTemplateFormatVersion: '2010-09-09'
Description: 'AI Employee SLA Escalation Cron (every 6h)'

Resources:
  EscalationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: realestateflow-ai-employee-escalation
      Runtime: nodejs20.x
      Handler: escalation-cron.handler
      CodeUri: ../server/scripts/
      Timeout: 60
      MemorySize: 128
      Environment:
        Variables:
          AWS_REGION_OVERRIDE: ap-south-1
          AI_EMPLOYEE_PROVISIONING_TABLE: AIEmployeeProvisioning
          BREVO_API_KEY: !Ref BrevoApiKey
          BREVO_AI_EMPLOYEE_ESCALATED_TEMPLATE_ID: !Ref BrevoEscalatedTemplateId
          FOUNDER_EMAIL: info@realestateflow.in
          FOUNDER_WHATSAPP: !Ref FounderWhatsApp
          POSTHOG_KEY_SERVER: !Ref PostHogKeyServer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: AIEmployeeProvisioning

  EscalationSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: ai-employee-escalation-6h
      Description: 'Every 6 hours — check pending AI Employee provisioning SLA'
      ScheduleExpression: 'rate(6 hours)'
      State: ENABLED
      Targets:
        - Arn: !GetAtt EscalationFunction.Arn
          Id: EscalationTarget

  EscalationPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref EscalationFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt EscalationSchedule.Arn
