AWSTemplateFormatVersion: '2010-09-09'
Description: 'Lead qualifier agent — EventBridge lead.created'

Resources:
  LeadQualifierRule:
    Type: AWS::Events::Rule
    Properties:
      Name: realestateflow-lead-qualifier
      EventPattern:
        source: ['crm.leads']
        detail-type: ['lead.created']
      State: DISABLED
      Targets:
        - Arn: !GetAtt LeadQualifierFunction.Arn
          Id: LeadQualifierTarget

  LeadQualifierFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: realestateflow-lead-qualifier
      Runtime: nodejs20.x
      Handler: lead-qualifier-handler.handler
      Timeout: 60
      MemorySize: 512

  LeadQualifierPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LeadQualifierFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt LeadQualifierRule.Arn
