[mcp_servers.blotato]
url = "https://mcp.blotato.com/sse"

[mcp_servers.git]
command = "npx"
args = [
    "-y",
    "@mseep/git-mcp-server",
]

[mcp_servers.higgsfield]
url = "https://mcp.higgsfield.ai/mcp"

[mcp_servers.meta-ads]
url = "https://mcp.facebook.com/ads"

[mcp_servers.nabi-crm]
command = "node"
args = ["agency-app/api/mcp-server/index.js"]
env_vars = [
    "MCP_TENANT_ID",
    "CRM_DYNAMODB_TABLE_NAME",
]
