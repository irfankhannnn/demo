AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Explicit API Gateway routes for Reality Flow Authentication service.
  No ANY or proxy+ methods - each endpoint has explicit methods with proper authorization.

Parameters:
  RestApiId:
    Type: String
  RootResourceId:
    Type: String
  LambdaFunctionArn:
    Type: String
  CognitoAuthorizerId:
    Type: String
    Description: Cognito User Pool Authorizer ID for protected endpoints
  AllowOrigin:
    Type: String
    Default: "*"
  AllowHeaders:
    Type: String
    Default: "Content-Type,Authorization,X-Amz-Date,X-Api-Key"
  AllowMethods:
    Type: String
    Default: "GET,POST,PATCH,PUT,DELETE,OPTIONS"

Resources:

  # ============== /health ==============
  HealthResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApiId
      ParentId: !Ref RootResourceId
      PathPart: health

  HealthGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApiId
      ResourceId: !Ref HealthResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaFunctionArn}/invocations"

  HealthOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApiId
      ResourceId: !Ref HealthResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        PassthroughBehavior: NEVER
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: !Sub "'${AllowHeaders}'"
              method.response.header.Access-Control-Allow-Methods: !Sub "'${AllowMethods}'"
              method.response.header.Access-Control-Allow-Origin: !Sub "'${AllowOrigin}'"
              method.response.header.Access-Control-Allow-Credentials: "'true'"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Credentials: true

  # ============== /auth ==============
  AuthResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApiId
      ParentId: !Ref RootResourceId
      PathPart: auth

  # ============== /auth/phone ==============
