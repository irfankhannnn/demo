AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Explicit API Gateway routes for Reality Flow Authentication service.
  No ANY or proxy+ methods - each endpoint has explicit methods with proper authorization.

Parameters:
  RestApiId:
    Type: String
  RootResourceId:
    Type: String
  LambdaFunctionArn:
    Type: String
  CognitoAuthorizerId:
    Type: String
    Description: Cognito User Pool Authorizer ID for protected endpoints
  AllowOrigin:
    Type: String
    Default: "*"
  AllowHeaders:
    Type: String
    Default: "Content-Type,Authorization,X-Amz-Date,X-Api-Key"
  AllowMethods:
    Type: String
    Default: "GET,POST,PATCH,PUT,DELETE,OPTIONS"

Resources:

  # ============== /health ==============
  HealthResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApiId
      ParentId: !Ref RootResourceId
      PathPart: health

  HealthGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApiId
      ResourceId: !Ref HealthResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaFunctionArn}/invocations"

  HealthOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApiId
      ResourceId: !Ref HealthResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      # Routed to the Lambda (AWS_PROXY) instead of a MOCK integration.
      # API Gateway's MOCK integration rejects `method.request.header.origin`
      # as an IntegrationResponses mapping expression outright (confirmed
      # live: "Invalid mapping expression specified" on every OPTIONS method
      # during an actual deploy) - there is no MOCK-integration way to
      # dynamically echo the request's Origin header for multi-origin CORS
      # with credentials (Access-Control-Allow-Origin: '*' is invalid
      # alongside Access-Control-Allow-Credentials: true). Delegating to the
      # Lambda means Express's own cors() middleware (src/app.ts, driven by
      # the same ALLOWED_ORIGINS array as every real request) handles
      # preflight too - one correct implementation instead of two.
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaFunctionArn}/invocations"

  # ============== /auth ==============
  AuthResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApiId
      ParentId: !Ref RootResourceId
      PathPart: auth

  # ============== /auth/phone ==============
  AuthPhoneResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApiId
      ParentId: !Ref AuthResource
      PathPart: phone

  # ============== /auth/phone/start ==============
  AuthPhoneStartResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApiId
      ParentId: !Ref AuthPhoneResource
      PathPart: start

  AuthPhoneStartPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApiId
      ResourceId: !Ref AuthPhoneStartResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaFunctionArn}/invocations"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Set-Cookie: true

  AuthPhoneStartOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApiId
      ResourceId: !Ref AuthPhoneStartResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      # Routed to the Lambda (AWS_PROXY) instead of a MOCK integration.
      # API Gateway's MOCK integration rejects `method.request.header.origin`
      # as an IntegrationResponses mapping expression outright (confirmed
      # live: "Invalid mapping expression specified" on every OPTIONS method
      # during an actual deploy) - there is no MOCK-integration way to
      # dynamically echo the request's Origin header for multi-origin CORS
      # with credentials (Access-Control-Allow-Origin: '*' is invalid
      # alongside Access-Control-Allow-Credentials: true). Delegating to the
      # Lambda means Express's own cors() middleware (src/app.ts, driven by
      # the same ALLOWED_ORIGINS array as every real request) handles
      # preflight too - one correct implementation instead of two.
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaFunctionArn}/invocations"

