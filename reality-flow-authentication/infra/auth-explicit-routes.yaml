      # API Gateway's MOCK integration rejects `method.request.header.origin`
      # as an IntegrationResponses mapping expression outright (confirmed
      # live: "Invalid mapping expression specified" on every OPTIONS method
      # during an actual deploy) - there is no MOCK-integration way to
      # dynamically echo the request's Origin header for multi-origin CORS
      # with credentials (Access-Control-Allow-Origin: '*' is invalid
      # alongside Access-Control-Allow-Credentials: true). Delegating to the
      # Lambda means Express's own cors() middleware (src/app.ts, driven by
      # the same ALLOWED_ORIGINS array as every real request) handles
      # preflight too - one correct implementation instead of two.
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaFunctionArn}/invocations"

