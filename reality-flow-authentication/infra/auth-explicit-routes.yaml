  # ============== /internal (service-to-service, x-internal-api-key auth) ==============
  # Never called from a browser — no CORS/OPTIONS methods needed. Auth is
  # enforced at the app layer (src/routes/internal.ts's requireInternalApiKey),
  # not via the Cognito authorizer, so every method here is AuthorizationType
  # NONE at the API Gateway level. These three routes existed in the Express
  # app (internal.ts) but had no API Gateway resource at all until now — every
  # call 403'd with API Gateway's own "Missing Authentication Token" before
  # ever reaching the Lambda, since this template deliberately has no ANY/
  # proxy+ catch-all (see the file header).
  InternalResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApiId
      ParentId: !Ref RootResourceId
      PathPart: internal

