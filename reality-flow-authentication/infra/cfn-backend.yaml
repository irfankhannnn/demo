AWSTemplateFormatVersion: '2010-09-09'
Description: 'Reality Flow Authentication Microservice - Cognito + API Gateway + Lambda + DynamoDB'

# =============================================================================
# Parameters (org-standard set)
# =============================================================================
Parameters:
  ServiceName:
    Type: String
    Default: reality-flow-auth

  Env:
    Type: String
    Default: dev
    AllowedValues: [dev, prod, test]

  LambdaMemorySize:
    Type: Number
    Default: 256

  LambdaTimeout:
    Type: Number
    Default: 30

  LogRetentionInDays:
    Type: Number
    Default: 14

  SubnetIds:
    Type: CommaDelimitedList
    Default: ''
    Description: Optional VPC subnet IDs for Lambda

  SecurityGroupIds:
    Type: CommaDelimitedList
    Default: ''
    Description: Optional VPC security group IDs for Lambda



  LambdaPackagesBucketName:
    Type: String
    Description: S3 bucket where Lambda function.zip is uploaded

  # RDS params (unused but required by org standard)
  DatabaseHost:
    Type: String
    Default: ''
  DatabasePort:
    Type: String
    Default: ''
  DatabaseName:
    Type: String
    Default: ''
  DatabaseUsername:
    Type: String
    Default: ''
  DatabasePassword:
    Type: String
    Default: ''
    NoEcho: true

  DomainName:
    Type: String
    Default: ''
    Description: Optional custom domain for API Gateway

  # --- Auth-service-specific params ---
  GoogleClientId:
    Type: String
    NoEcho: true
    Description: Google OAuth 2.0 Client ID

  GoogleClientSecret:
    Type: String
    NoEcho: true
    Description: Google OAuth 2.0 Client Secret

  CognitoDomainPrefix:
    Type: String
    Description: Unique prefix for Cognito hosted UI domain (e.g. reality-flow-auth-dev)

  CognitoDomainPrefixV2:
    Type: String
    Description: Unique prefix for Cognito V2 hosted UI domain with phone auth (e.g. reality-flow-auth-v2-dev)

  IdentityCallbackURL:
    Type: String
    Default: http://localhost:3000/auth/callback
    Description: Frontend redirect URL after Cognito authentication

  IdentityLogoutURL:
    Type: String
    Default: http://localhost:3000/logout
    Description: Frontend redirect URL after Cognito logout

  TestOtpEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Set to true to use a fixed OTP (skips SMS) for dev/testing

  TestOtpValue:
    Type: String
    Default: '123456'
    Description: The fixed OTP to use when TestOtpEnabled is true

  ApiGatewayRoutesTemplateUrl:
    Type: String
    Default: ''
    Description: S3 URL for nested template that creates explicit API Gateway routes without ANY/proxy+ methods

# =============================================================================
# Conditions
# =============================================================================
Conditions:
  HasVpcConfig:
    !Not [!Equals [!Select [0, !Ref SubnetIds], '']]

# =============================================================================
# Resources
# =============================================================================
Resources:

  # ===========================================================================
  # 1. Cognito User Pool
  # ===========================================================================
  # CognitoUserPool:
    # Type: AWS::Cognito::UserPool
    # Properties:
    #   UserPoolName: !Sub '${Env}-${ServiceName}-user-pool'
    #   AutoVerifiedAttributes:
    #     - email
    #   MfaConfiguration: 'OFF'
    #   Schema:
    #     - Name: email
    #       AttributeDataType: String
    #       Mutable: true
    #       Required: true
    #     - Name: phone_number
    #       AttributeDataType: String
    #       Mutable: true
    #       Required: false
    #     - Name: name
    #       AttributeDataType: String
    #       Mutable: true
    #       Required: false
    #   UsernameAttributes:
    #     - email
    #   UsernameConfiguration:
    #     CaseSensitive: false
    #   AccountRecoverySetting:
    #     RecoveryMechanisms:
    #       - Name: verified_email
    #         Priority: 1
    #       - Name: verified_phone_number
    #         Priority: 2
    #   Policies:
    #     PasswordPolicy:
    #       MinimumLength: 8
    #       RequireLowercase: true
    #       RequireNumbers: true
    #       RequireSymbols: false
    #       RequireUppercase: true
    #       TemporaryPasswordValidityDays: 7
    #   EmailConfiguration:
    #     EmailSendingAccount: COGNITO_DEFAULT
    #   VerificationMessageTemplate:
    #     DefaultEmailOption: CONFIRM_WITH_CODE
    #     EmailMessage: 'Your Reality Flow verification code is {####}'
    #     EmailSubject: 'Reality Flow - Verification Code'
    #     SmsMessage: 'Your Reality Flow code is {####}'

  # ===========================================================================
  # 2. Cognito Google Identity Provider
  # ===========================================================================
  # GoogleIdentityProvider:
  #   Type: AWS::Cognito::UserPoolIdentityProvider
  #   Properties:
  #     UserPoolId: !Ref CognitoUserPool
  #     ProviderName: Google
  #     ProviderType: Google
  #     ProviderDetails:
  #       client_id: !Ref GoogleClientId
  #       client_secret: !Ref GoogleClientSecret
  #       authorize_scopes: 'profile email openid'
  #     AttributeMapping:
  #       email: email
  #       name: name
  #       username: sub

  # ===========================================================================
  # 3. Cognito User Pool Client
  # ===========================================================================
  # UserPoolClient:
  #   Type: AWS::Cognito::UserPoolClient
  #   DependsOn: GoogleIdentityProvider
  #   Properties:
  #     ClientName: !Sub '${Env}-${ServiceName}-client'
  #     UserPoolId: !Ref CognitoUserPool
  #     GenerateSecret: false
  #     ExplicitAuthFlows:
  #       - ALLOW_USER_PASSWORD_AUTH
  #       - ALLOW_REFRESH_TOKEN_AUTH
  #       - ALLOW_USER_SRP_AUTH
  #       - ALLOW_ADMIN_USER_PASSWORD_AUTH
  #     PreventUserExistenceErrors: ENABLED
  #     AllowedOAuthFlows:
  #       - code
  #       - implicit
  #     AllowedOAuthFlowsUserPoolClient: true
  #     AllowedOAuthScopes:
  #       - phone
  #       - email
  #       - openid
  #       - profile
  #     SupportedIdentityProviders:
  #       - COGNITO
  #       - Google
  #     CallbackURLs:
  #       - !Ref IdentityCallbackURL
  #     LogoutURLs:
  #       - !Ref IdentityLogoutURL
  #     TokenValidityUnits:
  #       AccessToken: hours
  #       IdToken: hours
  #       RefreshToken: days
  #     AccessTokenValidity: 1
  #     IdTokenValidity: 1
  #     RefreshTokenValidity: 30

  # ===========================================================================
  # 4. Cognito Hosted UI Domain
  # ===========================================================================
  # UserPoolDomain:
  #   Type: AWS::Cognito::UserPoolDomain
  #   Properties:
  #     Domain: !Ref CognitoDomainPrefix
  #     UserPoolId: !Ref CognitoUserPool

  # ===========================================================================
  # 4.1. Cognito SMS Role (Required for Phone Authentication)
  # ===========================================================================
  CognitoSmsRoleV2:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cognito-idp.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CognitoSmsPublish
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: '*'

  # ===========================================================================
  # 4.2. Cognito User Pool V2 (with Phone Authentication)
  # ===========================================================================
  CognitoUserPoolV2:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${Env}-${ServiceName}-user-pool-v2'
      SmsConfiguration:
        SnsCallerArn: !GetAtt CognitoSmsRoleV2.Arn
        ExternalId: !Sub '${Env}-${ServiceName}-cognito-sms-v2'
      AutoVerifiedAttributes:
        - email
        - phone_number
      MfaConfiguration: 'OPTIONAL'
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true
        - Name: phone_number
          AttributeDataType: String
          Mutable: true
          Required: false
        - Name: name
          AttributeDataType: String
          Mutable: true
          Required: false
      UsernameAttributes:
        - email
        - phone_number
      UsernameConfiguration:
        CaseSensitive: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
          - Name: verified_phone_number
            Priority: 2
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true
          TemporaryPasswordValidityDays: 7
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailMessage: 'Your Reality Flow verification code is {####}'
        EmailSubject: 'Reality Flow - Verification Code'
        SmsMessage: 'Your verification code is {####}. Valid for 5 minutes.'
      LambdaConfig:
        DefineAuthChallenge: !GetAtt DefineAuthChallengeLambda.Arn
        CreateAuthChallenge: !GetAtt CreateAuthChallengeLambda.Arn
        VerifyAuthChallengeResponse: !GetAtt VerifyAuthChallengeResponseLambda.Arn

  # ===========================================================================
  # 4.2. Cognito Google Identity Provider V2
  # ===========================================================================
  GoogleIdentityProviderV2:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref CognitoUserPoolV2
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: 'profile email openid'
      AttributeMapping:
        email: email
        name: name
        username: sub

  # ===========================================================================
  # 4.3. Cognito User Pool Client V2
  # ===========================================================================
  UserPoolClientV2:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: GoogleIdentityProviderV2
    Properties:
      ClientName: !Sub '${Env}-${ServiceName}-client-v2'
      UserPoolId: !Ref CognitoUserPoolV2
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
        - ALLOW_CUSTOM_AUTH
      PreventUserExistenceErrors: ENABLED
      AllowedOAuthFlows:
        - code
        - implicit
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - phone
        - email
        - openid
        - profile
      SupportedIdentityProviders:
        - COGNITO
        - Google
      CallbackURLs:
        - !Ref IdentityCallbackURL
      LogoutURLs:
        - !Ref IdentityLogoutURL
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30

  # ===========================================================================
  # 4.4. Cognito Hosted UI Domain V2
  # ===========================================================================
  UserPoolDomainV2:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefixV2
      UserPoolId: !Ref CognitoUserPoolV2

  # ===========================================================================
  # 5. DynamoDB — Users Table
  # ===========================================================================
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${Env}-${ServiceName}-users'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: TenantId
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI_SubPK
          AttributeType: S
        - AttributeName: GSI_SubSK
          AttributeType: S
        - AttributeName: GSI_UserIdPK
          AttributeType: S
        - AttributeName: GSI_EmailPK
          AttributeType: S
        - AttributeName: GSI_EmailSK
          AttributeType: S
        - AttributeName: GSI_PhonePK
          AttributeType: S
        - AttributeName: GSI_PhoneSK
          AttributeType: S
      KeySchema:
        - AttributeName: TenantId
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: SubIndex
          KeySchema:
            - AttributeName: GSI_SubPK
              KeyType: HASH
            - AttributeName: GSI_SubSK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: UserIdIndex
          KeySchema:
            - AttributeName: GSI_UserIdPK
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: EmailIndex
          KeySchema:
            - AttributeName: GSI_EmailPK
              KeyType: HASH
            - AttributeName: GSI_EmailSK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: PhoneIndex
          KeySchema:
            - AttributeName: GSI_PhonePK
              KeyType: HASH
            - AttributeName: GSI_PhoneSK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ===========================================================================
  # 6. DynamoDB — OTP Table (for Phone Auth)
  # ===========================================================================
  OtpTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${Env}-${ServiceName}-otp'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PhoneNumber
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PhoneNumber
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ===========================================================================
  # 7. DynamoDB — Agency Config Table
  # ===========================================================================
  AgencyConfigTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${Env}-${ServiceName}-agency-config'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: TenantId
          AttributeType: S
        - AttributeName: adminEmail
          AttributeType: S
        - AttributeName: adminPhone
          AttributeType: S
      KeySchema:
        - AttributeName: TenantId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: AdminEmailIndex
          KeySchema:
            - AttributeName: adminEmail
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: AdminPhoneIndex
          KeySchema:
            - AttributeName: adminPhone
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # ===========================================================================
  # 7b. DynamoDB — Auth Identities Table
  # ===========================================================================
  AuthIdentitiesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${Env}-${ServiceName}-auth-identities'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: sub
          AttributeType: S
      KeySchema:
        - AttributeName: sub
          KeyType: HASH

  # ===========================================================================
  # 8. IAM Role for Cognito Trigger Lambdas (Phone Auth)
  # ===========================================================================
  CognitoTriggerLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Env}-${ServiceName}-cognito-trigger-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SNSPublishAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: '*'
        - PolicyName: OtpTableAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt OtpTable.Arn
        - PolicyName: CognitoAdminAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:AdminGetUser
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminUpdateUserAttributes
                Resource: '*'

  # ===========================================================================
  # 9. Cognito Trigger Lambda Functions (Phone Auth)
  # ===========================================================================
  DefineAuthChallengeLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Env}-${ServiceName}-define-auth-challenge'
      Runtime: nodejs16.x
      Handler: index.handler
      Role: !GetAtt CognitoTriggerLambdaRole.Arn
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          OTP_TABLE: !Ref OtpTable
      Code:
        ZipFile: |
          exports.handler = async (event) => {
            if (event.request.session.length === 0) {
              // New session: issue challenge
              event.response.issueTokens = false;
              event.response.failAuthentication = false;
              event.response.challengeName = 'CUSTOM_CHALLENGE';
            } else if (event.request.session.slice(-1)[0].challengeResult === true) {
              // Previous challenge succeeded: issue tokens
              event.response.issueTokens = true;
              event.response.failAuthentication = false;
            } else if (event.request.session.length >= 3) {
              // Too many attempts: fail
              event.response.issueTokens = false;
              event.response.failAuthentication = true;
            } else {
              // Continue challenge
              event.response.issueTokens = false;
              event.response.failAuthentication = false;
              event.response.challengeName = 'CUSTOM_CHALLENGE';
            }
            return event;
          };

  CreateAuthChallengeLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Env}-${ServiceName}-create-auth-challenge'
      Runtime: nodejs16.x
      Handler: index.handler
      Role: !GetAtt CognitoTriggerLambdaRole.Arn
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          OTP_TABLE: !Ref OtpTable
          TEST_OTP_ENABLED: !Ref TestOtpEnabled
          TEST_OTP_VALUE: !Ref TestOtpValue
      Code:
        ZipFile: |
          const AWS = require('aws-sdk');
          const crypto = require('crypto');
          const ddb = new AWS.DynamoDB.DocumentClient();
          const cognito = new AWS.CognitoIdentityServiceProvider();
          
          function phoneToCognitoUsername(phoneNumberE164) {
            const digitsOnly = phoneNumberE164.replace(/\D/g, '');
            return `${digitsOnly}@phone.realityflow.local`;
          }
          
          exports.handler = async (event) => {
            try {
              // Extract phone number from user attributes
              const phoneNumber = event.request.userAttributes?.phone_number;
              if (!phoneNumber) {
                throw new Error('phone_number attribute missing');
              }
              
              const testOtpEnabled = (process.env.TEST_OTP_ENABLED || '').toLowerCase() === 'true';
              const testOtpValue = process.env.TEST_OTP_VALUE || '123456';
              console.log('CreateAuthChallenge config', {
                userPoolId: event.userPoolId,
                phoneNumber,
                testOtpEnabled,
                usingFixedOtp: testOtpEnabled,
              });
              
              const cognitoUsername = phoneToCognitoUsername(phoneNumber);
              
              // Only generate and send OTP on FIRST challenge (not retries)
              const isFirstChallenge = !event.request.session || event.request.session.length === 0;
              
              if (isFirstChallenge) {
                // Ensure user exists (safety net - backend should already do this)
                try {
                  await cognito.adminGetUser({
                    UserPoolId: event.userPoolId,
                    Username: cognitoUsername
                  }).promise();
                } catch (err) {
                  if (err.code === 'UserNotFoundException') {
                    await cognito.adminCreateUser({
                      UserPoolId: event.userPoolId,
                      Username: cognitoUsername,
                      UserAttributes: [
                        { Name: 'phone_number', Value: phoneNumber },
                        { Name: 'phone_number_verified', Value: 'false' }
                      ],
                      MessageAction: 'SUPPRESS'
                    }).promise();
                  } else {
                    throw err;
                  }
                }
                
                const otp = testOtpEnabled ? testOtpValue : Math.floor(100000 + Math.random() * 900000).toString();
                const otpHash = crypto.createHash('sha256').update(otp).digest('hex');
                const ttl = Math.floor(Date.now() / 1000) + 300; // 5 minutes
                
                // Store OTP
                await ddb.put({
                  TableName: process.env.OTP_TABLE,
                  Item: {
                    PhoneNumber: phoneNumber,
                    SK: 'OTP#LOGIN',
                    otpHash,
                    attempts: 0,
                    createdAt: Date.now(),
                    ttl
                  }
                }).promise();
                
                if (!testOtpEnabled) {
                  // Send OTP via SNS (skipped in dev/test mode)
                  const sns = new AWS.SNS();
                  await sns.publish({
                    PhoneNumber: phoneNumber,
                    Message: `Your verification code is ${otp}. Valid for 5 minutes.`
                  }).promise();
                }
                
                console.log('CreateAuthChallenge OTP stored', {
                  phoneNumber,
                  testOtpEnabled,
                  otpLength: otp.length,
                });
                
                event.response.publicChallengeParameters = { phoneNumber };
                event.response.privateChallengeParameters = { otpHash };
              } else {
                // Retry - don't send new OTP, return existing challenge params
                event.response.publicChallengeParameters = { phoneNumber };
                event.response.privateChallengeParameters = {};
              }
              
              return event;
            } catch (error) {
              console.error('CreateAuthChallenge error:', error);
              throw error;
            }
          };

  VerifyAuthChallengeResponseLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Env}-${ServiceName}-verify-auth-challenge'
      Runtime: nodejs16.x
      Handler: index.handler
      Role: !GetAtt CognitoTriggerLambdaRole.Arn
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          OTP_TABLE: !Ref OtpTable
      Code:
        ZipFile: |
          const AWS = require('aws-sdk');
          const crypto = require('crypto');
          const ddb = new AWS.DynamoDB.DocumentClient();
          const cognito = new AWS.CognitoIdentityServiceProvider();
          
          function phoneToCognitoUsername(phoneNumberE164) {
            const digitsOnly = phoneNumberE164.replace(/\D/g, '');
            return `${digitsOnly}@phone.realityflow.local`;
          }
          
          exports.handler = async (event) => {
            try {
              const phoneNumber = event.request.userAttributes?.phone_number;
              const answer = event.request.challengeAnswer;
              console.log('VerifyAuthChallenge request', {
                userPoolId: event.userPoolId,
                phoneNumber,
                hasAnswer: !!answer,
              });
              
              if (!phoneNumber || !answer) {
                event.response.answerCorrect = false;
                return event;
              }
              
              // Get OTP record
              const result = await ddb.get({
                TableName: process.env.OTP_TABLE,
                Key: {
                  PhoneNumber: phoneNumber,
                  SK: 'OTP#LOGIN'
                }
              }).promise();
              
              if (!result.Item) {
                event.response.answerCorrect = false;
                return event;
              }
              
              const otpRecord = result.Item;
              const now = Date.now();
              
              // Check expiry
              if (now > otpRecord.ttl * 1000) {
                await ddb.delete({
                  TableName: process.env.OTP_TABLE,
                  Key: { PhoneNumber: phoneNumber, SK: 'OTP#LOGIN' }
                }).promise();
                event.response.answerCorrect = false;
                return event;
              }
              
              // Check attempts
              if (otpRecord.attempts >= 3) {
                await ddb.delete({
                  TableName: process.env.OTP_TABLE,
                  Key: { PhoneNumber: phoneNumber, SK: 'OTP#LOGIN' }
                }).promise();
                event.response.answerCorrect = false;
                return event;
              }
              
              // Verify OTP
              const answerHash = crypto.createHash('sha256').update(answer).digest('hex');
              const isCorrect = answerHash === otpRecord.otpHash;
              console.log('VerifyAuthChallenge comparison', {
                phoneNumber,
                isCorrect,
                attempts: otpRecord.attempts,
              });
              
              if (isCorrect) {
                // Delete OTP on success
                await ddb.delete({
                  TableName: process.env.OTP_TABLE,
                  Key: { PhoneNumber: phoneNumber, SK: 'OTP#LOGIN' }
                }).promise();
              } else {
                // Increment attempts
                await ddb.update({
                  TableName: process.env.OTP_TABLE,
                  Key: { PhoneNumber: phoneNumber, SK: 'OTP#LOGIN' },
                  UpdateExpression: 'SET attempts = attempts + :inc',
                  ExpressionAttributeValues: { ':inc': 1 }
                }).promise();
              }
              
              event.response.answerCorrect = isCorrect;
              return event;
            } catch (error) {
              console.error('VerifyAuthChallenge error:', error);
              event.response.answerCorrect = false;
              return event;
            }
          };

  # ===========================================================================
  # 10. IAM Role for Main Lambda
  # ===========================================================================
  AuthLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Env}-${ServiceName}-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt UsersTable.Arn
                  - !GetAtt AgencyConfigTable.Arn
                  - !GetAtt OtpTable.Arn
                  - !GetAtt AuthIdentitiesTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:Query
                Resource:
                  - !Sub '${UsersTable.Arn}/index/UserIdIndex'
                  - !Sub '${UsersTable.Arn}/index/EmailIndex'
                  - !Sub '${UsersTable.Arn}/index/PhoneIndex'
                  - !GetAtt AgencyConfigTable.Arn
                  - !Sub '${AgencyConfigTable.Arn}/index/AdminEmailIndex'
                  - !Sub '${AgencyConfigTable.Arn}/index/AdminPhoneIndex'
        - PolicyName: SNSPublish
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: '*'
        - PolicyName: CognitoReadAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:AdminGetUser
                  - cognito-idp:ListUsers
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminInitiateAuth
                  - cognito-idp:RespondToAuthChallenge
                Resource:
                  - !GetAtt CognitoUserPoolV2.Arn

  # ===========================================================================
  # 11. Lambda Function
  # ===========================================================================
  AuthLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Env}-${ServiceName}-lambda'
      Runtime: nodejs18.x
      Handler: dist/index.handler
      Role: !GetAtt AuthLambdaRole.Arn
      Timeout: !Ref LambdaTimeout
      MemorySize: !Ref LambdaMemorySize
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTable
          AUTH_IDENTITIES_TABLE: !Ref AuthIdentitiesTable
          AGENCY_CONFIG_TABLE: !Ref AgencyConfigTable
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolV2
          COGNITO_CLIENT_ID: !Ref UserPoolClientV2
          COGNITO_HOSTED_UI_DOMAIN: !Sub 'https://${UserPoolDomainV2}.auth.${AWS::Region}.amazoncognito.com'
          AWS_REGION_NAME: !Ref 'AWS::Region'
          ENV: !Ref Env
          OTP_TABLE: !Ref OtpTable
      Code:
        S3Bucket: !Ref LambdaPackagesBucketName
        S3Key: !Sub '${ServiceName}/function.zip'

  # ===========================================================================
  # 12. CloudWatch Log Groups
  # ===========================================================================
  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${Env}-${ServiceName}-lambda'
      RetentionInDays: !Ref LogRetentionInDays

  TriggerLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${Env}-${ServiceName}-define-auth-challenge'
      RetentionInDays: !Ref LogRetentionInDays

  TriggerLambdaLogGroup2:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${Env}-${ServiceName}-create-auth-challenge'
      RetentionInDays: !Ref LogRetentionInDays

  TriggerLambdaLogGroup3:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${Env}-${ServiceName}-verify-auth-challenge'
      RetentionInDays: !Ref LogRetentionInDays

  ApiGatewayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apigateway/${Env}-${ServiceName}-api'
      RetentionInDays: !Ref LogRetentionInDays

  # ===========================================================================
  # 10. API Gateway REST API
  # ===========================================================================
  AuthApiGateway:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub '${Env}-${ServiceName}-api'
      Description: Reality Flow Authentication API
      EndpointConfiguration:
        Types:
          - REGIONAL

  # ===========================================================================
  # 11. Cognito Authorizer for API Gateway
  # ===========================================================================
  CognitoAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: CognitoAuthorizer
      RestApiId: !Ref AuthApiGateway
      Type: COGNITO_USER_POOLS
      IdentitySource: method.request.header.Authorization
      ProviderARNs:
        - !GetAtt CognitoUserPoolV2.Arn

  # ===========================================================================
  # 12. API Gateway — Explicit Routes (Nested Stack)
  # ===========================================================================
  ApiGatewayRoutesStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Ref ApiGatewayRoutesTemplateUrl
      Parameters:
        RestApiId: !Ref AuthApiGateway
        RootResourceId: !GetAtt AuthApiGateway.RootResourceId
        LambdaFunctionArn: !GetAtt AuthLambdaFunction.Arn
        CognitoAuthorizerId: !Ref CognitoAuthorizer
        AllowOrigin: "*"
        AllowHeaders: "Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Access-Token"
        AllowMethods: "GET,POST,PATCH,PUT,DELETE,OPTIONS"

  # ===========================================================================
  # 13. Cognito Trigger Lambda Permissions
  # ===========================================================================
  DefineAuthChallengeLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DefineAuthChallengeLambda
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com

  CreateAuthChallengeLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CreateAuthChallengeLambda
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com

  VerifyAuthChallengeResponseLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref VerifyAuthChallengeResponseLambda
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com

  # ===========================================================================
  # 14. Lambda Invoke Permissions
  # ===========================================================================
  LambdaApiGatewayProxyPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AuthLambdaFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${AuthApiGateway}/*/*/{proxy+}'

  LambdaApiGatewayRootPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AuthLambdaFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${AuthApiGateway}/*/*/*'

  # ===========================================================================
  # 15. API Gateway Deployment & Stage
  # ===========================================================================
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - ApiGatewayRoutesStack
    Properties:
      RestApiId: !Ref AuthApiGateway

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      StageName: !Ref Env
      RestApiId: !Ref AuthApiGateway
      DeploymentId: !Ref ApiDeployment
      AccessLogSetting:
        DestinationArn: !GetAtt ApiGatewayLogGroup.Arn
# Outputs
# =============================================================================
Outputs:
  # V1 outputs removed - resources deprecated

  AuthApiEndpoint:
    Description: Auth API Gateway Endpoint URL
    Value: !Sub 'https://${AuthApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Env}'
    Export:
      Name: !Sub '${AWS::StackName}-AuthApiEndpoint'

  AuthApiGatewayId:
    Description: Auth API Gateway ID
    Value: !Ref AuthApiGateway
    Export:
      Name: !Sub '${AWS::StackName}-AuthApiGatewayId'

  AuthLambdaFunctionArn:
    Description: Auth Lambda Function ARN
    Value: !GetAtt AuthLambdaFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-AuthLambdaArn'

  UsersTableName:
    Description: DynamoDB Users Table Name
    Value: !Ref UsersTable
    Export:
      Name: !Sub '${AWS::StackName}-UsersTableName'

  UsersTableArn:
    Description: DynamoDB Users Table ARN
    Value: !GetAtt UsersTable.Arn
    Export:
      Name: !Sub '${AWS::StackName}-UsersTableArn'

  AuthIdentitiesTableName:
    Description: DynamoDB Auth Identities Table Name
    Value: !Ref AuthIdentitiesTable
    Export:
      Name: !Sub '${AWS::StackName}-AuthIdentitiesTableName'

  AuthIdentitiesTableArn:
    Description: DynamoDB Auth Identities Table ARN
    Value: !GetAtt AuthIdentitiesTable.Arn
    Export:
      Name: !Sub '${AWS::StackName}-AuthIdentitiesTableArn'

  AgencyConfigTableName:
    Description: DynamoDB Agency Config Table Name
    Value: !Ref AgencyConfigTable
    Export:
      Name: !Sub '${AWS::StackName}-AgencyConfigTableName'

  AgencyConfigTableArn:
    Description: DynamoDB Agency Config Table ARN
    Value: !GetAtt AgencyConfigTable.Arn
    Export:
      Name: !Sub '${AWS::StackName}-AgencyConfigTableArn'

  OtpTableName:
    Description: DynamoDB OTP Table Name
    Value: !Ref OtpTable
    Export:
      Name: !Sub '${AWS::StackName}-OtpTableName'

  OtpTableArn:
    Description: DynamoDB OTP Table ARN
    Value: !GetAtt OtpTable.Arn
    Export:
      Name: !Sub '${AWS::StackName}-OtpTableArn'

  # V2 Cognito Outputs (with Phone Authentication)
  CognitoUserPoolIdV2:
    Description: Cognito User Pool V2 ID (with Phone Auth)
    Value: !Ref CognitoUserPoolV2
    Export:
      Name: !Sub '${AWS::StackName}-CognitoUserPoolIdV2'

  CognitoUserPoolArnV2:
    Description: Cognito User Pool V2 ARN
    Value: !GetAtt CognitoUserPoolV2.Arn
    Export:
      Name: !Sub '${AWS::StackName}-CognitoUserPoolArnV2'

  CognitoClientIdV2:
    Description: Cognito User Pool Client V2 ID (with Phone Auth)
    Value: !Ref UserPoolClientV2
    Export:
      Name: !Sub '${AWS::StackName}-CognitoClientIdV2'

  CognitoHostedUIDomainV2:
    Description: Cognito Hosted UI Domain V2
    Value: !Sub 'https://${CognitoDomainPrefixV2}.auth.${AWS::Region}.amazoncognito.com'
    Export:
      Name: !Sub '${AWS::StackName}-CognitoHostedUIDomainV2'
