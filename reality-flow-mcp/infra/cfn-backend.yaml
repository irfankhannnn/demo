AWSTemplateFormatVersion: "2010-09-09"
Description:
  "CloudFormation template for RealtyFlow MCP Server (Model Context Protocol)
  - Separate Lambda + API Gateway for MCP integration with Claude, ChatGPT, and other AI apps"

Parameters:
  ServiceName:
    Type: String
    Default: realtyflow-mcp
    Description: Service name for resource naming

  Env:
    Type: String
    Default: prod
    AllowedValues: [dev, test, prod]
    Description: Environment name

  LambdaMemorySize:
    Type: Number
    Default: 512
    MinValue: 128
    MaxValue: 10240
    Description: Lambda memory size in MB

  LambdaTimeout:
    Type: Number
    Default: 60
    MinValue: 1
    MaxValue: 900
    Description: Lambda timeout in seconds

  LogRetentionInDays:
    Type: Number
    Default: 30
    AllowedValues:
      [
        1,
        3,
        5,
        7,
        14,
        30,
        60,
        90,
        120,
        150,
        180,
        365,
        400,
        545,
        731,
        1827,
        3653,
      ]
    Description: CloudWatch log retention in days

  LambdaPackagesBucketName:
    Type: String
    Description: S3 bucket name where MCP Lambda deployment package is stored

  LambdaCodeS3Key:
    Type: String
    Default: realestate-flow-mcp/function.zip
    Description: S3 object key for the packaged Lambda zip

  OAuthCodesTableName:
    Type: String
    Default: realtyflow-oauth-codes
    Description: DynamoDB table name for OAuth authorization codes

  OAuthConnectionsTableName:
    Type: String
    Default: realtyflow-oauth-connections
    Description: DynamoDB table name for connected OAuth apps (Claude, ChatGPT, etc.)

  JWTSecret:
    Type: String
    NoEcho: true
    Description: Secret key for JWT token signing

  JWTRefreshSecret:
    Type: String
    NoEcho: true
    Description: Secret key for JWT refresh token signing

  # --- Outgoing calls: always custom domain + base path, never execute-api ---
  CrmApiDomainName:
    Type: String
    AllowedPattern: '^[a-zA-Z0-9.-]+$'
    ConstraintDescription: Bare custom domain host (no scheme, no path)
    Description: >-
      Custom domain of server's CRM API (services-api.cloudberrysolutions.in
      dev / services-api.realestateflow.in prod). The MCP calls
      https://<CrmApiDomainName>/<CrmApiBasePath>/api/crm/agent/tool.

  CrmApiBasePath:
    Type: String
    AllowedPattern: '^[a-zA-Z0-9._-]+$'
    Description: Base path of server's CRM API mapping (devrealestatecrm / prodrealestatecrm)

  CrmApiInternalKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: Internal API key for CRM backend (optional)

  AuthServiceDomainName:
    Type: String
    AllowedPattern: '^[a-zA-Z0-9.-]+$'
    ConstraintDescription: Bare custom domain host (no scheme, no path)
    Description: >-
      Custom domain of the auth microservice (for validating Cognito tokens
      on /oauth/authorize via GET /auth/me).

  AuthServiceBasePath:
    Type: String
    AllowedPattern: '^[a-zA-Z0-9._-]+$'
    Description: Base path of the auth API mapping (devrealestateauth / prodrealestateauth)

  AllowedOrigins:
    Type: String
    Default: "http://localhost:3000,http://localhost:5173,https://app.realtyflow.com"
    Description: Comma-separated list of allowed CORS origins

  FrontendUrl:
    Type: String
    Default: "https://app.realestateflow.in"
    Description: >
      RealtyFlow frontend URL used for OAuth login redirects (Claude Desktop flow).
      When a user reaches /oauth/authorize without a session, they are redirected here
      so they can log in and generate a session code.

  # --- This API's own custom domain mapping ---
  # Replaces the old optional DomainName param, whose empty value made
  # OAUTH_BASE_URL fall back to the raw execute-api invoke URL.
  McpApiDomainName:
    Type: String
    AllowedPattern: '^[a-zA-Z0-9.-]+$'
    ConstraintDescription: Bare custom domain host (no scheme, no path)
    Description: >-
      API Gateway custom domain this API is mapped onto
      (services-api.cloudberrysolutions.in dev / services-api.realestateflow.in
      prod). Must already exist as an AWS::ApiGateway::DomainName.

  McpApiBasePath:
    Type: String
    AllowedPattern: '^[a-zA-Z0-9._-]+$'
    Description: >-
      Base path of this API's mapping on McpApiDomainName (devrealestatemcp /
      prodrealestatemcp). The MCP server's public URL, OAuth issuer and every
      published URL are https://<McpApiDomainName>/<McpApiBasePath>.

  EnableCustomDomainMapping:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Create the BasePathMapping on McpApiDomainName (both env domains exist - set true)

  EnableBasePathStrip:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      Lambda strips /<McpApiBasePath> from event.path (a base path mapping
      does not strip it for AWS_PROXY integrations). Keep equal to
      EnableCustomDomainMapping.

Conditions:
  CustomDomainMappingEnabled: !Equals [!Ref EnableCustomDomainMapping, "true"]

Resources:
  # ============================================================================
  # IAM ROLES
  # ============================================================================

  McpLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ServiceName}-${Env}-lambda-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchGetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:BatchWriteItem
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${OAuthCodesTableName}"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${OAuthCodesTableName}/index/*"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${OAuthConnectionsTableName}"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${OAuthConnectionsTableName}/index/*"

  JwtAuthorizerLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ServiceName}-${Env}-authorizer-lambda-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${OAuthCodesTableName}"

  # ============================================================================
  # DYNAMODB TABLES
  # ============================================================================

  OAuthCodesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref OAuthCodesTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: code
          AttributeType: S
      KeySchema:
        - AttributeName: code
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      Tags:
        - Key: Service
          Value: !Ref ServiceName
        - Key: Environment
          Value: !Ref Env

  OAuthConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref OAuthConnectionsTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      Tags:
        - Key: Service
          Value: !Ref ServiceName
        - Key: Environment
          Value: !Ref Env

  # ============================================================================
  # LAMBDA FUNCTIONS
  # ============================================================================

  McpLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ServiceName}-${Env}-mcp"
      Runtime: nodejs20.x
      Handler: dist/index.handler
      Role: !GetAtt McpLambdaExecutionRole.Arn
      MemorySize: !Ref LambdaMemorySize
      Timeout: !Ref LambdaTimeout
      Code:
        S3Bucket: !Ref LambdaPackagesBucketName
        S3Key: !Ref LambdaCodeS3Key
      Environment:
        Variables:
          NODE_ENV: !Ref Env
          ENV: !Ref Env
          OAUTH_CODES_TABLE_NAME: !Ref OAuthCodesTableName
          OAUTH_CONNECTIONS_TABLE: !Ref OAuthConnectionsTableName
          JWT_SECRET: !Ref JWTSecret
          JWT_REFRESH_SECRET: !Ref JWTRefreshSecret
          CRM_API_DOMAIN_NAME: !Ref CrmApiDomainName
          CRM_API_BASE_PATH: !Ref CrmApiBasePath
          CRM_API_INTERNAL_KEY: !Ref CrmApiInternalKey
          AUTH_SERVICE_DOMAIN_NAME: !Ref AuthServiceDomainName
          AUTH_SERVICE_BASE_PATH: !Ref AuthServiceBasePath
          # src/config/config.ts composes the public base URL (OAuth issuer,
          # well-known metadata, WWW-Authenticate resource_metadata) as
          # https://${MCP_API_DOMAIN_NAME}/${MCP_API_BASE_PATH}. No raw fallback.
          MCP_API_DOMAIN_NAME: !Ref McpApiDomainName
          MCP_API_BASE_PATH: !Ref McpApiBasePath
          ENABLE_BASE_PATH_STRIP: !Ref EnableBasePathStrip
          ALLOWED_ORIGINS: !Ref AllowedOrigins
          FRONTEND_URL: !Ref FrontendUrl
      Tags:
        - Key: Service
          Value: !Ref ServiceName
        - Key: Environment
          Value: !Ref Env

  McpLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${McpLambdaFunction}"
      RetentionInDays: !Ref LogRetentionInDays

  JwtAuthorizerLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ServiceName}-${Env}-jwt-authorizer"
      Runtime: nodejs20.x
      Handler: dist/authorizers/jwtAuthorizer.handler
      Role: !GetAtt JwtAuthorizerLambdaExecutionRole.Arn
      MemorySize: 256
      Timeout: 10
      Code:
        S3Bucket: !Ref LambdaPackagesBucketName
        S3Key: !Ref LambdaCodeS3Key
      Environment:
        Variables:
          JWT_SECRET: !Ref JWTSecret
          JWT_REFRESH_SECRET: !Ref JWTRefreshSecret
          OAUTH_CODES_TABLE_NAME: !Ref OAuthCodesTableName
      Tags:
        - Key: Service
          Value: !Ref ServiceName
        - Key: Environment
          Value: !Ref Env

  JwtAuthorizerLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${JwtAuthorizerLambdaFunction}"
      RetentionInDays: !Ref LogRetentionInDays

  # ============================================================================
  # API GATEWAY
  # ============================================================================

  McpApiGateway:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "${ServiceName}-${Env}"
      Description: MCP Server API Gateway for Claude, ChatGPT, and other AI apps
      EndpointConfiguration:
        Types:
          - REGIONAL

  McpApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/apigateway/${McpApiGateway}"
      RetentionInDays: !Ref LogRetentionInDays

  # NOTE: AWS::ApiGateway::Account and its CloudWatch role are account-level
  # global resources. They should be configured once per AWS account, not per
  # stack. If another stack in this account already configures them, creating
  # them here will fail with "Account already has a CloudWatch role configured".
  # Configure API Gateway CloudWatch logging at the account level separately.

  # ============================================================================
  # JWT AUTHORIZER
  # ============================================================================

  JwtAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      RestApiId: !Ref McpApiGateway
      Name: !Sub "${ServiceName}-${Env}-jwt-authorizer"
      Type: TOKEN
      AuthorizerUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${JwtAuthorizerLambdaFunction.Arn}/invocations"
      AuthorizerCredentials: !GetAtt ApiGatewayAuthorizerRole.Arn
      AuthorizerResultTtlInSeconds: 300
      IdentitySource: method.request.header.Authorization

  ApiGatewayAuthorizerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeLambdaAuthorizer
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt JwtAuthorizerLambdaFunction.Arn

  JwtAuthorizerLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref JwtAuthorizerLambdaFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${McpApiGateway}/authorizers/${JwtAuthorizer}"

  # ============================================================================
  # API GATEWAY RESOURCES & METHODS
  # ============================================================================

  # --- /mcp (POST — public at API Gateway; JWT validation handled inside Lambda) ---
  McpResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref McpApiGateway
      ParentId: !GetAtt McpApiGateway.RootResourceId
      PathPart: mcp

  McpMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref McpApiGateway
      ResourceId: !Ref McpResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${McpLambdaFunction.Arn}/invocations"
        TimeoutInMillis: 29000
      MethodResponses:
        - StatusCode: 200
          ResponseModels:
            application/json: Empty
        - StatusCode: 401
          ResponseModels:
            application/json: Empty

  McpGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref McpApiGateway
      ResourceId: !Ref McpResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${McpLambdaFunction.Arn}/invocations"
        TimeoutInMillis: 29000
      MethodResponses:
        - StatusCode: 200
          ResponseModels:
            application/json: Empty
        - StatusCode: 401
          ResponseModels:
            application/json: Empty

  McpLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref McpLambdaFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${McpApiGateway}/*/*"

  # --- /oauth (GET/POST — public, no JWT authorizer) ---
  OAuthResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref McpApiGateway
      ParentId: !GetAtt McpApiGateway.RootResourceId
      PathPart: oauth

  # /oauth/authorize (GET)
  OAuthAuthorizeResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref McpApiGateway
      ParentId: !Ref OAuthResource
      PathPart: authorize

  OAuthAuthorizeGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref McpApiGateway
      ResourceId: !Ref OAuthAuthorizeResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${McpLambdaFunction.Arn}/invocations"

  # /oauth/authorize (POST)
  OAuthAuthorizePostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref McpApiGateway
      ResourceId: !Ref OAuthAuthorizeResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${McpLambdaFunction.Arn}/invocations"

  # /oauth/token (POST)
  OAuthTokenResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref McpApiGateway
      ParentId: !Ref OAuthResource
      PathPart: token

  OAuthTokenPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref McpApiGateway
      ResourceId: !Ref OAuthTokenResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${McpLambdaFunction.Arn}/invocations"

  # /oauth/revoke (POST)
  OAuthRevokeResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref McpApiGateway
      ParentId: !Ref OAuthResource
      PathPart: revoke

  OAuthRevokePostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref McpApiGateway
      ResourceId: !Ref OAuthRevokeResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${McpLambdaFunction.Arn}/invocations"

  # /oauth/register (POST — DCR, public)
  OAuthRegisterResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref McpApiGateway
      ParentId: !Ref OAuthResource
      PathPart: register

  OAuthRegisterPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref McpApiGateway
      ResourceId: !Ref OAuthRegisterResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${McpLambdaFunction.Arn}/invocations"

  # --- /.well-known/oauth-authorization-server (GET — public, OAuth discovery) ---
  WellKnownResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref McpApiGateway
      ParentId: !GetAtt McpApiGateway.RootResourceId
      PathPart: .well-known

  WellKnownOAuthResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref McpApiGateway
      ParentId: !Ref WellKnownResource
      PathPart: oauth-authorization-server

  WellKnownOAuthGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref McpApiGateway
      ResourceId: !Ref WellKnownOAuthResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${McpLambdaFunction.Arn}/invocations"

  # --- /.well-known/oauth-protected-resource (GET — public, RFC 9728) ---
  WellKnownProtectedResourceResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref McpApiGateway
      ParentId: !Ref WellKnownResource
      PathPart: oauth-protected-resource

  WellKnownProtectedResourceGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref McpApiGateway
      ResourceId: !Ref WellKnownProtectedResourceResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${McpLambdaFunction.Arn}/invocations"

  # --- /health (GET — public) ---
  HealthResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref McpApiGateway
      ParentId: !GetAtt McpApiGateway.RootResourceId
      PathPart: health

  HealthGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref McpApiGateway
      ResourceId: !Ref HealthResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${McpLambdaFunction.Arn}/invocations"

  # ============================================================================
  # API GATEWAY DEPLOYMENT & STAGE
  # ============================================================================

  McpApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - McpMethod
      - McpGetMethod
      - OAuthAuthorizeGetMethod
      - OAuthAuthorizePostMethod
      - OAuthTokenPostMethod
      - OAuthRevokePostMethod
      - OAuthRegisterPostMethod
      - WellKnownOAuthGetMethod
      - HealthGetMethod
    Properties:
      RestApiId: !Ref McpApiGateway

  McpApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref McpApiGateway
      DeploymentId: !Ref McpApiDeployment
      StageName: !Ref Env
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          LoggingLevel: INFO
          DataTraceEnabled: false
          MetricsEnabled: true

  McpApiBasePathMapping:
    Type: AWS::ApiGateway::BasePathMapping
    Condition: CustomDomainMappingEnabled
    DependsOn:
      - McpApiStage
    Properties:
      DomainName: !Ref McpApiDomainName
      BasePath: !Ref McpApiBasePath
      RestApiId: !Ref McpApiGateway
      Stage: !Ref Env

  # ============================================================================
  # OUTPUTS
  # ============================================================================

Outputs:
  # Raw execute-api McpApiUrl / OAuth*Url outputs removed (custom-domain
  # contract). Their only consumer was infra/deploy.sh's summary printout,
  # now derived from McpApiBaseUrl; no stack imported their exports
  # (aws cloudformation list-imports, 2026-09-14).
  McpApiBaseUrl:
    Description: >-
      MCP server public base URL via custom domain. MCP endpoint = <this>/mcp,
      OAuth metadata = <this>/.well-known/oauth-authorization-server.
    Value: !Sub "https://${McpApiDomainName}/${McpApiBasePath}"
    Export:
      Name: !Sub "${ServiceName}-${Env}-api-base-url"

  McpLambdaArn:
    Description: MCP Lambda function ARN
    Value: !GetAtt McpLambdaFunction.Arn
    Export:
      Name: !Sub "${ServiceName}-${Env}-lambda-arn"

  JwtAuthorizerArn:
    Description: JWT Authorizer Lambda function ARN
    Value: !GetAtt JwtAuthorizerLambdaFunction.Arn
    Export:
      Name: !Sub "${ServiceName}-${Env}-authorizer-arn"

  OAuthCodesTableName:
    Description: OAuth codes DynamoDB table name
    Value: !Ref OAuthCodesTable
    Export:
      Name: !Sub "${ServiceName}-${Env}-oauth-codes-table"

  OAuthConnectionsTableName:
    Description: OAuth connections DynamoDB table name
    Value: !Ref OAuthConnectionsTable
    Export:
      Name: !Sub "${ServiceName}-${Env}-oauth-connections-table"

  ApiGatewayId:
    Description: API Gateway ID
    Value: !Ref McpApiGateway
    Export:
      Name: !Sub "${ServiceName}-${Env}-api-gateway-id"

  McpLambdaFunctionName:
    Description: MCP Lambda function name
    Value: !Ref McpLambdaFunction
    Export:
      Name: !Sub "${ServiceName}-${Env}-lambda-name"
