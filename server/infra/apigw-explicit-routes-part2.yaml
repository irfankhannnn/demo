AWSTemplateFormatVersion: "2010-09-09"
Description: >
  API Gateway resources (split stack). Explicit methods for stable/core endpoints;
  catch-all proxy under /api handles ad-hoc routes without manual CFN edits.

Parameters:
  RestApiId:
    Type: String
  RootResourceId:
    Type: String
  LambdaFunctionArn:
    Type: String
  AllowOrigin:
    Type: String
    Default: "*"
  AllowHeaders:
    Type: String
    Default: "Content-Type,Authorization,X-Requested-With,x-tenant-id"
  AllowMethods:
    Type: String
    Default: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
  ApiResourceId:
    Type: String
  CrmContactResourceId:
    Type: String
  CrmResourceId:
    Type: String

Resources:

  CrmContactActivityResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApiId
      ParentId: !Ref CrmContactResourceId
      PathPart: activity

  CrmContactActivityGetMethod:
    Type: AWS::ApiGateway::Method
    DependsOn: CrmContactActivityResource
    Properties:
      RestApiId: !Ref RestApiId
      ResourceId: !Ref CrmContactActivityResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaFunctionArn}/invocations"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
        - StatusCode: 201
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
        - StatusCode: 400
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
        - StatusCode: 401
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
        - StatusCode: 403
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
        - StatusCode: 404
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
        - StatusCode: 500
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true

  CrmContactActivityOptionsMethod:
    Type: AWS::ApiGateway::Method
    DependsOn: CrmContactActivityGetMethod
    Properties:
      RestApiId: !Ref RestApiId
      ResourceId: !Ref CrmContactActivityResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        PassthroughBehavior: NEVER
        ContentHandling: CONVERT_TO_TEXT
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ContentHandling: CONVERT_TO_TEXT
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: !Sub "'${AllowHeaders}'"
              method.response.header.Access-Control-Allow-Methods: !Sub "'${AllowMethods}'"
              method.response.header.Access-Control-Allow-Origin: !Sub "'${AllowOrigin}'"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

