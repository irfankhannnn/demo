AWSTemplateFormatVersion: '2010-09-09'
Description: 'WhatsApp Message Processor — EventBridge bailey.whatsapp triggered'

Parameters:
  LambdaCodeS3Bucket:
    Type: String
  LambdaCodeS3Key:
    Type: String
  CrmTableName:
    Type: String
    Default: 'cloudberry-real-estate-crm'
  SubscriptionsTableName:
    Type: String
    Default: 'Subscriptions'
  BaileyEnabled:
    Type: String
    Default: 'false'

Resources:
  WhatsAppProcessorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: realestateflow-whatsapp-processor-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: WhatsAppProcessorPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CrmTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CrmTableName}/*'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SubscriptionsTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SubscriptionsTableName}/*'
              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource: '*'

  WhatsAppProcessorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: realestateflow-whatsapp-processor
      Runtime: nodejs20.x
      Handler: whatsapp-message-processor.handler
      Role: !GetAtt WhatsAppProcessorRole.Arn
      Timeout: 120
      MemorySize: 256
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      Environment:
        Variables:
          CRM_DYNAMODB_TABLE_NAME: !Ref CrmTableName
          SUBSCRIPTIONS_TABLE: !Ref SubscriptionsTableName
          BAILEY_ENABLED: !Ref BaileyEnabled
          AWS_REGION_OVERRIDE: 'ap-south-1'

  WhatsAppProcessorRule:
    Type: AWS::Events::Rule
    Properties:
      Name: realestateflow-whatsapp-processor
      Description: 'Process incoming WhatsApp messages from Bailey gateway'
      EventPattern:
        source:
          - 'bailey.whatsapp'
        detail-type:
          - 'whatsapp.message.received'
      State: DISABLED
      Targets:
        - Arn: !GetAtt WhatsAppProcessorFunction.Arn
          Id: WhatsAppProcessorTarget

  WhatsAppProcessorPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WhatsAppProcessorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt WhatsAppProcessorRule.Arn
