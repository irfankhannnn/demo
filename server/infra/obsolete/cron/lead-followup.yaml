AWSTemplateFormatVersion: '2010-09-09'
Description: 'Lead Followup Cron — daily at 04:00 IST (22:30 UTC previous day)'

Parameters:
  LambdaCodeS3Bucket:
    Type: String
  LambdaCodeS3Key:
    Type: String
  CrmTableName:
    Type: String
    Default: 'cloudberry-real-estate-crm'
  SesFromEmail:
    Type: String
    Default: 'noreply@realestateflow.in'
  EmailProviderPrimary:
    Type: String
    Default: 'ses'

Resources:
  LeadFollowupRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: realestateflow-lead-followup-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: LeadFollowupPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:UpdateItem
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CrmTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CrmTableName}/*'
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource:
                  - !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${SesFromEmail}'

  LeadFollowupFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: realestateflow-lead-followup
      Runtime: nodejs20.x
      Handler: lead-followup-cron.handler
      Role: !GetAtt LeadFollowupRole.Arn
      Timeout: 300
      MemorySize: 256
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      Environment:
        Variables:
          CRM_DYNAMODB_TABLE_NAME: !Ref CrmTableName
          AWS_SES_FROM_EMAIL: !Ref SesFromEmail
          EMAIL_PROVIDER_PRIMARY: !Ref EmailProviderPrimary
          AWS_REGION_OVERRIDE: 'ap-south-1'

  LeadFollowupRule:
    Type: AWS::Events::Rule
    Properties:
      Name: realestateflow-lead-followup
      Description: 'Daily at 04:00 IST — send follow-up nudges for stale leads'
      ScheduleExpression: 'cron(30 22 * * ? *)'
      State: DISABLED
      Targets:
        - Arn: !GetAtt LeadFollowupFunction.Arn
          Id: LeadFollowupTarget

  LeadFollowupPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LeadFollowupFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt LeadFollowupRule.Arn
