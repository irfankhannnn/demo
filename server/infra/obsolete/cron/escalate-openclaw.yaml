# EventBridge scheduled rule — AI Employee SLA escalation
# Runs every 6 hours to check for pending provisioning rows past 24h SLA
#
# Scans AIEmployeeProvisioning where status=pending and now > expectedSLAEnd
# On breach: status → escalated, emails founder + customer, PostHog event
# NOTE: Razorpay ₹500 credit note is a manual step for M1

AWSTemplateFormatVersion: '2010-09-09'
Description: 'AI Employee SLA Escalation Cron (every 6h)'

Parameters:
  BrevoApiKey:
    Type: String
    NoEcho: true
    Default: ''
  BrevoEscalatedTemplateId:
    Type: String
    Default: ''
  FounderWhatsApp:
    Type: String
    Default: ''
  PostHogKeyServer:
    Type: String
    NoEcho: true
    Default: ''
  SesFromEmail:
    Type: String
    Default: 'noreply@realestateflow.in'
  EmailProviderPrimary:
    Type: String
    Default: 'ses'
  LambdaCodeS3Bucket:
    Type: String
  LambdaCodeS3Key:
    Type: String

Resources:
  EscalationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: realestateflow-escalation-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: EscalationPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/AIEmployeeProvisioning'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/AIEmployeeProvisioning/*'
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource:
                  - !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${SesFromEmail}'

  EscalationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: realestateflow-ai-employee-escalation
      Runtime: nodejs20.x
      Handler: escalation-cron.handler
      Role: !GetAtt EscalationRole.Arn
      Timeout: 60
      MemorySize: 128
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      Environment:
        Variables:
          AWS_REGION_OVERRIDE: ap-south-1
          AI_EMPLOYEE_PROVISIONING_TABLE: AIEmployeeProvisioning
          BREVO_API_KEY: !Ref BrevoApiKey
          BREVO_AI_EMPLOYEE_ESCALATED_FOUNDER_TEMPLATE_ID: !Ref BrevoEscalatedTemplateId
          BREVO_AI_EMPLOYEE_ESCALATED_CUSTOMER_TEMPLATE_ID: !Ref BrevoEscalatedTemplateId
          FOUNDER_EMAIL: info@realestateflow.in
          FOUNDER_WHATSAPP: !Ref FounderWhatsApp
          POSTHOG_KEY_SERVER: !Ref PostHogKeyServer
          AWS_SES_FROM_EMAIL: !Ref SesFromEmail
          EMAIL_PROVIDER_PRIMARY: !Ref EmailProviderPrimary

  EscalationSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: ai-employee-escalation-6h
      Description: 'Every 6 hours — check pending AI Employee provisioning SLA'
      ScheduleExpression: 'rate(6 hours)'
      State: ENABLED
      Targets:
        - Arn: !GetAtt EscalationFunction.Arn
          Id: EscalationTarget

  EscalationPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref EscalationFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt EscalationSchedule.Arn
