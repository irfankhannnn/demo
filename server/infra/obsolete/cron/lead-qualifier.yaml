AWSTemplateFormatVersion: '2010-09-09'
Description: 'Lead qualifier agent — EventBridge lead.created'

Parameters:
  LambdaCodeS3Bucket:
    Type: String
  LambdaCodeS3Key:
    Type: String
  CrmTableName:
    Type: String
    Default: 'cloudberry-real-estate-crm'
  CreditConfigTableName:
    Type: String
    Default: 'cloudberry-real-estate-credit-config'
  CreditsTableName:
    Type: String
    Default: 'cloudberry-real-estate-credits'
  AgentsEnabled:
    Type: String
    Default: 'false'

Resources:
  LeadQualifierRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: realestateflow-lead-qualifier-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: LeadQualifierPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CrmTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CrmTableName}/*'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CreditConfigTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CreditConfigTableName}/*'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CreditsTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CreditsTableName}/*'
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: '*'

  LeadQualifierFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: realestateflow-lead-qualifier
      Runtime: nodejs20.x
      Handler: lead-qualifier-handler.handler
      Role: !GetAtt LeadQualifierRole.Arn
      Timeout: 60
      MemorySize: 512
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      Environment:
        Variables:
          CRM_DYNAMODB_TABLE_NAME: !Ref CrmTableName
          CREDIT_CONFIG_TABLE_NAME: !Ref CreditConfigTableName
          CREDITS_TABLE_NAME: !Ref CreditsTableName
          AGENTS_ENABLED: !Ref AgentsEnabled
          AWS_REGION_OVERRIDE: 'ap-south-1'

  LeadQualifierRule:
    Type: AWS::Events::Rule
    Properties:
      Name: realestateflow-lead-qualifier
      EventPattern:
        source:
          - 'crm.leads'
        detail-type:
          - 'lead.created'
      State: DISABLED
      Targets:
        - Arn: !GetAtt LeadQualifierFunction.Arn
          Id: LeadQualifierTarget

  LeadQualifierPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LeadQualifierFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt LeadQualifierRule.Arn
