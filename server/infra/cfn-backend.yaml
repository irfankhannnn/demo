            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: LeadQualifierPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CrmDynamoDbTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CrmDynamoDbTableName}/*'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CreditConfigTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CreditConfigTableName}/*'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CreditsTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CreditsTableName}/*'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${UserCategoriesTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${UserCategoriesTableName}/*'
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: '*'
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-haiku-20240307-v1:0'
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt AgentAuditTable.Arn
                  - !Sub '${AgentAuditTable.Arn}/index/*'

  LeadQualifierFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${EnvironmentName}-realestateflow-lead-qualifier"
      Runtime: nodejs20.x
      Handler: scripts/lead-qualifier-handler.handler
      Role: !GetAtt LeadQualifierRole.Arn
      Timeout: 60
      MemorySize: 512
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      Environment:
        Variables:
          CRM_DYNAMODB_TABLE_NAME: !Ref CrmDynamoDbTableName
          CREDIT_CONFIG_TABLE_NAME: !Ref CreditConfigTableName
          CREDITS_TABLE_NAME: !Ref CreditsTableName
          AGENTS_ENABLED: !Ref AgentsEnabled
          AGENT_AUDIT_TABLE_NAME: !Ref AgentAuditTableName
          AGENT_ACTION_CREDITS: !Ref AgentActionCredits
          AGENT_TOOL_LOOP_ENABLED: !Ref AgentToolLoopEnabled
          AI_EMPLOYEE_PROVISIONING_TABLE: !Ref AiEmployeeProvisioningTableName
          AGENCY_CONFIG_DYNAMODB_TABLE_NAME: !Ref AgencyConfigTableName
          KNOWLEDGE_CHUNKS_DYNAMODB_TABLE_NAME: !Ref KnowledgeChunksTableName


  LeadQualifierRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${EnvironmentName}-realestateflow-lead-qualifier"
      EventPattern:
        source:
          - 'crm.leads'
        detail-type:
          - 'lead.created'
      State: ENABLED
      Targets:
        - Arn: !GetAtt LeadQualifierFunction.Arn
          Id: LeadQualifierTarget

  LeadQualifierPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LeadQualifierFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt LeadQualifierRule.Arn

  LeadRouterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-realestateflow-lead-router-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: LeadRouterPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:UpdateItem
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CrmDynamoDbTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CrmDynamoDbTableName}/*'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SubscriptionsTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SubscriptionsTableName}/*'
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-haiku-20240307-v1:0'
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt AgentAuditTable.Arn
                  - !Sub '${AgentAuditTable.Arn}/index/*'

  LeadRouterFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${EnvironmentName}-realestateflow-lead-router"
      Runtime: nodejs20.x
      Handler: scripts/lead-router-handler.handler
      Role: !GetAtt LeadRouterRole.Arn
      Timeout: 120
      MemorySize: 256
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      Environment:
        Variables:
          CRM_DYNAMODB_TABLE_NAME: !Ref CrmDynamoDbTableName
          SUBSCRIPTIONS_TABLE: !Ref SubscriptionsTableName
          CREDITS_TABLE_NAME: !Ref CreditsTableName
          CREDIT_CONFIG_TABLE_NAME: !Ref CreditConfigTableName
          USER_CATEGORIES_TABLE_NAME: !Ref UserCategoriesTableName
          AGENTS_ENABLED: !Ref AgentsEnabled
          AGENT_AUDIT_TABLE_NAME: !Ref AgentAuditTableName
          AGENT_ACTION_CREDITS: !Ref AgentActionCredits
          AGENT_TOOL_LOOP_ENABLED: !Ref AgentToolLoopEnabled
          AI_EMPLOYEE_PROVISIONING_TABLE: !Ref AiEmployeeProvisioningTableName
          AGENCY_CONFIG_DYNAMODB_TABLE_NAME: !Ref AgencyConfigTableName
          KNOWLEDGE_CHUNKS_DYNAMODB_TABLE_NAME: !Ref KnowledgeChunksTableName


  LeadRouterRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${EnvironmentName}-realestateflow-lead-router"
      Description: 'Trigger lead routing when a lead is qualified by the agent'
      EventPattern:
        source:
          - 'crm.leads'
        detail-type:
          - 'lead.qualified'
      State: ENABLED
      Targets:
        - Arn: !GetAtt LeadRouterFunction.Arn
          Id: LeadRouterTarget

  LeadRouterPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LeadRouterFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt LeadRouterRule.Arn

  LeadFollowupRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-realestateflow-lead-followup-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: LeadFollowupPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchGetItem
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CrmDynamoDbTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CrmDynamoDbTableName}/*'
              # Phase 2: Credits, agency config, and provisioning tables
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CreditsTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CreditsTableName}/*'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AgencyConfigTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AgencyConfigTableName}/*'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AiEmployeeProvisioningTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AiEmployeeProvisioningTableName}/*'
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource:
                  - !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${SesFromEmail}'
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-haiku-20240307-v1:0'
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt AgentAuditTable.Arn
                  - !Sub '${AgentAuditTable.Arn}/index/*'
              # Phase 2: CloudWatch metrics emission
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: '*'

  LeadFollowupFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${EnvironmentName}-realestateflow-lead-followup"
      Runtime: nodejs20.x
      Handler: scripts/lead-followup-cron.handler
      Role: !GetAtt LeadFollowupRole.Arn
      Timeout: 300
      MemorySize: 256
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      Environment:
        Variables:
          CRM_DYNAMODB_TABLE_NAME: !Ref CrmDynamoDbTableName
          AWS_SES_FROM_EMAIL: !Ref SesFromEmail
          EMAIL_PROVIDER_PRIMARY: !Ref EmailProviderPrimary
          CREDITS_TABLE_NAME: !Ref CreditsTableName
          CREDIT_CONFIG_TABLE_NAME: !Ref CreditConfigTableName
          BAILEY_ENABLED: !Ref BaileyEnabled
          BAILEY_MODE: !Ref BaileyMode
          BAILEY_API_KEY: !Ref BaileyApiKey
          BAILEY_API_ENDPOINT: !Ref BaileyApiEndpoint
          BAILEY_API_PREFIX: !Ref BaileyApiPrefix
          AGENTS_ENABLED: !Ref AgentsEnabled
          AGENT_AUDIT_TABLE_NAME: !Ref AgentAuditTableName
          AGENT_ACTION_CREDITS: !Ref AgentActionCredits
          AGENT_TOOL_LOOP_ENABLED: !Ref AgentToolLoopEnabled
          AI_EMPLOYEE_PROVISIONING_TABLE: !Ref AiEmployeeProvisioningTableName
          AI_EMPLOYEE_ROLLOUT_PERCENTAGE: !Ref AiEmployeeRolloutPercentage
          AGENCY_CONFIG_DYNAMODB_TABLE_NAME: !Ref AgencyConfigTableName
          KNOWLEDGE_CHUNKS_DYNAMODB_TABLE_NAME: !Ref KnowledgeChunksTableName
          # Phase 2: LLM & observability
          LLM_PROVIDER: !Ref LlmProvider
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          GEMINI_API_KEY: !Ref GeminiApiKey
          GEMINI_MODEL: !Ref GeminiModel
          CLOUDWATCH_METRICS_ENABLED: !Ref CloudwatchMetricsEnabled
          CLOUDWATCH_NAMESPACE: !Ref CloudWatchNamespace
          # Cap tool-result logging. The code default is 0 = uncapped ("fine
          # for dev"), but this var was never set in CFN, so production ran
          # uncapped and wrote whole CRM payloads to CloudWatch.
          TOOL_LOG_MAX_RESULT_CHARS: !Ref ToolLogMaxResultChars
          AI_ADMIN_WHATSAPP_NUMBERS: !Ref AiAdminWhatsAppNumbers


  LeadFollowupRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${EnvironmentName}-realestateflow-lead-followup"
      Description: 'Daily at 04:00 IST  send follow-up nudges for stale leads'
      ScheduleExpression: 'cron(30 22 * * ? *)'
      State: ENABLED
      Targets:
        - Arn: !GetAtt LeadFollowupFunction.Arn
          Id: LeadFollowupTarget

  LeadFollowupPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LeadFollowupFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt LeadFollowupRule.Arn

  # --------------------------------------------------------------------------
  # 5. MESSAGING  WhatsApp processing
  # --------------------------------------------------------------------------

  WhatsAppProcessorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-realestateflow-whatsapp-processor-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: WhatsAppProcessorPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchGetItem
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CrmDynamoDbTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CrmDynamoDbTableName}/*'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SubscriptionsTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SubscriptionsTableName}/*'
              # Phase 2: Credits, agency config, and provisioning tables
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CreditsTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CreditsTableName}/*'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AgencyConfigTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AgencyConfigTableName}/*'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AiEmployeeProvisioningTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AiEmployeeProvisioningTableName}/*'
              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource: '*'
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-haiku-20240307-v1:0'
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt AgentAuditTable.Arn
                  - !Sub '${AgentAuditTable.Arn}/index/*'
              # Phase 2: CloudWatch metrics emission
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: '*'

  WhatsAppProcessorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${EnvironmentName}-realestateflow-whatsapp-processor"
      Runtime: nodejs20.x
      Handler: scripts/whatsapp-message-processor.handler
      Role: !GetAtt WhatsAppProcessorRole.Arn
      Timeout: 120
      MemorySize: 256
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      Environment:
        Variables:
          CRM_DYNAMODB_TABLE_NAME: !Ref CrmDynamoDbTableName
          SUBSCRIPTIONS_TABLE: !Ref SubscriptionsTableName
          CREDITS_TABLE_NAME: !Ref CreditsTableName
          CREDIT_CONFIG_TABLE_NAME: !Ref CreditConfigTableName
          USER_CATEGORIES_TABLE_NAME: !Ref UserCategoriesTableName
          BAILEY_ENABLED: !Ref BaileyEnabled
          BAILEY_MODE: !Ref BaileyMode
          BAILEY_API_KEY: !Ref BaileyApiKey
          BAILEY_API_ENDPOINT: !Ref BaileyApiEndpoint
          BAILEY_API_PREFIX: !Ref BaileyApiPrefix
          AGENTS_ENABLED: !Ref AgentsEnabled
          AGENT_AUDIT_TABLE_NAME: !Ref AgentAuditTableName
          AGENT_ACTION_CREDITS: !Ref AgentActionCredits
          AGENT_TOOL_LOOP_ENABLED: !Ref AgentToolLoopEnabled
          AI_EMPLOYEE_PROVISIONING_TABLE: !Ref AiEmployeeProvisioningTableName
          AI_EMPLOYEE_ROLLOUT_PERCENTAGE: !Ref AiEmployeeRolloutPercentage
          AGENCY_CONFIG_DYNAMODB_TABLE_NAME: !Ref AgencyConfigTableName
          KNOWLEDGE_CHUNKS_DYNAMODB_TABLE_NAME: !Ref KnowledgeChunksTableName
          # Phase 2: LLM & observability
          LLM_PROVIDER: !Ref LlmProvider
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          GEMINI_API_KEY: !Ref GeminiApiKey
          GEMINI_MODEL: !Ref GeminiModel
          CLOUDWATCH_METRICS_ENABLED: !Ref CloudwatchMetricsEnabled
          CLOUDWATCH_NAMESPACE: !Ref CloudWatchNamespace
          # Cap tool-result logging. The code default is 0 = uncapped ("fine
          # for dev"), but this var was never set in CFN, so production ran
          # uncapped and wrote whole CRM payloads to CloudWatch.
          TOOL_LOG_MAX_RESULT_CHARS: !Ref ToolLogMaxResultChars
          AI_ADMIN_WHATSAPP_NUMBERS: !Ref AiAdminWhatsAppNumbers


  WhatsAppProcessorRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${EnvironmentName}-realestateflow-whatsapp-processor"
      Description: 'Process incoming WhatsApp messages from Bailey gateway'
      EventPattern:
        source:
          - 'whatsapp.incoming'
        detail-type:
          - 'message.received'
      State: ENABLED
      Targets:
        - Arn: !GetAtt WhatsAppProcessorFunction.Arn
          Id: WhatsAppProcessorTarget

  WhatsAppProcessorPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WhatsAppProcessorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt WhatsAppProcessorRule.Arn

  # ==========================================================================
  # OBSERVABILITY - alerting topic, alarms, dashboard
  #
  # Before this, the stack had ZERO CloudWatch alarms, ZERO dashboards and no
  # SNS topic: a Lambda could fail every invocation and nothing would page.
  # These alarm on AWS-native metrics (Lambda Errors/Throttles, SQS depth,
  # DynamoDB throttles) rather than the app's custom metrics, deliberately:
  # the custom metrics in server/observability/cloudwatch.js carry a TenantId
  # dimension, so an alarm on them would only ever watch ONE tenant. Those
  # belong on the dashboard (via SEARCH expressions), not on alarms.
  # ==========================================================================

  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${EnvironmentName}-realestateflow-alerts"
      DisplayName: RealEstateFlow Alerts

  AlertsTopicEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # -- WhatsApp processor: the user-facing critical path --------------------
  WhatsAppProcessorErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${EnvironmentName}-realestateflow-whatsapp-processor-errors"
      AlarmDescription: >-
        WhatsApp message processor is throwing. Users are sending messages and
        not getting replies. The processor rethrows after releasing its dedup
        claim, so these are retried -- sustained errors mean retries are also
        failing.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref WhatsAppProcessorFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  WhatsAppProcessorThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${EnvironmentName}-realestateflow-whatsapp-processor-throttles"
      AlarmDescription: WhatsApp processor is being throttled - inbound messages are queueing or dropping.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref WhatsAppProcessorFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  WhatsAppProcessorDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${EnvironmentName}-realestateflow-whatsapp-processor-slow"
      AlarmDescription: >-
        p95 processing time is approaching the Lambda timeout. Watch this when
        enabling AgentToolLoopEnabled - a multi-step turn is legitimately
        slower than a single-shot one, and the loop's own wall-clock budget
        (AGENT_TOOL_LOOP_BUDGET_MS, default 25s) must stay below this timeout.
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref WhatsAppProcessorFunction
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 2
      Threshold: 30000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  # -- Main API --------------------------------------------------------------
  ApiLambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${EnvironmentName}-realestateflow-api-lambda-errors"
      AlarmDescription: Main CRM API Lambda is erroring - the web app is degraded.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiLambdaFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  # -- Call recording pipeline -----------------------------------------------
  CallRecordingDlqDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${EnvironmentName}-realestateflow-call-recording-dlq-not-empty"
      AlarmDescription: >-
        A call recording failed all 5 delivery attempts and landed in the DLQ.
        Any non-zero depth means a customer's recording will never be
        transcribed unless someone intervenes.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt CallRecordingDlq.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  CallRecordingBacklogAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${EnvironmentName}-realestateflow-call-recording-backlog"
      AlarmDescription: Recordings are queueing faster than the worker drains them.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt CallRecordingQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1800
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  CallRecordingWorkerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${EnvironmentName}-realestateflow-call-recording-worker-errors"
      AlarmDescription: Call recording worker is erroring - transcription/analysis is failing.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref CallRecordingWorkerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  # -- Data layer ------------------------------------------------------------
  CrmTableThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${EnvironmentName}-realestateflow-crm-table-throttled"
      AlarmDescription: >-
        CrmTable requests are being throttled. Note this table is on-demand,
        so throttling usually means a hot partition or a burst past the
        table's adaptive capacity - often a full-table Scan (several search
        paths still Scan; see the TODO(MED-1) in crmDynamodbService.js).
      Namespace: AWS/DynamoDB
      MetricName: ThrottledRequests
      Dimensions:
        - Name: TableName
          Value: !Ref CrmDynamoDbTableName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  # -- Dashboard -------------------------------------------------------------
  OpsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${EnvironmentName}-realestateflow-ops"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "text", "x": 0, "y": 0, "width": 24, "height": 2,
              "properties": { "markdown": "# RealEstateFlow - ${EnvironmentName}\n**WhatsApp** is the primary channel. If `whatsapp-processor-errors` is firing, users are not getting replies. Agent metrics are per-tenant (SEARCH expressions below)." }
            },
            {
              "type": "metric", "x": 0, "y": 2, "width": 12, "height": 6,
              "properties": {
                "title": "WhatsApp processor - invocations / errors / throttles",
                "region": "${AWS::Region}",
                "metrics": [
                  [ "AWS/Lambda", "Invocations", "FunctionName", "${WhatsAppProcessorFunction}", { "stat": "Sum" } ],
                  [ ".", "Errors", ".", ".", { "stat": "Sum", "color": "#d62728" } ],
                  [ ".", "Throttles", ".", ".", { "stat": "Sum", "color": "#ff7f0e" } ]
                ],
                "view": "timeSeries", "stacked": false, "period": 300
              }
            },
            {
              "type": "metric", "x": 12, "y": 2, "width": 12, "height": 6,
              "properties": {
                "title": "WhatsApp processor - duration (p50/p95/max) vs timeout",
                "region": "${AWS::Region}",
                "metrics": [
                  [ "AWS/Lambda", "Duration", "FunctionName", "${WhatsAppProcessorFunction}", { "stat": "p50" } ],
                  [ "...", { "stat": "p95" } ],
                  [ "...", { "stat": "Maximum" } ]
                ],
                "view": "timeSeries", "period": 300,
                "annotations": { "horizontal": [ { "label": "alarm threshold 30s", "value": 30000 } ] }
              }
            },
            {
              "type": "metric", "x": 0, "y": 8, "width": 12, "height": 6,
              "properties": {
                "title": "Agent actions - invoked vs failed (all tenants)",
                "region": "${AWS::Region}",
                "metrics": [
                  [ { "expression": "SUM(SEARCH('{${CloudWatchNamespace},TenantId,Action} MetricName=\"agent.action.invoked\"', 'Sum', 300))", "label": "invoked", "id": "e1" } ],
                  [ { "expression": "SUM(SEARCH('{${CloudWatchNamespace},TenantId,Action} MetricName=\"agent.action.failed\"', 'Sum', 300))", "label": "failed", "id": "e2", "color": "#d62728" } ]
                ],
                "view": "timeSeries", "period": 300
              }
            },
            {
              "type": "metric", "x": 12, "y": 8, "width": 12, "height": 6,
              "properties": {
                "title": "Call recording pipeline - queue depth, DLQ, worker errors",
                "region": "${AWS::Region}",
                "metrics": [
                  [ "AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${CallRecordingQueue.QueueName}", { "stat": "Maximum", "label": "queue depth" } ],
                  [ ".", ".", ".", "${CallRecordingDlq.QueueName}", { "stat": "Maximum", "label": "DLQ depth", "color": "#d62728" } ],
                  [ "AWS/Lambda", "Errors", "FunctionName", "${CallRecordingWorkerFunction}", { "stat": "Sum", "label": "worker errors" } ]
                ],
                "view": "timeSeries", "period": 300
              }
            },
            {
              "type": "metric", "x": 0, "y": 14, "width": 12, "height": 6,
              "properties": {
                "title": "Main API Lambda - errors / duration",
                "region": "${AWS::Region}",
                "metrics": [
                  [ "AWS/Lambda", "Errors", "FunctionName", "${ApiLambdaFunction}", { "stat": "Sum", "color": "#d62728" } ],
                  [ ".", "Duration", ".", ".", { "stat": "p95", "yAxis": "right" } ]
                ],
                "view": "timeSeries", "period": 300
              }
            },
            {
              "type": "metric", "x": 12, "y": 14, "width": 12, "height": 6,
              "properties": {
                "title": "DynamoDB - CrmTable consumed capacity & throttles",
                "region": "${AWS::Region}",
                "metrics": [
                  [ "AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "${CrmDynamoDbTableName}", { "stat": "Sum" } ],
                  [ ".", "ConsumedWriteCapacityUnits", ".", ".", { "stat": "Sum" } ],
                  [ ".", "ThrottledRequests", ".", ".", { "stat": "Sum", "color": "#d62728" } ]
                ],
                "view": "timeSeries", "period": 300
              }
            },
            {
              "type": "metric", "x": 0, "y": 20, "width": 24, "height": 6,
              "properties": {
                "title": "Webhooks & credits - received / invalid signature / insufficient credits",
                "region": "${AWS::Region}",
                "metrics": [
                  [ { "expression": "SUM(SEARCH('{${CloudWatchNamespace},Provider} MetricName=\"webhook.received\"', 'Sum', 300))", "label": "webhooks received", "id": "w1" } ],
                  [ { "expression": "SUM(SEARCH('{${CloudWatchNamespace},Provider} MetricName=\"webhook.signature_invalid\"', 'Sum', 300))", "label": "invalid signature", "id": "w2", "color": "#d62728" } ],
                  [ { "expression": "SUM(SEARCH('{${CloudWatchNamespace},TenantId} MetricName=\"creditService.deductCredits.insufficient\"', 'Sum', 300))", "label": "insufficient credits", "id": "w3", "color": "#ff7f0e" } ]
                ],
                "view": "timeSeries", "period": 300
              }
            }
          ]
        }

Outputs:
  CallRecordingQueueUrlOutput:
    Description: SQS queue URL for the call recording pipeline (CALL_RECORDING_QUEUE_URL)
    Value: !Ref CallRecordingQueue
    Export:
      Name: !Sub "${AWS::StackName}-CallRecordingQueueUrl"

  CallRecordingDlqUrlOutput:
    Description: Dead-letter queue URL for call recording jobs
    Value: !Ref CallRecordingDlq
    Export:
      Name: !Sub "${AWS::StackName}-CallRecordingDlqUrl"

  CallRecordingWorkerFunctionOutput:
    Description: Call recording worker Lambda name (redeploy this together with the API Lambda)
    Value: !Ref CallRecordingWorkerFunction
    Export:
      Name: !Sub "${AWS::StackName}-CallRecordingWorkerFunction"

  DynamoDbTableNameOutput:
    Description: Core DynamoDB table name to use in the backend .env
    Value: !Ref DynamoDbTableName
    Export:
      Name: !Sub "${AWS::StackName}-DynamoDbTableName"

  DynamoDbTableArnOutput:
    Description: Core DynamoDB table ARN
    Value: !GetAtt PropertiesTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-DynamoDbTableArn"

  CrmDynamoDbTableNameOutput:
    Description: CRM DynamoDB table name to use in the backend .env (CRM_DYNAMODB_TABLE_NAME)
    Value: !Ref CrmDynamoDbTableName
    Export:
      Name: !Sub "${AWS::StackName}-CrmDynamoDbTableName"

  CrmDynamoDbTableArnOutput:
    Description: CRM DynamoDB table ARN
    Value: !GetAtt CrmTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-CrmDynamoDbTableArn"

  AgencyConfigTableNameOutput:
    Description: Agency config DynamoDB table name for storing per-agency admin settings
    Value: !Ref AgencyConfigTableName
    Export:
      Name: !Sub "${AWS::StackName}-AgencyConfigTableName"

  AgencyConfigTableArnOutput:
    Description: Agency config DynamoDB table ARN
    Value: !GetAtt AgencyConfigTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-AgencyConfigTableArn"

  SubscriptionsTableNameOutput:
    Description: Subscriptions DynamoDB table name (SUBSCRIPTIONS_TABLE)
    Value: !Ref SubscriptionsTableName
    Export:
      Name: !Sub "${AWS::StackName}-SubscriptionsTableName"

  SubscriptionsTableArnOutput:
    Description: Subscriptions DynamoDB table ARN
    Value: !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SubscriptionsTableName}'
    Export:
      Name: !Sub "${AWS::StackName}-SubscriptionsTableArn"

  UserCategoriesTableNameOutput:
    Description: User Categories DynamoDB table name (USER_CATEGORIES_TABLE_NAME)
    Value: !Ref UserCategoriesTableName
    Export:
      Name: !Sub "${AWS::StackName}-UserCategoriesTableName"

  UserCategoriesTableArnOutput:
    Description: User Categories DynamoDB table ARN
    Value: !GetAtt UserCategoriesTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-UserCategoriesTableArn"

  S3BucketNameOutput:
    Description: S3 bucket name to use in the backend .env
    Value: !Ref S3BucketName
    Export:
      Name: !Sub "${AWS::StackName}-S3BucketName"

  S3BucketArnOutput:
    Description: S3 bucket ARN
    Value: !GetAtt DocumentsBucket.Arn
    Export:
      Name: !Sub "${AWS::StackName}-S3BucketArn"

  EnquiriesTableNameOutput:
    Description: Enquiries DynamoDB table name to use in the backend .env (ENQUIRIES_DYNAMODB_TABLE_NAME)
    Value: !Ref EnquiriesTableNameCloudberry
    Export:
      Name: !Sub "${AWS::StackName}-EnquiriesTableCloudberry"

  ApiLambdaFunctionNameOutput:
    Description: Name of the Lambda function serving the HTTP APIs
    Value: !Ref ApiLambdaFunction
    Export:
      Name: !Sub "${AWS::StackName}-ApiLambdaFunctionName"

  PublicApiDomainOutput:
    Description: Custom domain name for the public website API
    Value: !Ref PublicApiDomainName
    Export:
      Name: !Sub "${AWS::StackName}-PublicApiDomainName"

  PublicApiBaseUrlOutput:
    Description: Base URL for the public website API (use as VITE_API_URL for the public UI)
    Value: !Sub "https://${PublicApiDomainName}/${PublicApiBasePath}"
    Export:
      Name: !Sub "${AWS::StackName}-PublicApiBaseUrl"

  CrmApiDomainOutput:
    Description: Custom domain name for the CRM web UI API
    Value: !Ref CrmApiDomainName
    Export:
      Name: !Sub "${AWS::StackName}-CrmApiDomainName"

  CrmApiBaseUrlOutput:
    Description: Base URL for the CRM web UI API (use as VITE_API_URL for the CRM app)
    Value: !Sub "https://${CrmApiDomainName}/${CrmApiBasePath}"
    Export:
      Name: !Sub "${AWS::StackName}-CrmApiBaseUrl"

  # Always work, regardless of EnableCustomDomainMapping - the *BaseUrlOutput
  # values above route nowhere until the custom domain is actually set up.
  PublicApiExecuteApiUrlOutput:
    Description: Public API's default invoke URL - works immediately, no custom domain required
    Value: !Sub "https://${RealEstatePublicRestApi}.execute-api.${AWS::Region}.amazonaws.com/${PublicApiStageName}"

  CrmApiExecuteApiUrlOutput:
    Description: CRM API's default invoke URL - works immediately, no custom domain required
    Value: !Sub "https://${RealEstateCrmRestApi}.execute-api.${AWS::Region}.amazonaws.com/${CrmApiStageName}"

  # Real Estate Management Tables Outputs
  DevelopersTableNameOutput:
    Description: Developers DynamoDB table name (DEVELOPERS_TABLE_NAME)
    Value: !Ref DevelopersTableName
    Export:
      Name: !Sub "${AWS::StackName}-DevelopersTableName"

  DevelopersTableArnOutput:
    Description: Developers DynamoDB table ARN
    Value: !GetAtt DevelopersTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-DevelopersTableArn"

  RealEstateAreasTableNameOutput:
    Description: Real Estate Areas/Communities DynamoDB table name (REAL_ESTATE_AREAS_TABLE_NAME)
    Value: !Ref RealEstateAreasTableName
    Export:
      Name: !Sub "${AWS::StackName}-RealEstateAreasTableName"

  RealEstateAreasTableArnOutput:
    Description: Real Estate Areas/Communities DynamoDB table ARN
    Value: !GetAtt RealEstateAreasTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-RealEstateAreasTableArn"

  ProjectsTableNameOutput:
    Description: Projects DynamoDB table name (PROJECTS_TABLE_NAME)
    Value: !Ref ProjectsTableName
    Export:
      Name: !Sub "${AWS::StackName}-ProjectsTableName"

  ProjectsTableArnOutput:
    Description: Projects DynamoDB table ARN
    Value: !GetAtt ProjectsTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ProjectsTableArn"

  # --- Cron Lambda Outputs ----------------------------------------------------
  CreditResetFunctionOutput:
    Description: Credit reset Lambda function name
    Value: !Ref CreditResetFunction
    Export:
      Name: !Sub "${AWS::StackName}-CreditResetFunction"

  TrialReminderFunctionOutput:
    Description: Trial reminder Lambda function name
    Value: !Ref TrialReminderFunction
    Export:
      Name: !Sub "${AWS::StackName}-TrialReminderFunction"

  IncompleteDataFunctionOutput:
    Description: Incomplete data quality Lambda function name
    Value: !Ref IncompleteDataFunction
    Export:
      Name: !Sub "${AWS::StackName}-IncompleteDataFunction"

