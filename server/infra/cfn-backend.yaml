  DocumentsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref S3BucketName
      VersioningConfiguration:
        Status: Suspended
      # This bucket holds call recordings, transcripts and analysis payloads -
      # customer conversations, names and phone numbers. SSE-S3 (AES-256) is
      # applied server-side on every write, including the browser's pre-signed
      # PUT, and needs no client change. BucketKeyEnabled is harmless under
      # SSE-S3 and avoids a re-write of this block if it ever moves to KMS.
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # Storage hygiene only - deliberately NO expiration rule. Call recordings
      # and property documents are customer records; nothing here deletes them.
      # Object keys are tenant-prefixed (`<tenantId>/call-recordings/...`), and
      # S3 prefix filters cannot wildcard a leading segment, so these rules are
      # bucket-wide by necessity. Each one is chosen to be safe at that scope.
      LifecycleConfiguration:
        Rules:
          # A browser that starts a pre-signed multipart upload and abandons it
          # leaves parts that are billed but invisible in the console.
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          # Versioning is Suspended, but any object versions written while it
          # was enabled are still billed forever. Also clears delete markers
          # left with no versions behind them.
          - Id: ExpireNoncurrentVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 30
          - Id: RemoveExpiredDeleteMarkers
            Status: Enabled
            ExpiredObjectDeleteMarker: true
          # Intelligent-Tiering, not STANDARD_IA: recordings go cold after the
          # transcript is written, but property images stay hot and IA would
          # add a per-GB retrieval charge to every page view. Intelligent
          # tiering has no retrieval fee and moves objects back on access.
          - Id: TierColdObjects
            Status: Enabled
            Transitions:
              - StorageClass: INTELLIGENT_TIERING
                TransitionInDays: 30
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - "*"
            AllowedMethods:
              - GET
              - HEAD
            AllowedHeaders:
              - "*"
            MaxAge: 3600
          # Browsers upload call recordings straight to S3 with a pre-signed
          # PUT, which requires PUT to be allowed and ETag to be readable.
          # Scoped to AllowedOrigins so a leaked pre-signed URL cannot be
          # replayed from an arbitrary origin.
          - AllowedOrigins: !If
              - HasAllowedOrigins
              - !Split [",", !Ref AllowedOrigins]
              - ["*"]
            AllowedMethods:
              - PUT
              - POST
            AllowedHeaders:
              - "*"
            ExposedHeaders:
              - ETag
            MaxAge: 3600
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  # Refuse any request that did not arrive over TLS. Pre-signed URLs are handed
  # to browsers and could in principle be replayed over plain HTTP, which would
  # put a recording's bytes on the wire in the clear. The bucket had no policy
  # before this, so nothing is being replaced here.
  DocumentsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DocumentsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt DocumentsBucket.Arn
              - !Sub "${DocumentsBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  # ============== Call Intelligence pipeline ==============

  CallRecordingDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${EnvironmentName}-realestateflow-call-recordings-dlq"
      MessageRetentionPeriod: 1209600 # 14 days
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  CallRecordingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${EnvironmentName}-realestateflow-call-recordings"
      # Must be >= the worker timeout, otherwise SQS redelivers a message that
      # is still being processed.
      VisibilityTimeout: !Ref CallIntelWorkerTimeout
      MessageRetentionPeriod: !Ref CallRecordingQueueRetentionSeconds
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt CallRecordingDlq.Arn
        maxReceiveCount: 5
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  ApiLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-realestateflow-api-lambda-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: RealEstateApiDynamoAndS3Access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchWriteItem
                  - dynamodb:DescribeTable
                  # New action for vector search — existing DynamoDB read
                  # permissions do NOT grant it. Without this, writes and Query
                  # keep working and only semantic search fails.
                  - dynamodb:SearchVectors
                Resource:
                  - !GetAtt PropertiesTable.Arn
                  - !GetAtt CrmTable.Arn
                  - !GetAtt AgencyConfigTable.Arn
                  - !GetAtt KnowledgeChunksTable.Arn
                  - !GetAtt AreasTableCloudberry.Arn
                  - !GetAtt EnquiriesTableCloudberry.Arn
                  - !GetAtt B2BLeadsTable.Arn
                  - !GetAtt KhataTable.Arn
                  - !GetAtt NotificationsTable.Arn
                  - !GetAtt PushTokensTable.Arn
                  - !GetAtt DevelopersTable.Arn
                  - !GetAtt RealEstateAreasTable.Arn
                  - !GetAtt ProjectsTable.Arn
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${GrievancesTableName}"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${NpsResponsesTableName}"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SubscriptionsTableName}"
                  - !GetAtt CreditsTable.Arn
                  - !GetAtt CreditConfigTable.Arn
                  - !GetAtt UserCategoriesTable.Arn
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${WebhookLogTableName}"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TenantApiKeysTableName}"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TenantApiKeysTableName}/index/*"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AiEmployeeProvisioningTableName}"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AiEmployeeProvisioningTableName}/*"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${OAuthCodesTableName}"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${OAuthCodesTableName}/index/*"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${OAuthConnectionsTableName}"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${OAuthConnectionsTableName}/index/*"
              - Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:Scan
                  # SearchVectors is granted on the TABLE arn above as well,
                  # but the call targets an index, and DynamoDB authorises
                  # index-targeted actions against the index arn - which is
                  # the whole reason this second statement exists for Query.
                  # Omitting it here fails only at the first live semantic
                  # search, long after the index is built and backfilled.
                  - dynamodb:SearchVectors
                Resource:
                  - !Sub "${PropertiesTable.Arn}/index/*"
                  - !Sub "${CrmTable.Arn}/index/*"
                  - !Sub "${AreasTableCloudberry.Arn}/index/*"
                  - !Sub "${EnquiriesTableCloudberry.Arn}/index/*"
                  - !Sub "${B2BLeadsTable.Arn}/index/*"
                  - !Sub "${KhataTable.Arn}/index/*"
                  - !Sub "${NotificationsTable.Arn}/index/*"
                  - !Sub "${PushTokensTable.Arn}/index/*"
                  - !Sub "${DevelopersTable.Arn}/index/*"
                  - !Sub "${RealEstateAreasTable.Arn}/index/*"
                  - !Sub "${ProjectsTable.Arn}/index/*"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${GrievancesTableName}/index/*"
                  - !Sub "${CreditsTable.Arn}/index/*"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${WebhookLogTableName}/index/*"
                  - !Sub "${UserCategoriesTable.Arn}/index/*"
                  - !Sub "${AgencyConfigTable.Arn}/index/*"
                  - !Sub "${KnowledgeChunksTable.Arn}/index/*"
              - Effect: Allow
                Action:
                  - dynamodb:TransactWriteItems
                Resource:
                  - !GetAtt CreditsTable.Arn
                  - !GetAtt CrmTable.Arn
              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource: '*'
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: '*'
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: '*'
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-haiku-20240307-v1:0'
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt AgentAuditTable.Arn
                  - !Sub '${AgentAuditTable.Arn}/index/*'
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource:
                  - !Sub "${DocumentsBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - sts:GetCallerIdentity
                Resource: "*"
              # Call Intelligence: queue jobs and consume them in the worker.
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:ChangeMessageVisibility
                Resource:
                  - !GetAtt CallRecordingQueue.Arn
                  - !GetAtt CallRecordingDlq.Arn
              # Amazon Transcribe batch jobs read the audio from, and write the
              # transcript back to, the documents bucket.
              - Effect: Allow
                Action:
                  - transcribe:StartTranscriptionJob
                  - transcribe:GetTranscriptionJob
                  - transcribe:ListTranscriptionJobs
                Resource: "*"
              # Runtime config: both Lambdas fetch their env vars from SSM at
              # cold start (config/ssmBootstrap.js) instead of carrying them
              # directly, to stay under Lambda's 4KB env var limit. Scoped to
              # this environment's own parameter namespace only.
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParametersByPath
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${EnvironmentName}/realestateflow/server/*"
              # SecureString parameters are encrypted under the account's
              # default SSM-managed KMS key (alias/aws/ssm) - this grants
              # decrypt only when the call is made via the SSM service
              # itself, not a general KMS grant.
              - Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: "*"
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"

  ApiLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${EnvironmentName}-realestateflow-api"
      Runtime: !Ref LambdaRuntime
      Handler: lambda-handler.handler
      Role: !GetAtt ApiLambdaExecutionRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      MemorySize: !Ref LambdaMemorySize
      Timeout: !Ref LambdaTimeout
      Environment:
        Variables:
          # Everything this Lambda used to get as a direct env var (~100
          # values: table names, API keys, feature flags) now lives in SSM
          # under this prefix instead, synced there by
          # cfn-templates-cicd/server/deploy.sh - see config/ssmBootstrap.js.
          # Kept here directly, not in SSM: NODE_ENV/LOG_LEVEL are needed
          # before hydration can even run (bootstrap itself logs), and this
          # is what tells the Lambda where to look.
          NODE_ENV: !Ref EnvironmentName
          LOG_LEVEL: !Ref LogLevel
          SSM_CONFIG_PATH: !Sub "/${EnvironmentName}/realestateflow/server/"
          # A CFN resource !Ref (the SQS queue's URL), not a Parameter - only
          # exists once CloudFormation creates the queue, so it can't be
          # pre-synced to SSM. Stays direct, same as before this migration.
          CALL_RECORDING_QUEUE_URL: !Ref CallRecordingQueue

  # ============== Call Intelligence worker ==============
  # Same deployment package as the API Lambda, different handler. It reuses
  # ApiLambdaExecutionRole so every CRM table/S3 permission the shared services
  # need is already granted.
  CallRecordingWorkerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${EnvironmentName}-realestateflow-call-recording-worker"
      Runtime: !Ref LambdaRuntime
      Handler: workers/callRecordingWorker.handler
      Role: !GetAtt ApiLambdaExecutionRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      MemorySize: !Ref CallIntelWorkerMemorySize
      Timeout: !Ref CallIntelWorkerTimeout
      Environment:
        Variables:
          # Same SSM-hydration design as ApiLambdaFunction above - see the
          # comment there. Same path prefix (both Lambdas share one config
          # namespace per environment).
          NODE_ENV: !Ref EnvironmentName
          LOG_LEVEL: !Ref LogLevel
          SSM_CONFIG_PATH: !Sub "/${EnvironmentName}/realestateflow/server/"
          # A CFN resource !Ref (the SQS queue's URL), not a Parameter - only
          # exists once CloudFormation creates the queue, so it can't be
          # pre-synced to SSM. Stays direct, same as before this migration.
          CALL_RECORDING_QUEUE_URL: !Ref CallRecordingQueue
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  CallRecordingWorkerEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt CallRecordingQueue.Arn
      FunctionName: !GetAtt CallRecordingWorkerFunction.Arn
      BatchSize: 5
      MaximumBatchingWindowInSeconds: 5
      # One bad message must not force redelivery of the whole batch.
      FunctionResponseTypes:
        - ReportBatchItemFailures

  RealEstatePublicRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "${EnvironmentName}-realestateflow-public-api"
      BinaryMediaTypes:
        - "*/*"
      EndpointConfiguration:
        Types:
          - REGIONAL

  PublicApiGatewayResponseDefault4XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref RealEstatePublicRestApi
      ResponseType: DEFAULT_4XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Requested-With,x-tenant-id'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS,PATCH'"

  PublicApiGatewayResponseDefault5XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref RealEstatePublicRestApi
      ResponseType: DEFAULT_5XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Requested-With,x-tenant-id'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS,PATCH'"

  PublicApiResourcesStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Ref ApiGatewayRoutesTemplateUrl
      Parameters:
        RestApiId: !Ref RealEstatePublicRestApi
        RootResourceId: !GetAtt RealEstatePublicRestApi.RootResourceId
        LambdaFunctionArn: !GetAtt ApiLambdaFunction.Arn
        AllowOrigin: "*"
        AllowHeaders: "Content-Type,Authorization,X-Requested-With,x-tenant-id"
        AllowMethods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"

  PublicApiResourcesStackPart2:
    Type: AWS::CloudFormation::Stack
    Condition: ShouldDeployApiRoutePart2
    DependsOn:
      - PublicApiResourcesStack
    Properties:
      TemplateURL: !Ref ApiGatewayRoutesTemplateUrlPart2
      Parameters:
        RestApiId: !Ref RealEstatePublicRestApi
        RootResourceId: !GetAtt RealEstatePublicRestApi.RootResourceId
        LambdaFunctionArn: !GetAtt ApiLambdaFunction.Arn
        AllowOrigin: "*"
        AllowHeaders: "Content-Type,Authorization,X-Requested-With,x-tenant-id"
        AllowMethods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
        ApiResourceId: !GetAtt PublicApiResourcesStack.Outputs.ApiResourceId
        CrmContactResourceId: !GetAtt PublicApiResourcesStack.Outputs.CrmContactResourceId
        CrmResourceId: !GetAtt PublicApiResourcesStack.Outputs.CrmResourceId

  PublicApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - PublicApiResourcesStack
    Properties:
      RestApiId: !Ref RealEstatePublicRestApi
      StageName: !Ref PublicApiStageName

  PublicApiBasePathMapping:
    Type: AWS::ApiGateway::BasePathMapping
    Condition: CustomDomainMappingEnabled
    DependsOn:
      - PublicApiDeployment
    Properties:
      DomainName: !Ref PublicApiDomainName
      RestApiId: !Ref RealEstatePublicRestApi
      Stage: !Ref PublicApiStageName
      BasePath: !Ref PublicApiBasePath

  PublicApiLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiLambdaFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RealEstatePublicRestApi}/*/*/*"

  RealEstateCrmRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "${EnvironmentName}-realestateflow-crm-api"
      BinaryMediaTypes:
        - "*/*"
      EndpointConfiguration:
        Types:
          - REGIONAL

  CrmApiGatewayResponseDefault4XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref RealEstateCrmRestApi
      ResponseType: DEFAULT_4XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Requested-With,x-tenant-id'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS,PATCH'"

  CrmApiGatewayResponseDefault5XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref RealEstateCrmRestApi
      ResponseType: DEFAULT_5XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Requested-With,x-tenant-id'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS,PATCH'"

  CrmApiGatewayResponseRequestTooLarge:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref RealEstateCrmRestApi
      ResponseType: REQUEST_TOO_LARGE
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Requested-With,x-tenant-id'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS,PATCH'"

  CrmApiResourcesStackV2:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Ref ApiGatewayRoutesTemplateUrl
      Parameters:
        RestApiId: !Ref RealEstateCrmRestApi
        RootResourceId: !GetAtt RealEstateCrmRestApi.RootResourceId
        LambdaFunctionArn: !GetAtt ApiLambdaFunction.Arn
        AllowOrigin: "*"
        AllowHeaders: "Content-Type,Authorization,X-Requested-With,x-tenant-id"
        AllowMethods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"

  CrmApiResourcesStackPart2:
    Type: AWS::CloudFormation::Stack
    Condition: ShouldDeployApiRoutePart2
    DependsOn:
      - CrmApiResourcesStackV2
    Properties:
      TemplateURL: !Ref ApiGatewayRoutesTemplateUrlPart2
      Parameters:
        RestApiId: !Ref RealEstateCrmRestApi
        RootResourceId: !GetAtt RealEstateCrmRestApi.RootResourceId
        LambdaFunctionArn: !GetAtt ApiLambdaFunction.Arn
        AllowOrigin: "*"
        AllowHeaders: "Content-Type,Authorization,X-Requested-With,x-tenant-id"
        AllowMethods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
        ApiResourceId: !GetAtt CrmApiResourcesStackV2.Outputs.ApiResourceId
        CrmContactResourceId: !GetAtt CrmApiResourcesStackV2.Outputs.CrmContactResourceId
        CrmResourceId: !GetAtt CrmApiResourcesStackV2.Outputs.CrmResourceId

  CrmApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - CrmApiResourcesStackV2
    Properties:
      RestApiId: !Ref RealEstateCrmRestApi
      StageName: !Ref CrmApiStageName

  CrmApiBasePathMapping:
    Type: AWS::ApiGateway::BasePathMapping
    Condition: CustomDomainMappingEnabled
    DependsOn:
      - CrmApiDeployment
    Properties:
      DomainName: !Ref CrmApiDomainName
      RestApiId: !Ref RealEstateCrmRestApi
      Stage: !Ref CrmApiStageName
      BasePath: !Ref CrmApiBasePath

  CrmApiLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiLambdaFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RealEstateCrmRestApi}/*/*/*"

  # ========================================================================
  # CRON JOBS & SCHEDULED LAMBDAS  Organized by function type
  # ========================================================================

  # --------------------------------------------------------------------------
  # 1. BILLING & CREDITS  Daily resets, subscription management
  # --------------------------------------------------------------------------

  CreditResetRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-realestateflow-credit-reset-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CreditResetPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SubscriptionsTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CreditsTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CreditConfigTableName}'

  CreditResetFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${EnvironmentName}-realestateflow-credit-reset"
      Runtime: nodejs20.x
      Handler: scripts/credit-reset-cron.handler
      Timeout: 300
      MemorySize: 256
      Role: !GetAtt CreditResetRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      Environment:
        Variables:
          SUBSCRIPTIONS_TABLE: !Ref SubscriptionsTableName
          CREDITS_TABLE_NAME: !Ref CreditsTableName
          CREDIT_CONFIG_TABLE_NAME: !Ref CreditConfigTableName


  CreditResetRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${EnvironmentName}-realestateflow-credit-reset"
      Description: 'Trigger credit reset Lambda daily at 00:30 IST (18:30 UTC)'
      ScheduleExpression: 'cron(30 18 * * ? *)'
      State: ENABLED
      Targets:
        - Arn: !GetAtt CreditResetFunction.Arn
          Id: CreditResetTarget

  CreditResetPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CreditResetFunction
      Action: 'lambda:InvokeFunction'
      Principal: 'events.amazonaws.com'
      SourceArn: !GetAtt CreditResetRule.Arn

  TrialReminderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-realestateflow-trial-reminder-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: TrialReminderPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SubscriptionsTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SubscriptionsTableName}/*'
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource:
                  - !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${SesFromEmail}'

  TrialReminderFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${EnvironmentName}-realestateflow-trial-reminder"
      Runtime: nodejs20.x
      Handler: scripts/trial-reminder-cron.handler
      Role: !GetAtt TrialReminderRole.Arn
      Timeout: 60
      MemorySize: 128
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      Environment:
        Variables:
          SUBSCRIPTIONS_TABLE: !Ref SubscriptionsTableName
          BREVO_API_KEY: !Ref BrevoApiKey
          AWS_SES_FROM_EMAIL: !Ref SesFromEmail
          EMAIL_PROVIDER_PRIMARY: !Ref EmailProviderPrimary


  TrialReminderRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${EnvironmentName}-realestateflow-trial-reminder"
      Description: 'Trigger trial reminder Lambda daily at 09:00 IST (03:30 UTC)'
      ScheduleExpression: 'cron(30 3 * * ? *)'
      State: ENABLED
      Targets:
        - Arn: !GetAtt TrialReminderFunction.Arn
          Id: TrialReminderTarget

  TrialReminderPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TrialReminderFunction
      Action: 'lambda:InvokeFunction'
      Principal: 'events.amazonaws.com'
      SourceArn: !GetAtt TrialReminderRule.Arn

  # --------------------------------------------------------------------------
  # 2. DATA QUALITY & ALERTS  Incomplete data, expiring agreements, team summary
  # --------------------------------------------------------------------------

  IncompleteDataRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-realestateflow-incomplete-data-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: IncompleteDataPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CrmDynamoDbTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SubscriptionsTableName}'
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource:
                  - !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${SesFromEmail}'

  IncompleteDataFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${EnvironmentName}-realestateflow-incomplete-data"
      Runtime: nodejs20.x
      Handler: scripts/incomplete-data-cron.handler
      Timeout: 300
      MemorySize: 256
      Role: !GetAtt IncompleteDataRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      Environment:
        Variables:
          CRM_TABLE_NAME: !Ref CrmDynamoDbTableName
          SUBSCRIPTIONS_TABLE: !Ref SubscriptionsTableName
          AUTH_SERVICE_URL: !Ref AuthServiceUrl
          BAILEY_ENABLED: !Ref BaileyEnabled
          BAILEY_MODE: !Ref BaileyMode
          BAILEY_API_KEY: !Ref BaileyApiKey
          BREVO_API_KEY: !Ref BrevoApiKey
