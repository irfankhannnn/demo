AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Real Estate Agency - Core AWS resources
  (core properties table, multi-tenant CRM table, agency config table, S3 bucket).

  NOTE: This template references OAuth tables (OAuthCodesTableName and
  OAuthConnectionsTableName) that are created by the reality-flow-mcp stack.
  Deploy the MCP stack first or ensure those tables already exist before
  deploying this stack; otherwise the CRM Lambda will fail at runtime when
  accessing them.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues: ['dev', 'prod']
    Description: >-
      Deployment environment. Drives the realestateflow-<EnvironmentName>-*
      naming of every physical resource this stack creates (Lambda functions,
      IAM roles, the REST APIs, the SQS queue/DLQ, the SNS topic, the
      dashboard, cron rules and alarms), so dev and prod never collide on a
      shared AWS-account-global name.

  DynamoDbTableName:
    Type: String
    Default: dev-realestateflow-core
    Description: Name of the core DynamoDB table used by the application

  CrmDynamoDbTableName:
    Type: String
    Default: dev-realestateflow-crm
    Description: Name of the DynamoDB table used by the multi-tenant CRM

  AgencyConfigTableName:
    Type: String
    Default: dev-realestateflow-agencies
    Description: Name of the DynamoDB table storing per-agency admin configuration

  KnowledgeChunksTableName:
    Type: String
    Default: dev-realestateflow-knowledge-chunks
    Description: >-
      Name of the DynamoDB table storing embedded chunks of each agency's policy
      documents. Derived data, regenerable from the policies held on the agency
      record; kept apart from the CRM table so that a change to the policy
      vector index cannot force a rebuild of the property one.

  AreasTableName:
    Type: String
    Default: dev-realestateflow-areas
    Description: Name of the DynamoDB table storing area information with banners

  EnquiriesTableNameCloudberry:
    Type: String
    Default: dev-realestateflow-enquiries
    Description: Name of the DynamoDB table storing contact and consultation enquiries

  B2BLeadsTableName:
    Type: String
    Default: dev-realestateflow-b2b-details
    Description: Name of the DynamoDB table storing B2B sales leads (Ten BKC channel partnership inquiries)

  KhataTableName:
    Type: String
    Default: dev-realestateflow-khata
    Description: Name of the DynamoDB table storing Khata Book transactions and categories

  NotificationsTableName:
    Type: String
    Default: dev-realestateflow-notifications
    Description: Name of the DynamoDB table storing in-app notifications and scheduled reminders

  PushTokensTableName:
    Type: String
    Default: dev-realestateflow-push-tokens
    Description: Name of the DynamoDB table storing mobile device push tokens (FCM/APNs)

  FirebaseServiceAccountJson:
    Type: String
    NoEcho: true
    Default: ''
    Description: >-
      Firebase service-account key as a single-line JSON string, used to send
      push via FCM HTTP v1. Leave empty to disable push entirely - the API
      still accepts and stores device tokens, it just sends nothing.

  DevelopersTableName:
    Type: String
    Default: dev-realestateflow-developers
    Description: Name of the DynamoDB table storing real estate developer profiles (Emaar, Sobha, Lodha, etc.)

  RealEstateAreasTableName:
    Type: String
    Default: dev-realestateflow-communities
    Description: Name of the DynamoDB table storing area/community profiles (DIFC, Dubai Marina, Andheri, etc.)


  ProjectsTableName:
    Type: String
    Default: dev-realestateflow-projects
    Description: Name of the DynamoDB table storing real estate projects

  GrievancesTableName:
    Type: String
    Default: dev-realestateflow-grievances
    Description: >-
      Name of the DynamoDB table storing DPDP Act 2023 grievances. Must match
      the table launch-tables-cfn.yaml creates for the same EnvironmentName -
      this stack only references it, it does not own it, and deploy.sh does
      not currently override this parameter from cfn-params.json.

  NpsResponsesTableName:
    Type: String
    Default: dev-realestateflow-nps-responses
    Description: >-
      Name of the DynamoDB table storing Net Promoter Score responses. Must
      match the table launch-tables-cfn.yaml creates for the same
      EnvironmentName (see GrievancesTableName note).

  SubscriptionsTableName:
    Type: String
    Default: dev-realestateflow-subscriptions
    Description: >-
      Name of the DynamoDB table storing tenant subscription plans and seat
      limits. Must match the table launch-tables-cfn.yaml creates for the
      same EnvironmentName (see GrievancesTableName note).

  WebhookLogTableName:
    Type: String
    Default: dev-realestateflow-webhook-log
    Description: >-
      Name of the DynamoDB table storing inbound webhook idempotency records.
      Must match the table launch-tables-cfn.yaml creates for the same
      EnvironmentName (see GrievancesTableName note).

  TenantApiKeysTableName:
    Type: String
    Default: dev-realestateflow-tenant-api-keys
    Description: >-
      Name of the DynamoDB table storing per-tenant API keys. Must match the
      table launch-tables-cfn.yaml creates for the same EnvironmentName (see
      GrievancesTableName note).

  CreditsTableName:
    Type: String
    Default: dev-realestateflow-credits
    Description: DynamoDB table for tenant credit balances and ledger

  CreditConfigTableName:
    Type: String
    Default: dev-realestateflow-credit-config
    Description: DynamoDB table for owner-editable credit configuration

  UserCategoriesTableName:
    Type: String
    Default: dev-realestateflow-user-categories
    Description: DynamoDB table for WhatsApp user category assignments

  SesFromEmail:
    Type: String
    Default: info@realestateflow.in

  EmailProviderPrimary:
    Type: String
    Default: ses

  BaileyEnabled:
    Type: String
    Default: 'false'

  BaileyApiKey:
    Type: String
    NoEcho: true
    Default: ''

  BaileyMode:
    Type: String
    Default: 'hosted'
    AllowedValues: ['hosted', 'selfhosted']
    Description: Bailey mode - hosted (api.bailey.ai) or selfhosted (own Baileys service)

  BaileyWebhookSecret:
    Type: String
    NoEcho: true
    Default: ''

  AgentsEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable AI Employee agents globally

  AlertEmail:
    Type: String
    Default: ''
    Description: >-
      Email address to subscribe to the alerts SNS topic. Leave empty to create
      the topic with no subscribers (alarms still fire and are visible in the
      console, but nobody is notified). AWS sends a confirmation email that
      must be accepted before alerts arrive.

  ToolLogMaxResultChars:
    Type: String
    Default: '2000'
    Description: >-
      Max characters of a CRM tool result written to CloudWatch. 0 means
      uncapped - do not use 0 in a deployed environment; tool results contain
      customer records.

  CloudWatchNamespace:
    Type: String
    Default: 'RealEstateFlow/MVP'
    Description: >-
      Custom metric namespace. MUST match the fallback in
      server/observability/cloudwatch.js, otherwise the dashboard's SEARCH
      expressions silently find nothing.

  AgentToolLoopEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      Phase 3 bounded multi-step tool loop. 'false' keeps the original
      single-shot planner (one tool call per turn). 'true' lets one turn
      complete a compound request ("create a lead AND schedule a visit").
      Both code paths ship; this only selects between them, so it is safe to
      flip back. See docs/proposals/agent-channel-architecture/phase3-imp/.

  AllowUserCategoryDefaultFallback:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >
      SECURITY: only enable in dev. If true, unknown users fall back to the
      default user category when checking AI tool permissions. Production must
      keep this false and explicitly provision user categories.

  AgentWebToolLoopBudgetMs:
    Type: Number
    Default: 18000
    MinValue: 5000
    Description: >-
      Tool-loop budget for an in-CRM web chat turn (Phase 5). Must leave room
      inside LambdaTimeout (default 30s) for classify and compose on top, or a
      long multi-step turn is killed by the platform and returns nothing at
      all. Raise this only alongside LambdaTimeout, or after moving the
      /api/crm/agent-chat route to its own longer-timeout Lambda.

  WhatsAppFallbackCategory:
    Type: String
    Default: 'admin'
    AllowedValues: ['admin', 'team_lead', 'agent', 'viewer', 'whatsapp_bot']
    Description: >
      RBAC category applied to a WhatsApp turn when the sender's principal
      (wa:<phone>) has no provisioned CATEGORY#USER row, which is every tenant
      today. 'admin' reproduces the pre-existing behaviour exactly - the
      permission check used to be skipped altogether on this channel. Set
      'whatsapp_bot' for a genuinely restricted bot on a shared number, but
      note it forbids property and buyer writes and so is NOT compatible with
      the WhatsApp-first flow as currently specified.

  BaileyApiEndpoint:
    Type: String
    Default: 'https://api.bailey.ai'
    Description: Bailey WhatsApp gateway API base URL

  BaileyApiPrefix:
    Type: String
    Default: ''
    Description: Optional API path prefix for Bailey service (defaults to '/v1' for hosted, '' for selfhosted)

  S3BucketName:
    Type: String
    Description: S3 bucket name for documents (must be globally unique)
    MinLength: 3
    MaxLength: 63
    AllowedPattern: "^[a-z0-9][a-z0-9.-]*[a-z0-9]$"
    ConstraintDescription: >
      Bucket name must be lowercase, 363 characters, and can contain
      letters, numbers, dots, and hyphens.

  LambdaCodeS3Bucket:
    Type: String
    Description: S3 bucket that stores the packaged Lambda zip (deployment artifact)

  LambdaCodeS3Key:
    Type: String
    Description: S3 object key for the packaged Lambda zip

  LambdaRuntime:
    Type: String
    Default: nodejs20.x
    AllowedValues:
      - nodejs18.x
      - nodejs20.x
    Description: Lambda runtime for the backend function

  LambdaMemorySize:
    Type: Number
    Default: 512
    Description: Lambda memory size in MB

  LambdaTimeout:
    Type: Number
    Default: 30
    Description: Lambda timeout in seconds

  PublicApiDomainName:
    Type: String
    Description: Custom domain name for the public website API (e.g. api.example.com)

  PublicApiBasePath:
    Type: String
    Default: api
    Description: Base path for the public API mapping on the custom domain

  PublicApiStageName:
    Type: String
    Default: prod
    Description: Stage name for the public API Gateway

  CrmApiDomainName:
    Type: String
    Description: Custom domain name for the CRM web UI API (e.g. crm-api.example.com)

  CrmApiBasePath:
    Type: String
    Default: api
    Description: Base path for the CRM API mapping on the custom domain

  CrmApiStageName:
    Type: String
    Default: prod
    Description: Stage name for the CRM API Gateway

  EnableCustomDomainMapping:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >-
      Set to 'false' on a first deploy to a new account/region before the
      AWS::ApiGateway::DomainName for PublicApiDomainName/CrmApiDomainName
      has been created (this template doesn't manage that resource - it's
      set up once, separately, e.g. via ACM cert + Route53). With it false,
      BasePathMapping is skipped and the API is still reachable via its
      default execute-api invoke URL (see the *ExecuteApiUrl outputs).
      Flip to 'true' and redeploy once the custom domain exists.

  EnableBasePathStrip:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >
      Set to 'true' when the custom domain URL includes the API base path
      (e.g., /devrealestatecrm/api/...). The Lambda handler will strip that
      base path so Express routes (mounted at /api/...) match correctly.

  AuthServiceUrl:
    Type: String
    Description: URL of the authentication microservice for token validation (e.g., https://auth-api.example.com)

  AllowedOrigins:
    Type: String
    Default: ''
    Description: Comma-separated list of allowed CORS origins (never use '*' in production)

  ApiGatewayRoutesTemplateUrl:
    Type: String
    Description: S3 URL for nested template part 1 (explicit API Gateway routes)

  ApiGatewayRoutesTemplateUrlPart2:
    Type: String
    Description: S3 URL for nested template part 2 (remaining explicit API Gateway routes)

  DeployApiRoutePart2:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Set to false only while migrating the existing explicit routes into split nested stacks.

  NpsHmacSecret:
    Type: String
    Default: ''
    Description: HMAC secret for NPS score token verification (feedback module)
    NoEcho: true

  BrevoApiKey:
    Type: String
    Default: ''
    Description: Brevo (Sendinblue) API key for transactional emails
    NoEcho: true

  RazorpayWebhookSecret:
    Type: String
    Default: ''
    Description: Razorpay webhook secret for signature verification
    NoEcho: true

  RazorpayKeyId:
    Type: String
    Default: ''
    Description: Razorpay API Key ID (from Dashboard  Settings  API Keys)
    NoEcho: true

  RazorpayKeySecret:
    Type: String
    Default: ''
    Description: Razorpay API Key Secret (from Dashboard  Settings  API Keys)
    NoEcho: true

  BrevoFromEmail:
    Type: String
    Default: 'info@realestateflow.in'
    Description: Sender email address for Brevo transactional emails

  BrevoFromName:
    Type: String
    Default: 'RealEstateFlow'
    Description: Sender display name for Brevo transactional emails

  HcaptchaSecretKey:
    Type: String
    Default: ''
    Description: hCaptcha secret key for grievance form verification
    NoEcho: true

  # --- Cron-specific parameters ----------------------------------------------
  PostHogKeyServer:
    Type: String
    Default: ''
    Description: PostHog server-side key for cron analytics events
    NoEcho: true

  PostHogHost:
    Type: String
    Default: 'https://eu.i.posthog.com'
    Description: PostHog host URL

  InternalApiKey:
    Type: String
    Default: ''
    Description: Internal API key for auth service access (team member lookup)
    NoEcho: true

  AiCallingInternalApiKey:
    Type: String
    Default: ''
    Description: Shared secret ai-calling-service must present (x-api-key) to call /api/internal/* routes (Lead Temperature qualification calls)
    NoEcho: true

  AdapterInternalApiKey:
    Type: String
    Default: ''
    Description: Shared secret lead-source adapters must present (x-api-key) to call POST /api/internal/adapters/leads. Used by backend_insta_sol_ms to promote Instagram enquiries into CRM leads. Deliberately separate from AiCallingInternalApiKey so one service's compromise does not grant the other's access.
    NoEcho: true

  PublicPagesInternalApiKey:
    Type: String
    Default: ''
    Description: Shared secret the public property-pages microservice must present (x-api-key) to call /api/internal/public-pages/*. Its own key, separate from AdapterInternalApiKey, so compromising the internet-facing pages service does not also grant lead-ingestion access.
    NoEcho: true

  AiCallingServiceUrl:
    Type: String
    Default: ''
    Description: Base URL of the ai-calling-service stack, used by POST /leads/:id/qualify-call to trigger on-demand qualification calls

  CrmCallerApiKey:
    Type: String
    Default: ''
    Description: Shared secret this backend presents (x-api-key) when calling ai-calling-service's /api/ai-calling/* management routes. That service authenticates this backend as a service and then trusts the x-tenant-id we send, making this a tenant-crossing credential - server-side only. Must equal CrmCallerApiKey in the ai-calling-service stack. Deliberately separate from AiCallingInternalApiKey, which is the inbound direction.
    NoEcho: true

  FounderWhatsApp:
    Type: String
    Default: ''
    Description: Founder WhatsApp number for escalation notifications
    NoEcho: true

  AgentAuditTableName:
    Type: String
    Default: dev-realestateflow-agent-audit
    Description: DynamoDB table for AI Employee agent audit logs

  JwtSecret:
    Type: String
    NoEcho: true
    Default: ''
    Description: JWT secret for signing MCP service tokens

  AgentActionCredits:
    Type: String
    Default: '15'
    Description: Number of credits charged per agent action

  AiEmployeeRolloutPercentage:
    Type: String
    Default: '100'
    Description: Percentage of tenants for gradual rollout (0-100)

  AiEmployeeProvisioningTableName:
    Type: String
    Default: dev-realestateflow-ai-employee-provisioning
    Description: >-
      DynamoDB table for AI Employee provisioning rows. This stack owns and
      creates the table (see AiEmployeeProvisioningTable below) - do not
      also declare it in launch-tables-cfn.yaml, or a second stack will fail
      with "Table already exists" on whichever deploys second.

  # -- Phase 2: AI Employee LLM & Observability ---------------------------------
  LlmProvider:
    Type: String
    Default: bedrock
    AllowedValues:
      - bedrock
      - gemini
    Description: LLM provider for AI agent invocations (bedrock | gemini)

  BedrockModelId:
    Type: String
    Default: anthropic.claude-3-haiku-20240307-v1:0
    Description: Bedrock model ID for AI agent invocations

  GeminiApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: Google Gemini API key (required only if LlmProvider=gemini)

  GeminiModel:
    Type: String
    Default: gemini-2.5-flash
    Description: Gemini model name (used only if LlmProvider=gemini)

  GeminiClassifierModel:
    Type: String
    Default: gemini-2.5-flash
    Description: Gemini classifier model name (used for lead classification)

  CloudwatchMetricsEnabled:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Enable Phase 2 CloudWatch custom metrics emission

  AiAdminWhatsAppNumbers:
    Type: String
    Default: ''
    Description: Comma-separated admin WhatsApp numbers allowed to trigger the AI

  # --- Externalized operational constants (no hardcoded fallbacks) ----------------

  ServiceAccountUser:
    Type: String
    Default: 'system'
    Description: Service account identifier for automated/system writes

  DefaultCountryCode:
    Type: String
    Default: '+91'
    Description: Default country code for phone normalization (e.g. +91, +971)

  AppUrl:
    Type: String
    Default: 'https://app.realestateflow.in'
    Description: Public app URL used in emails and reminders

  GrievanceOfficerEmail:
    Type: String
    Default: 'info@realestateflow.in'
    Description: DPDP Act 2023 grievance officer email address

  LogLevel:
    Type: String
    Default: 'info'
    Description: Application log level

  McpBaseUrl:
    Type: String
    Default: 'https://mcp.realtyflow.com'
    Description: MCP service base URL for OAuth redirects

  OAuthCodesTableName:
    Type: String
    Default: 'realestate-flow-dev-oauth-codes'
    Description: >-
      DynamoDB table for OAuth authorization codes and sessions. Owned by
      the reality-flow-mcp stack, not this one - must match the table that
      stack actually created (its own naming convention predates this
      prefix change, so it does NOT use realestateflow-*). Deploy MCP first
      and confirm the live table name before deploying this stack.

  OAuthConnectionsTableName:
    Type: String
    Default: 'realestate-flow-dev-oauth-connections'
    Description: >-
      DynamoDB table for connected AI app integrations. Owned by the
      reality-flow-mcp stack (see OAuthCodesTableName note).

  OAuthCallbackUrl:
    Type: String
    Default: 'https://services-api.cloudberrysolutions.in/devrealestatecrm/api/ai-integrations/callback'
    Description: Public OAuth callback URL for the CRM backend (where MCP redirects after approval)

  FrontendUrl:
    Type: String
    Default: 'http://localhost:3000'
    Description: Frontend URL for post-OAuth redirect

  RazorpayPlanAiEmployee:
    Type: String
    Default: 'plan_test_ai_employee'
    Description: Razorpay plan ID for AI employee subscription

  FounderEmail:
    Type: String
    Default: 'info@realestateflow.in'
    Description: Founder email address

  BrevoTrialListId:
    Type: String
    Default: ''
    Description: Brevo trial list ID

  BrevoPaymentFailedTemplateId:
    Type: String
    Default: ''
    Description: Brevo payment failed template ID

  BrevoAiEmployeePaidTemplateId:
    Type: String
    Default: ''
    Description: Brevo AI employee paid template ID

  BrevoAiEmployeeEscalatedFounderTemplateId:
    Type: String
    Default: ''
    Description: Brevo AI employee escalated founder template ID

  BrevoAiEmployeeEscalatedCustomerTemplateId:
    Type: String
    Default: ''
    Description: Brevo AI employee escalated customer template ID

  BaileyAdminApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: Bailey admin API key for destructive operations

  # ============== Call Intelligence (call recording analysis) ==============
  AsrProvider:
    Type: String
    Default: amazon-transcribe
    AllowedValues:
      - amazon-transcribe
      - whisper
    Description: Speech-to-text provider used by the call recording pipeline

  TranscribeLanguageOptions:
    Type: String
    Default: en-IN,hi-IN,mr-IN,gu-IN,ta-IN,te-IN,kn-IN,ml-IN,pa-IN,bn-IN
    Description: Languages offered to Amazon Transcribe automatic language identification

  TranscribeLanguageCode:
    Type: String
    Default: ''
    Description: >
      Fixed Amazon Transcribe language code (e.g. en-IN). Leave empty to use
      automatic multi-language identification. Required when using a custom vocabulary.

  TranscribeVocabularyName:
    Type: String
    Default: ''
    Description: >
      Optional Amazon Transcribe custom vocabulary name for Indian real-estate terms.
      Create it out-of-band; an unknown name makes every transcription job fail.

  CallIntelAutoApplyNotes:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Apply the AI call-summary note automatically (every other action always needs approval)

  CallIntelWorkerMemorySize:
    Type: Number
    Default: 1024
    Description: Memory (MB) for the call recording worker Lambda

  CallIntelWorkerTimeout:
    Type: Number
    Default: 300
    Description: Timeout (seconds) for the call recording worker Lambda

  CallIntelPollDelaySeconds:
    Type: Number
    Default: 45
    Description: Delay between Amazon Transcribe job status polls

  CallIntelMaxPollAttempts:
    Type: Number
    Default: 60
    Description: Maximum transcription status polls before a recording is marked failed

  CallRecordingQueueRetentionSeconds:
    Type: Number
    Default: 345600
    Description: SQS message retention for the call recording queue (default 4 days)

  CallIntelMaxStageAttempts:
    Type: Number
    Default: 4
    Description: Maximum retries for a single pipeline stage (transcription or analysis) before the recording is marked failed

  CallIntelMaxTranscriptChars:
    Type: Number
    Default: 60000
    Description: Transcript characters sent to the analysis model before truncation

  CallIntelDefaultMeetingTime:
    Type: String
    Default: '11:00'
    Description: Fallback time (HH:mm) used for a proposed meeting when the call did not state one

  CallIntelMaxUploadBytes:
    Type: Number
    Default: 209715200
    Description: Maximum accepted call recording size in bytes (default 200 MB)

  CallIntelUploadUrlTtlSeconds:
    Type: Number
    Default: 900
    Description: Expiry (seconds) for the pre-signed S3 upload URL

  CallIntelPlaybackUrlTtlSeconds:
    Type: Number
    Default: 3600
    Description: Expiry (seconds) for the pre-signed S3 playback URL

  CallIntelStalledAnalysisMs:
    Type: Number
    Default: 900000
    MinValue: 60000
    Description: >-
      How long a recording may sit in ANALYZING before a read re-drives the
      stage. ANALYZING is deliberately un-claimable (that is what stops
      duplicate Gemini runs), so a worker that dies mid-analysis needs this to
      recover. Must be comfortably longer than a real analysis, or a live
      worker gets pre-empted.

Conditions:
  ShouldDeployApiRoutePart2: !Equals [!Ref DeployApiRoutePart2, 'true']
  # When AllowedOrigins is left empty the bucket falls back to "*" for uploads,
  # which is only acceptable for throwaway dev stacks. Set the parameter.
  HasAllowedOrigins: !Not [!Equals [!Ref AllowedOrigins, '']]
  # Without an email the alerts topic is still created (alarms need a target)
  # but has no subscriber - alarms fire silently into the console.
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]
  CustomDomainMappingEnabled: !Equals [!Ref EnableCustomDomainMapping, 'true']

Resources:
  PropertiesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref DynamoDbTableName
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
        - AttributeName: GSI3PK
          AttributeType: S
        - AttributeName: GSI3SK
          AttributeType: S

      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

      GlobalSecondaryIndexes:
        - IndexName: area-index
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

        - IndexName: building-index
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

        - IndexName: search-index
          KeySchema:
            - AttributeName: GSI3PK
              KeyType: HASH
            - AttributeName: GSI3SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  CrmTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref CrmDynamoDbTableName
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
        - AttributeName: GSI3PK
          AttributeType: S
        - AttributeName: GSI3SK
          AttributeType: S

      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

      GlobalSecondaryIndexes:
        - IndexName: owner-property-index
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

        - IndexName: status-index
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

        - IndexName: search-index
          KeySchema:
            - AttributeName: GSI3PK
              KeyType: HASH
            - AttributeName: GSI3SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

      # NOTE: the semantic-property-search vector index is deliberately NOT
      # declared here. CloudFormation does not support DynamoDB vector indexes.
      #
      # `VectorIndexes` is a real parameter — of the DynamoDB *CreateTable API*,
      # not of AWS::DynamoDB::Table. Putting it in this template passes
      # `aws cloudformation validate-template` (syntax only) and then fails every
      # changeset with an opaque
      #   "The following hook(s)/validation failed: [AWS::EarlyValidation::PropertyValidation]"
      # that names no resource or property. That blocked all prod deploys of this
      # stack on 2026-09-02. Same shape as the earlier LifecycleConfiguration
      # `Expiration` vs `ExpirationInDays` bug: an API field that looks like a
      # CFN property but isn't one.
      #
      # The index is created out-of-band instead, against the table this stack
      # owns, by:
      #     server/infra/create-vector-index.sh <dev|prod>
      # which calls UpdateTable with --vector-index-updates. Run it after this
      # stack has deployed. It is idempotent and safe to re-run.
      #
      # Design constraints that script encodes (kept here because they belong
      # with the table definition, and see
      # docs/proposals/agent-channel-architecture/05-retrieval-and-vector-search.md):
      #
      # Three things are IMMUTABLE once created — changing any of them means
      # delete + recreate + a full re-backfill of every embedding:
      #   - DistanceFunction
      #   - the Projection NonKeyAttributes set
      #   - the vector dimension (fixed by EMBEDDING_DIMENSIONS on the app side)
      #
      # tenantId as the SearchSchema HASH is NOT optional and must never be
      # removed. AWS requires the partition key value in every SearchVectors
      # call, so tenant scoping becomes an API-level requirement that fails the
      # call if omitted, rather than a convention a developer has to remember.
      # Without it, one search would rank vectors from every agency in the
      # system and return their data in the response body.
      #
      # NonKeyAttributes must carry every field used for post-search range
      # filtering (price, bhk, status), because inline filters support equality
      # only and the range predicates run in Lambda against whatever the index
      # projected. Adding a field later is not possible without a rebuild.

  # Embedded chunks of each agency's policy documents, for the voice agent's
  # answer_policy_question tool and the WhatsApp / web chat agents.
  #
  # Separate from CrmTable on purpose. A DynamoDB vector index's projection and
  # distance function are immutable: changing either means delete, recreate and
  # re-embed everything in the index. Sharing one index between policies and
  # properties would make any future policy field a full re-embed of every
  # property. Two tables, two indexes, two independent blast radii.
  #
  # The vector index itself is NOT declared here -- CloudFormation has no
  # schema for it. It is created out of band by
  # server/infra/create-vector-index.sh, which is idempotent.
  KnowledgeChunksTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref KnowledgeChunksTableName
      # On-demand is a hard requirement for vector indexes, not a preference.
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S

      # PK: TENANT#<tenantId>#DOC#<policyId>, SK: CHUNK#<00000-padded index>.
      # Every chunk of one document shares a partition, so re-indexing a
      # document is a single Query plus a batched delete -- no scan, and no way
      # to touch another tenant's chunks by accident.
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  AgencyConfigTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref AgencyConfigTableName
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

      AttributeDefinitions:
        - AttributeName: TenantId
          AttributeType: S
        - AttributeName: connectedWhatsAppPhone
          AttributeType: S
        - AttributeName: instagramWebhookToken
          AttributeType: S
        - AttributeName: agencySlug
          AttributeType: S

      KeySchema:
        - AttributeName: TenantId
          KeyType: HASH

      # Resolves tenantId from a connected WhatsApp number without a full
      # table Scan (server/agencyConfigService.js:getTenantIdByConnectedWhatsAppPhone).
      # Not every item has connectedWhatsAppPhone set (only agencies that have
      # connected WhatsApp), which is fine for a GSI hash key -- items missing
      # the attribute simply don't appear in the index.
      GlobalSecondaryIndexes:
        - IndexName: connectedWhatsAppPhone-index
          KeySchema:
            - AttributeName: connectedWhatsAppPhone
              KeyType: HASH
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - TenantId
        # Same reasoning as the WhatsApp index: the Instagram/ManyChat webhook
        # resolves its tenant from this token on EVERY inbound lead, and did so
        # with a full-table Scan. Only agencies with the Instagram pipeline
        # enabled have the attribute, so they are the only items in the index.
        - IndexName: instagramWebhookToken-index
          KeySchema:
            - AttributeName: instagramWebhookToken
              KeyType: HASH
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - TenantId
        # Resolves tenantId from the public-pages subdomain label
