  EscalationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${EnvironmentName}-realestateflow-ai-employee-escalation"
      Runtime: nodejs20.x
      Handler: scripts/escalation-cron.handler
      Role: !GetAtt EscalationRole.Arn
      Timeout: 60
      MemorySize: 128
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      Environment:
        Variables:
          AWS_REGION_OVERRIDE: ap-south-1
          AI_EMPLOYEE_PROVISIONING_TABLE: !Ref AiEmployeeProvisioningTableName
          BREVO_API_KEY: !Ref BrevoApiKey
          BREVO_AI_EMPLOYEE_ESCALATED_FOUNDER_TEMPLATE_ID: !Ref BrevoAiEmployeeEscalatedFounderTemplateId
          BREVO_AI_EMPLOYEE_ESCALATED_CUSTOMER_TEMPLATE_ID: !Ref BrevoAiEmployeeEscalatedCustomerTemplateId
          FOUNDER_EMAIL: !Ref FounderEmail
          FOUNDER_WHATSAPP: !Ref FounderWhatsApp
          POSTHOG_KEY_SERVER: !Ref PostHogKeyServer
          AWS_SES_FROM_EMAIL: !Ref SesFromEmail
          EMAIL_PROVIDER_PRIMARY: !Ref EmailProviderPrimary

  EscalationSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${EnvironmentName}-realestateflow-ai-employee-escalation"
      Description: 'Every 6 hours  check pending AI Employee provisioning SLA'
      ScheduleExpression: 'rate(6 hours)'
      State: ENABLED
      Targets:
        - Arn: !GetAtt EscalationFunction.Arn
          Id: EscalationTarget

  EscalationPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref EscalationFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt EscalationSchedule.Arn

  # Drains notificationDynamodbService.js's SCHEDULED queue (meeting
  # reminders, khata reminders) across every tenant. SSM-hydrated like the
  # main API Lambda rather than given its own Environment.Variables list, so
  # it reads the same NOTIFICATIONS_TABLE_NAME/PUSH_TOKENS_TABLE/SES/Brevo/
  # Firebase config from one source of truth instead of a second copy that
  # can drift from it.
  MeetingReminderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-realestateflow-meeting-reminder-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: MeetingReminderPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt NotificationsTable.Arn
                  - !GetAtt PushTokensTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:Query
                Resource:
                  - !Sub "${PushTokensTable.Arn}/index/*"
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource:
                  - !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${SesFromEmail}'
              # Same SSM read as ApiLambdaRole — see its policy comment.
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParametersByPath
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${EnvironmentName}/realestateflow/server/*"
              - Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: "*"
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"

  MeetingReminderFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${EnvironmentName}-realestateflow-meeting-reminder"
      Runtime: nodejs20.x
      Handler: scripts/meeting-reminder-cron.handler
      Role: !GetAtt MeetingReminderRole.Arn
      Timeout: 60
      MemorySize: 128
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      Environment:
        Variables:
          NODE_ENV: !Ref EnvironmentName
          LOG_LEVEL: !Ref LogLevel
          SSM_CONFIG_PATH: !Sub "/${EnvironmentName}/realestateflow/server/"

  MeetingReminderRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${EnvironmentName}-realestateflow-meeting-reminder"
      Description: 'Every 5 minutes  fire due meeting/khata reminders (push + email to assignee + agency owner)'
      ScheduleExpression: 'rate(5 minutes)'
      State: ENABLED
      Targets:
        - Arn: !GetAtt MeetingReminderFunction.Arn
          Id: MeetingReminderTarget

  MeetingReminderPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref MeetingReminderFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt MeetingReminderRule.Arn

  # --------------------------------------------------------------------------
  # 4. LEAD MANAGEMENT  Qualification, routing, follow-ups
