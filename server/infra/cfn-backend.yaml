        # every anonymous page render, crawlers included, so a Scan here would
        # be both the hottest and the most expensive read in the system.
        # Only agencies that have claimed a slug carry the attribute, so the
        # index holds just those items.
        - IndexName: agencySlug-index
          KeySchema:
            - AttributeName: agencySlug
              KeyType: HASH
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
