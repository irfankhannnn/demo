  # ========================================================================
  # CRON JOBS & SCHEDULED LAMBDAS  Organized by function type
  # ========================================================================

  # --------------------------------------------------------------------------
  # 1. BILLING & CREDITS  Daily resets, subscription management
  # --------------------------------------------------------------------------

  CreditResetRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: realestateflow-credit-reset-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CreditResetPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SubscriptionsTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CreditsTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CreditConfigTableName}'

  CreditResetFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: realestateflow-credit-reset
      Runtime: nodejs20.x
      Handler: scripts/credit-reset-cron.handler
      Timeout: 300
      MemorySize: 256
      Role: !GetAtt CreditResetRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      Environment:
        Variables:
          SUBSCRIPTIONS_TABLE: !Ref SubscriptionsTableName
          CREDITS_TABLE_NAME: !Ref CreditsTableName
          CREDIT_CONFIG_TABLE_NAME: !Ref CreditConfigTableName


  CreditResetRule:
    Type: AWS::Events::Rule
    Properties:
      Name: realestateflow-credit-reset
      Description: 'Trigger credit reset Lambda daily at 00:30 IST (18:30 UTC)'
      ScheduleExpression: 'cron(30 18 * * ? *)'
      State: ENABLED
      Targets:
        - Arn: !GetAtt CreditResetFunction.Arn
          Id: CreditResetTarget

  CreditResetPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CreditResetFunction
      Action: 'lambda:InvokeFunction'
      Principal: 'events.amazonaws.com'
      SourceArn: !GetAtt CreditResetRule.Arn

  TrialReminderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: realestateflow-trial-reminder-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: TrialReminderPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SubscriptionsTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SubscriptionsTableName}/*'
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource:
                  - !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${SesFromEmail}'

  TrialReminderFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: realestateflow-trial-reminder
      Runtime: nodejs20.x
      Handler: scripts/trial-reminder-cron.handler
      Role: !GetAtt TrialReminderRole.Arn
      Timeout: 60
      MemorySize: 128
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      Environment:
        Variables:
          SUBSCRIPTIONS_TABLE: !Ref SubscriptionsTableName
          BREVO_API_KEY: !Ref BrevoApiKey
          AWS_SES_FROM_EMAIL: !Ref SesFromEmail
          EMAIL_PROVIDER_PRIMARY: !Ref EmailProviderPrimary


  TrialReminderRule:
    Type: AWS::Events::Rule
    Properties:
      Name: realestateflow-trial-reminder
      Description: 'Trigger trial reminder Lambda daily at 09:00 IST (03:30 UTC)'
      ScheduleExpression: 'cron(30 3 * * ? *)'
      State: ENABLED
      Targets:
