          PUBLIC_API_BASE_PATH: !Ref PublicApiBasePath
          CRM_API_BASE_PATH: !Ref CrmApiBasePath
          ENABLE_BASE_PATH_STRIP: !Ref EnableBasePathStrip
          AUTH_SERVICE_URL: !Ref AuthServiceUrl
          ALLOWED_ORIGINS: !Ref AllowedOrigins
          NPS_HMAC_SECRET: !Ref NpsHmacSecret
          BREVO_API_KEY: !Ref BrevoApiKey
          RAZORPAY_WEBHOOK_SECRET: !Ref RazorpayWebhookSecret
          RAZORPAY_KEY_ID: !Ref RazorpayKeyId
          RAZORPAY_KEY_SECRET: !Ref RazorpayKeySecret
          BREVO_FROM_EMAIL: !Ref BrevoFromEmail
          BREVO_FROM_NAME: !Ref BrevoFromName
          HCAPTCHA_SECRET_KEY: !Ref HcaptchaSecretKey
          POSTHOG_KEY_SERVER: !Ref PostHogKeyServer
          POSTHOG_HOST: !Ref PostHogHost
          INTERNAL_API_KEY: !Ref InternalApiKey
          AI_CALLING_INTERNAL_API_KEY: !Ref AiCallingInternalApiKey
          AI_CALLING_SERVICE_URL: !Ref AiCallingServiceUrl
          LLM_PROVIDER: !Ref LlmProvider
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          GEMINI_API_KEY: !Ref GeminiApiKey
          GEMINI_MODEL: !Ref GeminiModel
          GEMINI_CLASSIFIER_MODEL: !Ref GeminiClassifierModel
          CLOUDWATCH_METRICS_ENABLED: !Ref CloudwatchMetricsEnabled
          GRIEVANCE_OFFICER_EMAIL: !Ref GrievanceOfficerEmail
          SERVICE_ACCOUNT_USER: !Ref ServiceAccountUser
          DEFAULT_COUNTRY_CODE: !Ref DefaultCountryCode
          APP_URL: !Ref AppUrl
          LOG_LEVEL: !Ref LogLevel
          MCP_BASE_URL: !Ref McpBaseUrl
          OAUTH_CODES_TABLE_NAME: !Ref OAuthCodesTableName
          OAUTH_CONNECTIONS_TABLE: !Ref OAuthConnectionsTableName
          OAUTH_CALLBACK_URL: !Ref OAuthCallbackUrl
          FRONTEND_URL: !Ref FrontendUrl
          WEBHOOK_LOG_TABLE: WebhookLog
          TENANT_API_KEYS_TABLE: TenantApiKeys
          FOUNDER_EMAIL: !Ref FounderEmail
          BREVO_TRIAL_LIST_ID: !Ref BrevoTrialListId
          BREVO_PAYMENT_FAILED_TEMPLATE_ID: !Ref BrevoPaymentFailedTemplateId
          BREVO_AI_EMPLOYEE_PAID_TEMPLATE_ID: !Ref BrevoAiEmployeePaidTemplateId
          BREVO_AI_EMPLOYEE_ESCALATED_FOUNDER_TEMPLATE_ID: !Ref BrevoAiEmployeeEscalatedFounderTemplateId
          BREVO_AI_EMPLOYEE_ESCALATED_CUSTOMER_TEMPLATE_ID: !Ref BrevoAiEmployeeEscalatedCustomerTemplateId
          BAILEY_ADMIN_API_KEY: !Ref BaileyAdminApiKey
          RAZORPAY_PLAN_AI_EMPLOYEE: !Ref RazorpayPlanAiEmployee
          CALL_RECORDING_QUEUE_URL: !Ref CallRecordingQueue
          ASR_PROVIDER: !Ref AsrProvider
          TRANSCRIBE_LANGUAGE_OPTIONS: !Ref TranscribeLanguageOptions
          TRANSCRIBE_LANGUAGE_CODE: !Ref TranscribeLanguageCode
          TRANSCRIBE_VOCABULARY_NAME: !Ref TranscribeVocabularyName
          CALL_INTEL_AUTO_APPLY_NOTES: !Ref CallIntelAutoApplyNotes
          CALL_INTEL_POLL_DELAY_SECONDS: !Ref CallIntelPollDelaySeconds
          CALL_INTEL_MAX_POLL_ATTEMPTS: !Ref CallIntelMaxPollAttempts
          CALL_INTEL_MAX_STAGE_ATTEMPTS: !Ref CallIntelMaxStageAttempts
          CALL_INTEL_MAX_TRANSCRIPT_CHARS: !Ref CallIntelMaxTranscriptChars
          CALL_INTEL_DEFAULT_MEETING_TIME: !Ref CallIntelDefaultMeetingTime
          CALL_INTEL_MAX_UPLOAD_BYTES: !Ref CallIntelMaxUploadBytes
          CALL_INTEL_UPLOAD_URL_TTL_SECONDS: !Ref CallIntelUploadUrlTtlSeconds
          CALL_INTEL_PLAYBACK_URL_TTL_SECONDS: !Ref CallIntelPlaybackUrlTtlSeconds

  # ============== Call Intelligence worker ==============
  # Same deployment package as the API Lambda, different handler. It reuses
  # ApiLambdaExecutionRole so every CRM table/S3 permission the shared services
  # need is already granted.
  CallRecordingWorkerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${EnvironmentName}-real-estate-call-recording-worker"
      Runtime: !Ref LambdaRuntime
      Handler: workers/callRecordingWorker.handler
      Role: !GetAtt ApiLambdaExecutionRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      MemorySize: !Ref CallIntelWorkerMemorySize
      Timeout: !Ref CallIntelWorkerTimeout
      Environment:
        Variables:
          NODE_ENV: !Ref EnvironmentName
          DYNAMODB_TABLE_NAME: !Ref DynamoDbTableName
          CRM_DYNAMODB_TABLE_NAME: !Ref CrmDynamoDbTableName
          AGENCY_CONFIG_DYNAMODB_TABLE_NAME: !Ref AgencyConfigTableName
          AREAS_DYNAMODB_TABLE_NAME: !Ref AreasTableName
          NOTIFICATIONS_TABLE_NAME: !Ref NotificationsTableName
          DEVELOPERS_TABLE_NAME: !Ref DevelopersTableName
          REAL_ESTATE_AREAS_TABLE_NAME: !Ref RealEstateAreasTableName
          PROJECTS_TABLE_NAME: !Ref ProjectsTableName
          CREDITS_TABLE_NAME: !Ref CreditsTableName
          CREDIT_CONFIG_TABLE_NAME: !Ref CreditConfigTableName
          USER_CATEGORIES_TABLE_NAME: !Ref UserCategoriesTableName
          AGENT_AUDIT_TABLE_NAME: !Ref AgentAuditTableName
          ALLOW_USER_CATEGORY_DEFAULT_FALLBACK: !Ref AllowUserCategoryDefaultFallback
          S3_BUCKET_NAME: !Ref S3BucketName
          LLM_PROVIDER: !Ref LlmProvider
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          GEMINI_API_KEY: !Ref GeminiApiKey
          GEMINI_MODEL: !Ref GeminiModel
          GEMINI_CLASSIFIER_MODEL: !Ref GeminiClassifierModel
          SERVICE_ACCOUNT_USER: !Ref ServiceAccountUser
          DEFAULT_COUNTRY_CODE: !Ref DefaultCountryCode
          LOG_LEVEL: !Ref LogLevel
          CLOUDWATCH_METRICS_ENABLED: !Ref CloudwatchMetricsEnabled
          CALL_RECORDING_QUEUE_URL: !Ref CallRecordingQueue
          ASR_PROVIDER: !Ref AsrProvider
          TRANSCRIBE_LANGUAGE_OPTIONS: !Ref TranscribeLanguageOptions
          TRANSCRIBE_LANGUAGE_CODE: !Ref TranscribeLanguageCode
          TRANSCRIBE_VOCABULARY_NAME: !Ref TranscribeVocabularyName
          CALL_INTEL_AUTO_APPLY_NOTES: !Ref CallIntelAutoApplyNotes
          CALL_INTEL_POLL_DELAY_SECONDS: !Ref CallIntelPollDelaySeconds
          CALL_INTEL_MAX_POLL_ATTEMPTS: !Ref CallIntelMaxPollAttempts
          CALL_INTEL_MAX_STAGE_ATTEMPTS: !Ref CallIntelMaxStageAttempts
          CALL_INTEL_MAX_TRANSCRIPT_CHARS: !Ref CallIntelMaxTranscriptChars
          CALL_INTEL_DEFAULT_MEETING_TIME: !Ref CallIntelDefaultMeetingTime
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  CallRecordingWorkerEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt CallRecordingQueue.Arn
      FunctionName: !GetAtt CallRecordingWorkerFunction.Arn
      BatchSize: 5
      MaximumBatchingWindowInSeconds: 5
      # One bad message must not force redelivery of the whole batch.
      FunctionResponseTypes:
        - ReportBatchItemFailures

  RealEstatePublicRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "${EnvironmentName}-real-estate-public-api"
      BinaryMediaTypes:
        - "*/*"
      EndpointConfiguration:
        Types:
          - REGIONAL

  PublicApiGatewayResponseDefault4XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref RealEstatePublicRestApi
      ResponseType: DEFAULT_4XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Requested-With,x-tenant-id'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS,PATCH'"

  PublicApiGatewayResponseDefault5XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref RealEstatePublicRestApi
      ResponseType: DEFAULT_5XX
      ResponseParameters:
