AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Real Estate Agency - Core AWS resources
  (core properties table, multi-tenant CRM table, agency config table, S3 bucket).

  NOTE: This template references OAuth tables (OAuthCodesTableName and
  OAuthConnectionsTableName) that are created by the reality-flow-mcp stack.
  Deploy the MCP stack first or ensure those tables already exist before
  deploying this stack; otherwise the CRM Lambda will fail at runtime when
  accessing them.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    Description: Environment name (used for tagging only)

  DynamoDbTableName:
    Type: String
    Default: cloudberry-real-estate-core
    Description: Name of the core DynamoDB table used by the application

  CrmDynamoDbTableName:
    Type: String
    Default: cloudberry-real-estate-crm
    Description: Name of the DynamoDB table used by the multi-tenant CRM

  AgencyConfigTableName:
    Type: String
    Default: cloudberry-real-estate-agencies
    Description: Name of the DynamoDB table storing per-agency admin configuration

  AreasTableName:
    Type: String
    Default: cloudberry-real-estate-areas
    Description: Name of the DynamoDB table storing area information with banners

  EnquiriesTableNameCloudberry:
    Type: String
    Default: cloudberry-real-estate-enquiries
    Description: Name of the DynamoDB table storing contact and consultation enquiries

  B2BLeadsTableName:
    Type: String
    Default: cloudberry-real-estate-b2b-details
    Description: Name of the DynamoDB table storing B2B sales leads (Ten BKC channel partnership inquiries)

  KhataTableName:
    Type: String
    Default: cloudberry-real-estate-khata
    Description: Name of the DynamoDB table storing Khata Book transactions and categories

  NotificationsTableName:
    Type: String
    Default: cloudberry-real-estate-notifications
    Description: Name of the DynamoDB table storing in-app notifications and scheduled reminders

  DevelopersTableName:
    Type: String
    Default: cloudberry-real-estate-developers
    Description: Name of the DynamoDB table storing real estate developer profiles (Emaar, Sobha, Lodha, etc.)

  RealEstateAreasTableName:
    Type: String
    Default: cloudberry-real-estate-communities
    Description: Name of the DynamoDB table storing area/community profiles (DIFC, Dubai Marina, Andheri, etc.)


  ProjectsTableName:
    Type: String
    Default: cloudberry-real-estate-projects
    Description: Name of the DynamoDB table storing real estate projects

  GrievancesTableName:
    Type: String
    Default: Grievances
    Description: Name of the DynamoDB table storing DPDP Act 2023 grievances

  NpsResponsesTableName:
    Type: String
    Default: NPSResponses
    Description: Name of the DynamoDB table storing Net Promoter Score responses

  SubscriptionsTableName:
    Type: String
    Default: Subscriptions
    Description: Name of the DynamoDB table storing tenant subscription plans and seat limits

  CreditsTableName:
    Type: String
    Default: cloudberry-real-estate-credits
    Description: DynamoDB table for tenant credit balances and ledger

  CreditConfigTableName:
    Type: String
    Default: cloudberry-real-estate-credit-config
    Description: DynamoDB table for owner-editable credit configuration

  UserCategoriesTableName:
    Type: String
    Default: cloudberry-real-estate-user-categories
    Description: DynamoDB table for WhatsApp user category assignments

  SesFromEmail:
    Type: String
    Default: noreply@realestateflow.in

  EmailProviderPrimary:
    Type: String
    Default: ses

  BaileyEnabled:
    Type: String
    Default: 'false'

  BaileyApiKey:
    Type: String
    NoEcho: true
    Default: ''

  BaileyMode:
    Type: String
    Default: 'hosted'
    AllowedValues: ['hosted', 'selfhosted']
    Description: Bailey mode - hosted (api.bailey.ai) or selfhosted (own Baileys service)

  BaileyWebhookSecret:
    Type: String
    NoEcho: true
    Default: ''

  AgentsEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable AI Employee agents globally

  AllowUserCategoryDefaultFallback:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >
      SECURITY: only enable in dev. If true, unknown users fall back to the
      default user category when checking AI tool permissions. Production must
      keep this false and explicitly provision user categories.

  BaileyApiEndpoint:
    Type: String
    Default: 'https://api.bailey.ai'
    Description: Bailey WhatsApp gateway API base URL

  BaileyApiPrefix:
    Type: String
    Default: ''
    Description: Optional API path prefix for Bailey service (defaults to '/v1' for hosted, '' for selfhosted)

  S3BucketName:
    Type: String
    Description: S3 bucket name for documents (must be globally unique)
    MinLength: 3
    MaxLength: 63
    AllowedPattern: "^[a-z0-9][a-z0-9.-]*[a-z0-9]$"
    ConstraintDescription: >
      Bucket name must be lowercase, 363 characters, and can contain
      letters, numbers, dots, and hyphens.

  LambdaCodeS3Bucket:
    Type: String
    Description: S3 bucket that stores the packaged Lambda zip (deployment artifact)

  LambdaCodeS3Key:
    Type: String
    Description: S3 object key for the packaged Lambda zip

  LambdaRuntime:
    Type: String
    Default: nodejs20.x
    AllowedValues:
      - nodejs18.x
      - nodejs20.x
    Description: Lambda runtime for the backend function

  LambdaMemorySize:
    Type: Number
    Default: 512
    Description: Lambda memory size in MB

  LambdaTimeout:
    Type: Number
    Default: 30
    Description: Lambda timeout in seconds

  PublicApiDomainName:
    Type: String
    Description: Custom domain name for the public website API (e.g. api.example.com)

  PublicApiBasePath:
    Type: String
    Default: api
    Description: Base path for the public API mapping on the custom domain

  PublicApiStageName:
    Type: String
    Default: prod
    Description: Stage name for the public API Gateway

  CrmApiDomainName:
    Type: String
    Description: Custom domain name for the CRM web UI API (e.g. crm-api.example.com)

  CrmApiBasePath:
    Type: String
    Default: api
    Description: Base path for the CRM API mapping on the custom domain

  CrmApiStageName:
    Type: String
    Default: prod
    Description: Stage name for the CRM API Gateway

  EnableBasePathStrip:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >
      Set to 'true' when the custom domain URL includes the API base path
      (e.g., /devrealestatecrm/api/...). The Lambda handler will strip that
      base path so Express routes (mounted at /api/...) match correctly.

  AuthServiceUrl:
    Type: String
    Description: URL of the authentication microservice for token validation (e.g., https://auth-api.example.com)

  AllowedOrigins:
    Type: String
    Default: ''
    Description: Comma-separated list of allowed CORS origins (never use '*' in production)

  ApiGatewayRoutesTemplateUrl:
    Type: String
    Description: S3 URL for nested template part 1 (explicit API Gateway routes)

  ApiGatewayRoutesTemplateUrlPart2:
    Type: String
    Description: S3 URL for nested template part 2 (remaining explicit API Gateway routes)

  DeployApiRoutePart2:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Set to false only while migrating the existing explicit routes into split nested stacks.

  NpsHmacSecret:
    Type: String
    Default: ''
    Description: HMAC secret for NPS score token verification (feedback module)
    NoEcho: true

  BrevoApiKey:
    Type: String
    Default: ''
    Description: Brevo (Sendinblue) API key for transactional emails
    NoEcho: true

  RazorpayWebhookSecret:
    Type: String
    Default: ''
    Description: Razorpay webhook secret for signature verification
    NoEcho: true

  RazorpayKeyId:
    Type: String
    Default: ''
    Description: Razorpay API Key ID (from Dashboard  Settings  API Keys)
    NoEcho: true

  RazorpayKeySecret:
    Type: String
    Default: ''
    Description: Razorpay API Key Secret (from Dashboard  Settings  API Keys)
    NoEcho: true

  BrevoFromEmail:
    Type: String
    Default: 'no-reply@realestateflow.in'
    Description: Sender email address for Brevo transactional emails

  BrevoFromName:
    Type: String
    Default: 'RealEstateFlow'
    Description: Sender display name for Brevo transactional emails

  HcaptchaSecretKey:
    Type: String
    Default: ''
    Description: hCaptcha secret key for grievance form verification
    NoEcho: true

  # --- Cron-specific parameters ----------------------------------------------
  PostHogKeyServer:
    Type: String
    Default: ''
    Description: PostHog server-side key for cron analytics events
    NoEcho: true

  PostHogHost:
    Type: String
    Default: 'https://eu.i.posthog.com'
    Description: PostHog host URL

  InternalApiKey:
    Type: String
    Default: ''
    Description: Internal API key for auth service access (team member lookup)
    NoEcho: true

  AiCallingInternalApiKey:
    Type: String
    Default: ''
    Description: Shared secret ai-calling-service must present (x-api-key) to call /api/internal/* routes (Lead Temperature qualification calls)
    NoEcho: true

  AiCallingServiceUrl:
    Type: String
    Default: ''
    Description: Base URL of the ai-calling-service stack, used by POST /leads/:id/qualify-call to trigger on-demand qualification calls

  FounderWhatsApp:
    Type: String
    Default: ''
    Description: Founder WhatsApp number for escalation notifications
    NoEcho: true

  AgentAuditTableName:
    Type: String
    Default: cloudberry-real-estate-agent-audit
    Description: DynamoDB table for AI Employee agent audit logs

  JwtSecret:
    Type: String
    NoEcho: true
    Default: ''
    Description: JWT secret for signing MCP service tokens

  AgentActionCredits:
    Type: String
    Default: '15'
    Description: Number of credits charged per agent action

  AiEmployeeRolloutPercentage:
    Type: String
    Default: '100'
    Description: Percentage of tenants for gradual rollout (0-100)

  AiEmployeeProvisioningTableName:
    Type: String
    Default: AIEmployeeProvisioning
    Description: DynamoDB table for AI Employee provisioning rows

  # ── Phase 2: AI Employee LLM & Observability ─────────────────────────────────
  LlmProvider:
    Type: String
    Default: bedrock
    AllowedValues:
      - bedrock
      - gemini
    Description: LLM provider for AI agent invocations (bedrock | gemini)

  BedrockModelId:
    Type: String
    Default: anthropic.claude-3-haiku-20240307-v1:0
    Description: Bedrock model ID for AI agent invocations

  GeminiApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: Google Gemini API key (required only if LlmProvider=gemini)

  GeminiModel:
    Type: String
    Default: gemini-2.5-flash
    Description: Gemini model name (used only if LlmProvider=gemini)

  GeminiClassifierModel:
    Type: String
    Default: gemini-2.5-flash
    Description: Gemini classifier model name (used for lead classification)

  CloudwatchMetricsEnabled:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Enable Phase 2 CloudWatch custom metrics emission

  AiAdminWhatsAppNumbers:
    Type: String
    Default: ''
    Description: Comma-separated admin WhatsApp numbers allowed to trigger the AI

  # --- Externalized operational constants (no hardcoded fallbacks) ----------------

  ServiceAccountUser:
    Type: String
    Default: 'system'
    Description: Service account identifier for automated/system writes

  DefaultCountryCode:
    Type: String
    Default: '+91'
    Description: Default country code for phone normalization (e.g. +91, +971)

  AppUrl:
    Type: String
    Default: 'https://app.realestateflow.in'
    Description: Public app URL used in emails and reminders

  GrievanceOfficerEmail:
    Type: String
    Default: 'info@realestateflow.in'
    Description: DPDP Act 2023 grievance officer email address

  LogLevel:
    Type: String
    Default: 'info'
    Description: Application log level

  McpBaseUrl:
    Type: String
    Default: 'https://mcp.realtyflow.com'
    Description: MCP service base URL for OAuth redirects

  OAuthCodesTableName:
    Type: String
    Default: 'realtyflow-oauth-codes'
    Description: DynamoDB table for OAuth authorization codes and sessions

  OAuthConnectionsTableName:
    Type: String
    Default: 'realtyflow-oauth-connections'
    Description: DynamoDB table for connected AI app integrations

  OAuthCallbackUrl:
    Type: String
    Default: 'https://services-api.cloudberrysolutions.in/devrealestatecrm/api/ai-integrations/callback'
    Description: Public OAuth callback URL for the CRM backend (where MCP redirects after approval)

  FrontendUrl:
    Type: String
    Default: 'http://localhost:3000'
    Description: Frontend URL for post-OAuth redirect

  RazorpayPlanAiEmployee:
    Type: String
    Default: 'plan_test_ai_employee'
    Description: Razorpay plan ID for AI employee subscription

  FounderEmail:
    Type: String
    Default: 'info@realestateflow.in'
    Description: Founder email address

  BrevoTrialListId:
    Type: String
    Default: ''
    Description: Brevo trial list ID

  BrevoPaymentFailedTemplateId:
    Type: String
    Default: ''
    Description: Brevo payment failed template ID

  BrevoAiEmployeePaidTemplateId:
    Type: String
    Default: ''
    Description: Brevo AI employee paid template ID

  BrevoAiEmployeeEscalatedFounderTemplateId:
    Type: String
    Default: ''
    Description: Brevo AI employee escalated founder template ID

  BrevoAiEmployeeEscalatedCustomerTemplateId:
    Type: String
    Default: ''
    Description: Brevo AI employee escalated customer template ID

  BaileyAdminApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: Bailey admin API key for destructive operations

  # ============== Call Intelligence (call recording analysis) ==============
  AsrProvider:
    Type: String
    Default: amazon-transcribe
    AllowedValues:
      - amazon-transcribe
      - whisper
    Description: Speech-to-text provider used by the call recording pipeline

  TranscribeLanguageOptions:
    Type: String
    Default: en-IN,hi-IN,mr-IN,gu-IN,ta-IN,te-IN,kn-IN,ml-IN,pa-IN,bn-IN
    Description: Languages offered to Amazon Transcribe automatic language identification

  TranscribeLanguageCode:
    Type: String
    Default: ''
    Description: >
      Fixed Amazon Transcribe language code (e.g. en-IN). Leave empty to use
      automatic multi-language identification. Required when using a custom vocabulary.

  TranscribeVocabularyName:
    Type: String
    Default: ''
    Description: >
      Optional Amazon Transcribe custom vocabulary name for Indian real-estate terms.
      Create it out-of-band; an unknown name makes every transcription job fail.

  CallIntelAutoApplyNotes:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Apply the AI call-summary note automatically (every other action always needs approval)

  CallIntelWorkerMemorySize:
    Type: Number
    Default: 1024
    Description: Memory (MB) for the call recording worker Lambda

  CallIntelWorkerTimeout:
    Type: Number
    Default: 300
    Description: Timeout (seconds) for the call recording worker Lambda

  CallIntelPollDelaySeconds:
    Type: Number
    Default: 45
    Description: Delay between Amazon Transcribe job status polls

  CallIntelMaxPollAttempts:
    Type: Number
    Default: 60
    Description: Maximum transcription status polls before a recording is marked failed

  CallRecordingQueueRetentionSeconds:
    Type: Number
    Default: 345600
    Description: SQS message retention for the call recording queue (default 4 days)

  CallIntelMaxStageAttempts:
    Type: Number
    Default: 4
    Description: Maximum retries for a single pipeline stage (transcription or analysis) before the recording is marked failed

  CallIntelMaxTranscriptChars:
    Type: Number
    Default: 60000
    Description: Transcript characters sent to the analysis model before truncation

  CallIntelDefaultMeetingTime:
    Type: String
    Default: '11:00'
    Description: Fallback time (HH:mm) used for a proposed meeting when the call did not state one

  CallIntelMaxUploadBytes:
    Type: Number
    Default: 209715200
    Description: Maximum accepted call recording size in bytes (default 200 MB)

  CallIntelUploadUrlTtlSeconds:
    Type: Number
    Default: 900
    Description: Expiry (seconds) for the pre-signed S3 upload URL

  CallIntelPlaybackUrlTtlSeconds:
    Type: Number
    Default: 3600
    Description: Expiry (seconds) for the pre-signed S3 playback URL

Conditions:
  ShouldDeployApiRoutePart2: !Equals [!Ref DeployApiRoutePart2, 'true']

Resources:
  PropertiesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref DynamoDbTableName
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
        - AttributeName: GSI3PK
          AttributeType: S
        - AttributeName: GSI3SK
          AttributeType: S

      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

      GlobalSecondaryIndexes:
        - IndexName: area-index
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

        - IndexName: building-index
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

        - IndexName: search-index
          KeySchema:
            - AttributeName: GSI3PK
              KeyType: HASH
            - AttributeName: GSI3SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  CrmTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref CrmDynamoDbTableName
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
        - AttributeName: GSI3PK
          AttributeType: S
        - AttributeName: GSI3SK
          AttributeType: S

      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

      GlobalSecondaryIndexes:
        - IndexName: owner-property-index
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

        - IndexName: status-index
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

        - IndexName: search-index
          KeySchema:
            - AttributeName: GSI3PK
              KeyType: HASH
            - AttributeName: GSI3SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  AgencyConfigTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref AgencyConfigTableName
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: TenantId
          AttributeType: S

      KeySchema:
        - AttributeName: TenantId
          KeyType: HASH

  CreditsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref CreditsTableName
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: tenantId
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: tenantId
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: actionType-index
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  CreditConfigTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref CreditConfigTableName
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: configKey
          AttributeType: S
      KeySchema:
        - AttributeName: configKey
          KeyType: HASH

  UserCategoriesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref UserCategoriesTableName
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: phone
          AttributeType: S
        - AttributeName: tenantId
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: phone
          KeyType: HASH
        - AttributeName: tenantId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: tenant-index
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  AgentAuditTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref AgentAuditTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tenantId
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: tenantId
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  AiEmployeeProvisioningTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref AiEmployeeProvisioningTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tenantId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
        - AttributeName: status
          AttributeType: S
      KeySchema:
        - AttributeName: tenantId
          KeyType: HASH
        - AttributeName: createdAt
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: status-createdAt-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Service
          Value: ai-employee

  AreasTableCloudberry:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref AreasTableName
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S

      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

      GlobalSecondaryIndexes:
        - IndexName: tenant-city-index
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  EnquiriesTableCloudberry:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref EnquiriesTableNameCloudberry
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S

      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

      GlobalSecondaryIndexes:
        - IndexName: tenant-status-index
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  B2BLeadsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref B2BLeadsTableName
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: leadId
          AttributeType: S
        - AttributeName: tenantId
          AttributeType: S
        - AttributeName: submittedAt
          AttributeType: S

      KeySchema:
        - AttributeName: leadId
          KeyType: HASH

      GlobalSecondaryIndexes:
        - IndexName: tenant-date-index
          KeySchema:
            - AttributeName: tenantId
              KeyType: HASH
            - AttributeName: submittedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  KhataTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref KhataTableName
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S

      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

      GlobalSecondaryIndexes:
        - IndexName: property-settlement-index
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

        - IndexName: tenant-settlement-index
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  NotificationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref NotificationsTableName
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S

      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

      GlobalSecondaryIndexes:
        - IndexName: unread-index
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ============================================================
  # Real Estate Management Tables (Developers, Areas, Projects)
  # ============================================================

  DevelopersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref DevelopersTableName
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S

      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

      GlobalSecondaryIndexes:
        # GSI1: Search index (tenant + name/slug search)
        - IndexName: search-index
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

        # GSI2: Slug lookup index (tenant + slug for URL-friendly lookups)
        - IndexName: slug-index
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  RealEstateAreasTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref RealEstateAreasTableName
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
        - AttributeName: GSI3PK
          AttributeType: S
        - AttributeName: GSI3SK
          AttributeType: S

      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

      GlobalSecondaryIndexes:
        # GSI1: Search index (tenant + name/slug search)
        - IndexName: search-index
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

        # GSI2: Slug lookup index (tenant + slug for URL-friendly lookups)
        - IndexName: slug-index
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

        # GSI3: Location index (tenant + city/emirate for geographic filtering)
        - IndexName: location-index
          KeySchema:
            - AttributeName: GSI3PK
              KeyType: HASH
            - AttributeName: GSI3SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  ProjectsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref ProjectsTableName
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
        - AttributeName: GSI3PK
          AttributeType: S
        - AttributeName: GSI3SK
          AttributeType: S
        - AttributeName: GSI4PK
          AttributeType: S
        - AttributeName: GSI4SK
          AttributeType: S
        - AttributeName: GSI5PK
          AttributeType: S
        - AttributeName: GSI5SK
          AttributeType: S

      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

      GlobalSecondaryIndexes:
        # GSI1: Developer index (tenant + developerId for projects by developer)
        - IndexName: developer-index
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

        # GSI2: Area index (tenant + areaId for projects by area/community)
        - IndexName: area-index
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

        # GSI3: Status index (tenant + status for filtering active/completed projects)
        - IndexName: status-index
          KeySchema:
            - AttributeName: GSI3PK
              KeyType: HASH
            - AttributeName: GSI3SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

        # GSI4: Search index (tenant + name/slug search)
        - IndexName: search-index
          KeySchema:
            - AttributeName: GSI4PK
              KeyType: HASH
            - AttributeName: GSI4SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

        # GSI5: Slug lookup index (tenant + slug for URL-friendly lookups)
        - IndexName: slug-index
          KeySchema:
            - AttributeName: GSI5PK
              KeyType: HASH
            - AttributeName: GSI5SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  DocumentsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref S3BucketName
      VersioningConfiguration:
        Status: Suspended
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - "*"
            AllowedMethods:
              - GET
              - HEAD
            AllowedHeaders:
              - "*"
            MaxAge: 3600
          # Browsers upload call recordings straight to S3 with a pre-signed
          # PUT, which requires PUT to be allowed and ETag to be readable.
          - AllowedOrigins:
              - "*"
            AllowedMethods:
              - PUT
              - POST
            AllowedHeaders:
              - "*"
            ExposedHeaders:
              - ETag
            MaxAge: 3600
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  # ============== Call Intelligence pipeline ==============

  CallRecordingDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${EnvironmentName}-real-estate-call-recordings-dlq"
      MessageRetentionPeriod: 1209600 # 14 days
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  CallRecordingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${EnvironmentName}-real-estate-call-recordings"
      # Must be >= the worker timeout, otherwise SQS redelivers a message that
      # is still being processed.
      VisibilityTimeout: !Ref CallIntelWorkerTimeout
      MessageRetentionPeriod: !Ref CallRecordingQueueRetentionSeconds
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt CallRecordingDlq.Arn
        maxReceiveCount: 5
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  ApiLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-real-estate-api-lambda-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: RealEstateApiDynamoAndS3Access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchWriteItem
                  - dynamodb:DescribeTable
                Resource:
                  - !GetAtt PropertiesTable.Arn
                  - !GetAtt CrmTable.Arn
                  - !GetAtt AgencyConfigTable.Arn
                  - !GetAtt AreasTableCloudberry.Arn
                  - !GetAtt EnquiriesTableCloudberry.Arn
                  - !GetAtt B2BLeadsTable.Arn
                  - !GetAtt KhataTable.Arn
                  - !GetAtt NotificationsTable.Arn
                  - !GetAtt DevelopersTable.Arn
                  - !GetAtt RealEstateAreasTable.Arn
                  - !GetAtt ProjectsTable.Arn
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${GrievancesTableName}"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${NpsResponsesTableName}"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SubscriptionsTableName}"
                  - !GetAtt CreditsTable.Arn
                  - !GetAtt CreditConfigTable.Arn
                  - !GetAtt UserCategoriesTable.Arn
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WebhookLog"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AiEmployeeProvisioningTableName}"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AiEmployeeProvisioningTableName}/*"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${OAuthCodesTableName}"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${OAuthCodesTableName}/index/*"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${OAuthConnectionsTableName}"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${OAuthConnectionsTableName}/index/*"
              - Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !Sub "${PropertiesTable.Arn}/index/*"
                  - !Sub "${CrmTable.Arn}/index/*"
                  - !Sub "${AreasTableCloudberry.Arn}/index/*"
                  - !Sub "${EnquiriesTableCloudberry.Arn}/index/*"
                  - !Sub "${B2BLeadsTable.Arn}/index/*"
                  - !Sub "${KhataTable.Arn}/index/*"
                  - !Sub "${NotificationsTable.Arn}/index/*"
                  - !Sub "${DevelopersTable.Arn}/index/*"
                  - !Sub "${RealEstateAreasTable.Arn}/index/*"
                  - !Sub "${ProjectsTable.Arn}/index/*"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${GrievancesTableName}/index/*"
                  - !Sub "${CreditsTable.Arn}/index/*"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/WebhookLog/index/*"
                  - !Sub "${UserCategoriesTable.Arn}/index/*"
              - Effect: Allow
                Action:
                  - dynamodb:TransactWriteItems
                Resource:
                  - !GetAtt CreditsTable.Arn
                  - !GetAtt CrmTable.Arn
              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource: '*'
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: '*'
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: '*'
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-haiku-20240307-v1:0'
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt AgentAuditTable.Arn
                  - !Sub '${AgentAuditTable.Arn}/index/*'
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource:
                  - !Sub "${DocumentsBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - sts:GetCallerIdentity
                Resource: "*"
              # Call Intelligence: queue jobs and consume them in the worker.
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:ChangeMessageVisibility
                Resource:
                  - !GetAtt CallRecordingQueue.Arn
                  - !GetAtt CallRecordingDlq.Arn
              # Amazon Transcribe batch jobs read the audio from, and write the
              # transcript back to, the documents bucket.
              - Effect: Allow
                Action:
                  - transcribe:StartTranscriptionJob
                  - transcribe:GetTranscriptionJob
                  - transcribe:ListTranscriptionJobs
                Resource: "*"

  ApiLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${EnvironmentName}-real-estate-api"
      Runtime: !Ref LambdaRuntime
      Handler: lambda-handler.handler
      Role: !GetAtt ApiLambdaExecutionRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      MemorySize: !Ref LambdaMemorySize
      Timeout: !Ref LambdaTimeout
      Environment:
