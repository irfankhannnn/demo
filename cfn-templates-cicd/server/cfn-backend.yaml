                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt AgentAuditTable.Arn
                  - !Sub '${AgentAuditTable.Arn}/index/*'

