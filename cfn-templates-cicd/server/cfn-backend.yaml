          CREDIT_CONFIG_TABLE_NAME: !Ref CreditConfigTableName
          CREDITS_TABLE_NAME: !Ref CreditsTableName
          AGENTS_ENABLED: !Ref AgentsEnabled
          AGENT_AUDIT_TABLE_NAME: !Ref AgentAuditTableName
          AGENT_ACTION_CREDITS: !Ref AgentActionCredits
          AI_EMPLOYEE_PROVISIONING_TABLE: !Ref AiEmployeeProvisioningTableName
          AGENCY_CONFIG_DYNAMODB_TABLE_NAME: !Ref AgencyConfigTableName


  LeadQualifierRule:
    Type: AWS::Events::Rule
    Properties:
      Name: realestateflow-lead-qualifier
      EventPattern:
        source:
          - 'crm.leads'
        detail-type:
          - 'lead.created'
      State: ENABLED
      Targets:
        - Arn: !GetAtt LeadQualifierFunction.Arn
          Id: LeadQualifierTarget

  LeadQualifierPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LeadQualifierFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt LeadQualifierRule.Arn

  LeadRouterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: realestateflow-lead-router-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: LeadRouterPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:UpdateItem
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CrmDynamoDbTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CrmDynamoDbTableName}/*'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SubscriptionsTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SubscriptionsTableName}/*'
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-haiku-20240307-v1:0'
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt AgentAuditTable.Arn
                  - !Sub '${AgentAuditTable.Arn}/index/*'

  LeadRouterFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: realestateflow-lead-router
      Runtime: nodejs20.x
      Handler: scripts/lead-router-handler.handler
      Role: !GetAtt LeadRouterRole.Arn
      Timeout: 120
      MemorySize: 256
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      Environment:
        Variables:
          CRM_DYNAMODB_TABLE_NAME: !Ref CrmDynamoDbTableName
          SUBSCRIPTIONS_TABLE: !Ref SubscriptionsTableName
          CREDITS_TABLE_NAME: !Ref CreditsTableName
          CREDIT_CONFIG_TABLE_NAME: !Ref CreditConfigTableName
          USER_CATEGORIES_TABLE_NAME: !Ref UserCategoriesTableName
          AGENTS_ENABLED: !Ref AgentsEnabled
          AGENT_AUDIT_TABLE_NAME: !Ref AgentAuditTableName
          AGENT_ACTION_CREDITS: !Ref AgentActionCredits
          AI_EMPLOYEE_PROVISIONING_TABLE: !Ref AiEmployeeProvisioningTableName
          AGENCY_CONFIG_DYNAMODB_TABLE_NAME: !Ref AgencyConfigTableName


  LeadRouterRule:
    Type: AWS::Events::Rule
    Properties:
      Name: realestateflow-lead-router
      Description: 'Trigger lead routing when a lead is qualified by the agent'
      EventPattern:
        source:
          - 'crm.leads'
        detail-type:
          - 'lead.qualified'
      State: ENABLED
      Targets:
        - Arn: !GetAtt LeadRouterFunction.Arn
          Id: LeadRouterTarget

  LeadRouterPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LeadRouterFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt LeadRouterRule.Arn

  LeadFollowupRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: realestateflow-lead-followup-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: LeadFollowupPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchGetItem
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CrmDynamoDbTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CrmDynamoDbTableName}/*'
              # Phase 2: Credits, agency config, and provisioning tables
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CreditsTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CreditsTableName}/*'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AgencyConfigTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AgencyConfigTableName}/*'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AiEmployeeProvisioningTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AiEmployeeProvisioningTableName}/*'
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource:
                  - !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${SesFromEmail}'
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-haiku-20240307-v1:0'
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt AgentAuditTable.Arn
                  - !Sub '${AgentAuditTable.Arn}/index/*'
              # Phase 2: CloudWatch metrics emission
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: '*'

  LeadFollowupFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: realestateflow-lead-followup
      Runtime: nodejs20.x
      Handler: scripts/lead-followup-cron.handler
      Role: !GetAtt LeadFollowupRole.Arn
      Timeout: 300
      MemorySize: 256
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      Environment:
        Variables:
          CRM_DYNAMODB_TABLE_NAME: !Ref CrmDynamoDbTableName
          AWS_SES_FROM_EMAIL: !Ref SesFromEmail
          EMAIL_PROVIDER_PRIMARY: !Ref EmailProviderPrimary
          CREDITS_TABLE_NAME: !Ref CreditsTableName
          CREDIT_CONFIG_TABLE_NAME: !Ref CreditConfigTableName
          BAILEY_ENABLED: !Ref BaileyEnabled
          BAILEY_MODE: !Ref BaileyMode
          BAILEY_API_KEY: !Ref BaileyApiKey
          BAILEY_API_ENDPOINT: !Ref BaileyApiEndpoint
          BAILEY_API_PREFIX: !Ref BaileyApiPrefix
          AGENTS_ENABLED: !Ref AgentsEnabled
          AGENT_AUDIT_TABLE_NAME: !Ref AgentAuditTableName
          AGENT_ACTION_CREDITS: !Ref AgentActionCredits
          AI_EMPLOYEE_PROVISIONING_TABLE: !Ref AiEmployeeProvisioningTableName
          AI_EMPLOYEE_ROLLOUT_PERCENTAGE: !Ref AiEmployeeRolloutPercentage
          AGENCY_CONFIG_DYNAMODB_TABLE_NAME: !Ref AgencyConfigTableName
          # Phase 2: LLM & observability
          LLM_PROVIDER: !Ref LlmProvider
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          GEMINI_API_KEY: !Ref GeminiApiKey
          GEMINI_MODEL: !Ref GeminiModel
          CLOUDWATCH_METRICS_ENABLED: !Ref CloudwatchMetricsEnabled
          AI_ADMIN_WHATSAPP_NUMBERS: !Ref AiAdminWhatsAppNumbers


  LeadFollowupRule:
    Type: AWS::Events::Rule
    Properties:
      Name: realestateflow-lead-followup
      Description: 'Daily at 04:00 IST  send follow-up nudges for stale leads'
      ScheduleExpression: 'cron(30 22 * * ? *)'
      State: ENABLED
      Targets:
        - Arn: !GetAtt LeadFollowupFunction.Arn
          Id: LeadFollowupTarget

  LeadFollowupPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LeadFollowupFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt LeadFollowupRule.Arn

