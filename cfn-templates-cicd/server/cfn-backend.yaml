          FOUNDER_WHATSAPP: !Ref FounderWhatsApp
          POSTHOG_KEY_SERVER: !Ref PostHogKeyServer
          AWS_SES_FROM_EMAIL: !Ref SesFromEmail
          EMAIL_PROVIDER_PRIMARY: !Ref EmailProviderPrimary

  EscalationSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: ai-employee-escalation-6h
      Description: 'Every 6 hours  check pending AI Employee provisioning SLA'
      ScheduleExpression: 'rate(6 hours)'
      State: ENABLED
      Targets:
