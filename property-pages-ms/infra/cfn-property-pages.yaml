AWSTemplateFormatVersion: "2010-09-09"
Description: >
  property-pages-ms — public, tenant-branded property pages and the site-visit
  booking flow.

  Express on Lambda behind a REGIONAL API Gateway, optionally fronted by
  CloudFront. Server-rendered rather than a static site because each listing
  needs its own OG tags for link previews, and those are what make a shared
  WhatsApp/Instagram link worth tapping.

  ISOLATION: this Lambda's IAM role grants access to exactly ONE table — its
  own rate-limit/nonce store. It has no CRM table access and no S3 access. All
  CRM data arrives over HTTPS from /api/internal/public-pages/*, which returns
  only allowlisted public fields. A full compromise of this internet-facing
  service therefore cannot reach owner phone numbers, KYC data or title deeds.

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues: [dev, prod]
    Description: Environment prefix for every resource name (env-first convention)

  LambdaRuntime:
    Type: String
    Default: nodejs20.x
    AllowedValues: [nodejs20.x, nodejs22.x]

  LambdaMemorySize:
    Type: Number
    Default: 512
    MinValue: 256
    MaxValue: 3008
    Description: >
      512MB is chosen for CPU, not memory. Lambda scales CPU with memory, and
      these are HTML renders where cold-start latency is what a visitor feels.

  LambdaTimeout:
    Type: Number
    Default: 20
    MinValue: 5
    MaxValue: 60
    Description: >
      Must stay above CrmTimeoutMs plus a captcha verify, or the Lambda dies
      mid-render and the real upstream error never surfaces. 20 = 12s CRM +
      5s captcha + headroom.

  LambdaCodeS3Bucket:
    Type: String
  LambdaCodeS3Key:
    Type: String

  CrmInternalApiDomainName:
    Type: String
    Description: >-
      API Gateway custom domain the CRM API is mapped on (services-api.cloudberrysolutions.in
      for dev, services-api.realestateflow.in for prod). Host only - no scheme, no path.
      Raw execute-api hosts are rejected by the Lambda at cold start.
    AllowedPattern: "^[A-Za-z0-9.-]+$"

  CrmInternalApiBasePath:
    Type: String
    Description: >-
      The CRM API's base path on that domain (devrealestatecrm / prodrealestatecrm).
      The /api/internal/public-pages route prefix is appended in code.
    AllowedPattern: "^[A-Za-z0-9_-]+$"

  PublicPagesInternalApiKey:
    Type: String
    NoEcho: true
    Description: Must match server/.env.<env>'s PUBLIC_PAGES_INTERNAL_API_KEY exactly

  VisitSessionSecret:
    Type: String
    NoEcho: true
    Description: >
      HMAC key for booking session tokens. At least 32 chars. Must NOT be the
      CRM's JWT_SECRET — these tokens are handed to anonymous visitors.

  PublicPagesBaseDomain:
    Type: String
    Default: ""
    Description: >
      Tenant subdomain suffix, e.g. pages.realestateflow.in. Leave blank until
      the wildcard certificate and DNS record exist; the /t/<slug>/ path
      fallback keeps the service reachable until then.

  PathTenantFallback:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]

  HcaptchaSiteKey:
    Type: String
    Default: ""
  HcaptchaSecretKey:
    Type: String
    Default: ""
    NoEcho: true

  GoogleMapsEmbedApiKey:
    Type: String
    Default: ""
    NoEcho: true

  LimitTenantBookingsDaily:
    Type: Number
    Default: 200
    Description: >
      Backstop on AI-qualification spend. Every booking creates a lead that can
      trigger a billable AI call, so this bounds a tenant's worst-case daily
      exposure to an attack.

  # ── Tunables ───────────────────────────────────────────────────────────
  # Every one of these is read by config/env.js at runtime. They were
  # documented in .env.sample as configurable while never actually being
  # passed to the Lambda, so all twelve silently used their code defaults —
  # including the abuse limits. Wired through explicitly now.

  CrmTimeoutMs:
    Type: Number
    Default: 12000
    Description: >-
      Timeout for calls to the CRM internal API. Must stay comfortably under LambdaTimeout. 6000 was measured to be too tight for a cold CRM Lambda, which hydrates ~100 config values from SSM at startup.

  VisitSessionTtlSeconds:
    Type: Number
    Default: 1800
    Description: >-
      How long a rendered booking form stays valid before the visitor must reload.

  VisitMinFillSeconds:
    Type: Number
    Default: 3
    Description: >-
      A form submitted faster than this was not typed by a person. 0 disables the check.

  LimitIpBurst:
    Type: Number
    Default: 5
    Description: >-
      Booking sessions one IP may mint per burst window. This is the 'many sessions from one IP within a second' control.

  LimitIpBurstWindowSeconds:
    Type: Number
    Default: 10
    Description: >-
      Width of the burst window in seconds.

  LimitIpHourly:
    Type: Number
    Default: 40
    Description: >-
      Booking sessions one IP may mint per hour.

  LimitIpBookingsDaily:
    Type: Number
    Default: 6
    Description: >-
      Completed bookings per IP per day.

  LimitPhoneBookingsDaily:
    Type: Number
    Default: 3
    Description: >-
      Completed bookings per phone number per day.

  LimitCaptchaTrigger:
    Type: Number
    Default: 3
    Description: >-
      Failed attempts from one IP before a captcha is demanded.

  HcaptchaVerifyTimeoutMs:
    Type: Number
    Default: 5000
    Description: >-
      Timeout for the hCaptcha siteverify call.

  AssetCacheSeconds:
    Type: Number
    Default: 300
    Description: >-
      Edge cache for image/document redirects. MUST stay well under the 900s presigned URL lifetime, or a cached redirect outlives its signature and images break.

  PageCacheSeconds:
    Type: Number
    Default: 60
    Description: >-
      Edge cache for rendered HTML.

  ApiStageName:
    Type: String
    Default: v1

  EnableCloudFront:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      CloudFront is required for the wildcard tenant subdomain and for caching.
      Set false to deploy API Gateway only (faster, useful when iterating).

  PagesApiDomainName:
    Type: String
    Default: ""
    Description: >-
      Existing API Gateway custom domain to map this API onto
      (services-api.cloudberrysolutions.in for dev, services-api.realestateflow.in
      for prod). This template does not create the domain itself. Host only.
    AllowedPattern: "^[A-Za-z0-9.-]*$"

  PagesApiBasePath:
    Type: String
    Default: ""
    Description: >-
      Single-segment base path for this API on PagesApiDomainName
      (devrealestatepages / prodrealestatepages). Also handed to the Lambda so it
      can strip the segment, and used as the CloudFront OriginPath.
    AllowedPattern: "^[A-Za-z0-9_-]*$"

  EnableCustomDomainMapping:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      Creates the BasePathMapping. Required whenever EnableCloudFront is true,
      because the distribution's origin is the custom domain, not execute-api.

  EnableBasePathStrip:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      Must be true when EnableCustomDomainMapping is true. API Gateway's base path
      mapping only selects the API; for a Lambda proxy integration the base path is
      still present in event.path, so lambda.js strips it.

  LogLevel:
    Type: String
    Default: info
    AllowedValues: [error, warn, info, debug]

  LogRetentionDays:
    Type: Number
    Default: 30

Rules:
  # CloudFront's origin is the custom domain + base path, so a distribution
  # without the mapping would 403 on every request.
  CloudFrontRequiresCustomDomain:
    RuleCondition: !Equals [!Ref EnableCloudFront, "true"]
    Assertions:
      - Assert: !Equals [!Ref EnableCustomDomainMapping, "true"]
        AssertDescription: EnableCloudFront=true requires EnableCustomDomainMapping=true (the CloudFront origin is the custom domain).
  CustomDomainMappingIsComplete:
    RuleCondition: !Equals [!Ref EnableCustomDomainMapping, "true"]
    Assertions:
      - Assert: !Not [!Equals [!Ref PagesApiDomainName, ""]]
        AssertDescription: EnableCustomDomainMapping=true requires PagesApiDomainName.
      - Assert: !Not [!Equals [!Ref PagesApiBasePath, ""]]
        AssertDescription: EnableCustomDomainMapping=true requires PagesApiBasePath.
      - Assert: !Equals [!Ref EnableBasePathStrip, "true"]
        AssertDescription: EnableCustomDomainMapping=true requires EnableBasePathStrip=true, or every route 404s.

Conditions:
  CloudFrontEnabled: !Equals [!Ref EnableCloudFront, "true"]
  CustomDomainMappingEnabled: !Equals [!Ref EnableCustomDomainMapping, "true"]

Resources:
  # ---------------------------------------------------------------------------
  # Abuse-control store
  # ---------------------------------------------------------------------------
  # Rate-limit counters and single-use booking nonces. Separate from every CRM
  # table on purpose: it is the only thing this public service may write, and
  # it holds no customer data — counter keys are IPs and salted phone hashes,
  # never a raw phone number.
  GuardTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub "${EnvironmentName}-realestateflow-pages-guard"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: guardKey
          AttributeType: S
      KeySchema:
        - AttributeName: guardKey
          KeyType: HASH
      # Every row is a short-lived counter or a burnt nonce. TTL is what keeps
      # the table from growing without bound; nothing here is worth retaining,
      # which is also why DeletionPolicy is Delete rather than Retain.
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Service
          Value: realestateflow-pages

  PagesLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${EnvironmentName}-realestateflow-pages-lambda"
      RetentionInDays: !Ref LogRetentionDays

  PagesLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-realestateflow-pages-lambda-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: pages-lambda-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${EnvironmentName}-realestateflow-pages-lambda:*"
              # The guard table and nothing else. Deliberately no CRM table and
              # no S3: this service reaches customer data only through the CRM's
              # internal API, which returns allowlisted public fields. Widening
              # this policy would silently destroy that guarantee.
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt GuardTable.Arn

  PagesLambda:
    Type: AWS::Lambda::Function
    DependsOn: PagesLambdaLogGroup
    Properties:
      FunctionName: !Sub "${EnvironmentName}-realestateflow-pages-lambda"
      Runtime: !Ref LambdaRuntime
      Handler: lambda.handler
      Role: !GetAtt PagesLambdaRole.Arn
      MemorySize: !Ref LambdaMemorySize
      Timeout: !Ref LambdaTimeout
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      Environment:
        Variables:
          NODE_ENV: production
          ENVIRONMENT_NAME: !Ref EnvironmentName
          LOG_LEVEL: !Ref LogLevel
          GUARD_TABLE_NAME: !Ref GuardTable
          CRM_INTERNAL_API_DOMAIN_NAME: !Ref CrmInternalApiDomainName
          CRM_INTERNAL_API_BASE_PATH: !Ref CrmInternalApiBasePath
          PUBLIC_PAGES_INTERNAL_API_KEY: !Ref PublicPagesInternalApiKey
          VISIT_SESSION_SECRET: !Ref VisitSessionSecret
          PUBLIC_PAGES_BASE_DOMAIN: !Ref PublicPagesBaseDomain
          PATH_TENANT_FALLBACK: !Ref PathTenantFallback
          HCAPTCHA_SITE_KEY: !Ref HcaptchaSiteKey
          HCAPTCHA_SECRET_KEY: !Ref HcaptchaSecretKey
          GOOGLE_MAPS_EMBED_API_KEY: !Ref GoogleMapsEmbedApiKey
          LIMIT_TENANT_BOOKINGS_DAILY: !Ref LimitTenantBookingsDaily
          CRM_TIMEOUT_MS: !Ref CrmTimeoutMs
          VISIT_SESSION_TTL_SECONDS: !Ref VisitSessionTtlSeconds
          VISIT_MIN_FILL_SECONDS: !Ref VisitMinFillSeconds
          LIMIT_IP_BURST: !Ref LimitIpBurst
          LIMIT_IP_BURST_WINDOW_SECONDS: !Ref LimitIpBurstWindowSeconds
          LIMIT_IP_HOURLY: !Ref LimitIpHourly
          LIMIT_IP_BOOKINGS_DAILY: !Ref LimitIpBookingsDaily
          LIMIT_PHONE_BOOKINGS_DAILY: !Ref LimitPhoneBookingsDaily
          LIMIT_CAPTCHA_TRIGGER: !Ref LimitCaptchaTrigger
          HCAPTCHA_VERIFY_TIMEOUT_MS: !Ref HcaptchaVerifyTimeoutMs
          ASSET_CACHE_SECONDS: !Ref AssetCacheSeconds
          PAGE_CACHE_SECONDS: !Ref PageCacheSeconds
          PAGES_API_BASE_PATH: !Ref PagesApiBasePath
          ENABLE_BASE_PATH_STRIP: !Ref EnableBasePathStrip
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Service
          Value: realestateflow-pages

  # ---------------------------------------------------------------------------
  # API Gateway
  # ---------------------------------------------------------------------------
  # One greedy {proxy+}; Express does the routing. Same reasoning as
  # backend_insta_sol_ms — enumerating routes in CFN buys nothing and is what
  # pushed the main backend stack into nested stacks to stay under the
  # 500-resource limit.

  PagesRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "${EnvironmentName}-realestateflow-pages-api"
      Description: Public property pages microservice
      EndpointConfiguration:
        Types: [REGIONAL]
      MinimumCompressionSize: 1024
      # HTML is text; without this every page would be served uncompressed to
      # a mobile visitor.
      BinaryMediaTypes: []
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Service
          Value: realestateflow-pages

  PagesProxyResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref PagesRestApi
      ParentId: !GetAtt PagesRestApi.RootResourceId
      PathPart: "{proxy+}"

  PagesProxyMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref PagesRestApi
      ResourceId: !Ref PagesProxyResource
      HttpMethod: ANY
      # Every route here is deliberately public — this is an anonymous,
      # crawler-visible site. Abuse controls live in the Lambda, where they can
      # see the tenant, the phone number and the session token.
      AuthorizationType: NONE
      RequestParameters:
        method.request.path.proxy: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PagesLambda.Arn}/invocations"

  PagesRootMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref PagesRestApi
      ResourceId: !GetAtt PagesRestApi.RootResourceId
      HttpMethod: ANY
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PagesLambda.Arn}/invocations"

  PagesLambdaApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt PagesLambda.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${PagesRestApi}/*/*/*"

  PagesApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - PagesProxyMethod
      - PagesRootMethod
    Properties:
      RestApiId: !Ref PagesRestApi
      Description: Deployed by property-pages-ms/infra/deploy.sh

  PagesApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref PagesRestApi
      DeploymentId: !Ref PagesApiDeployment
      StageName: !Ref ApiStageName
      TracingEnabled: true
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          # A second, coarser ceiling above the Lambda's own per-IP limits.
          # This one bounds total spend if a distributed flood makes per-IP
          # limiting ineffective.
          ThrottlingBurstLimit: 400
          ThrottlingRateLimit: 200
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Service
          Value: realestateflow-pages

  # Maps this API onto the shared custom domain. The domain itself is created
  # once, outside this stack. API Gateway uses the base path only to pick the
  # API; the Lambda strips it from event.path (EnableBasePathStrip).
  PagesApiBasePathMapping:
    Type: AWS::ApiGateway::BasePathMapping
    Condition: CustomDomainMappingEnabled
    DependsOn:
      - PagesApiStage
    Properties:
      DomainName: !Ref PagesApiDomainName
      RestApiId: !Ref PagesRestApi
      Stage: !Ref ApiStageName
      BasePath: !Ref PagesApiBasePath

  # ---------------------------------------------------------------------------
  # CloudFront
  # ---------------------------------------------------------------------------

  # CloudFront rewrites Host to the API Gateway origin, which would erase the
  # tenant subdomain the whole addressing scheme depends on. This copies the
  # viewer's original host into X-Forwarded-Host before forwarding, and
  # resolveTenant.js reads that in preference to Host.
  PreserveHostFunction:
    Type: AWS::CloudFront::Function
    Condition: CloudFrontEnabled
    Properties:
      Name: !Sub "${EnvironmentName}-realestateflow-pages-preserve-host"
      AutoPublish: true
      FunctionConfig:
        Comment: Copies the viewer Host into X-Forwarded-Host for tenant resolution
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (request.headers.host && request.headers.host.value) {
            request.headers['x-forwarded-host'] = { value: request.headers.host.value };
          }
          return request;
        }

  # The cache key MUST include X-Forwarded-Host. Without it every tenant would
  # share one cache entry per path and visitors would be served another
  # agency's page — the single most dangerous mistake available in this stack.
  PagesCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Condition: CloudFrontEnabled
    Properties:
      CachePolicyConfig:
        Name: !Sub "${EnvironmentName}-realestateflow-pages-cache"
        Comment: Tenant-aware HTML caching, keyed on the viewer host
        DefaultTTL: 60
        MinTTL: 0
        MaxTTL: 300
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          HeadersConfig:
            HeaderBehavior: whitelist
            Headers:
              - X-Forwarded-Host
          QueryStringsConfig:
            # Pagination cursors and ManyChat prefill parameters both change
            # the rendered page.
            QueryStringBehavior: all
          CookiesConfig:
            CookieBehavior: none

  PagesOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Condition: CloudFrontEnabled
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub "${EnvironmentName}-realestateflow-pages-origin"
        Comment: Forwards the viewer host and client IP to the origin
        HeadersConfig:
          # Host is deliberately absent (equivalent to the managed
          # AllViewerExceptHostHeader policy for this purpose): the origin is an
          # API Gateway custom domain, which routes by Host. CloudFront must send
          # Host = the origin domain, or API Gateway rejects the request.
          HeaderBehavior: whitelist
          Headers:
            - X-Forwarded-Host
            - CloudFront-Viewer-Address
            - User-Agent
            - Referer
        QueryStringsConfig:
          QueryStringBehavior: all
        CookiesConfig:
          CookieBehavior: none

  PagesDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: CloudFrontEnabled
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${EnvironmentName} public property pages"
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          # Custom domain + base path, never the execute-api host. CloudFront
          # prepends OriginPath, so the Lambda sees /<basePath>/t/<slug>/... and
          # lambda.js strips the base path back to /t/<slug>/... - the same path
          # the raw /<stage> origin used to deliver. The Rules section guarantees
          # the mapping exists whenever this distribution does.
          - Id: pages-api
            DomainName: !Ref PagesApiDomainName
            OriginPath: !Sub "/${PagesApiBasePath}"
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 30
        DefaultCacheBehavior:
          TargetOriginId: pages-api
          ViewerProtocolPolicy: redirect-to-https
          # POST is required: the booking form submits through here.
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          CachePolicyId: !Ref PagesCachePolicy
          OriginRequestPolicyId: !Ref PagesOriginRequestPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt PreserveHostFunction.FunctionMetadata.FunctionARN
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Service
          Value: realestateflow-pages

Outputs:
  PagesApiBaseUrl:
    Condition: CustomDomainMappingEnabled
    Description: API Gateway custom domain + base path (bypasses CloudFront; useful for debugging)
    Value: !Sub "https://${PagesApiDomainName}/${PagesApiBasePath}"
    Export:
      Name: !Sub "${EnvironmentName}-realestateflow-pages-api-base-url"

  PagesRestApiId:
    Value: !Ref PagesRestApi
    Export:
      Name: !Sub "${EnvironmentName}-realestateflow-pages-api-id"

  PagesDistributionDomain:
    Condition: CloudFrontEnabled
    Description: Public URL. Append /t/<agency-slug>/ until the wildcard DNS record exists.
    Value: !Sub "https://${PagesDistribution.DomainName}"
    Export:
      Name: !Sub "${EnvironmentName}-realestateflow-pages-cf-domain"

  PagesDistributionId:
    Condition: CloudFrontEnabled
    Value: !Ref PagesDistribution
    Export:
      Name: !Sub "${EnvironmentName}-realestateflow-pages-cf-id"

  GuardTableName:
    Value: !Ref GuardTable

  LambdaFunctionName:
    Value: !Ref PagesLambda
