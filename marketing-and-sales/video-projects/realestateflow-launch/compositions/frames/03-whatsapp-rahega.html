  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var FRAME_ID = "03-whatsapp-rahega";
      var stack = document.getElementById("wr-stack");
      var line1 = document.getElementById("wr-line-1");
      var line2 = document.getElementById("wr-line-2");
      var jit1 = document.getElementById("wr-jit-1");
      var jit2 = document.getElementById("wr-jit-2");

      /* ---- fit-to-measure: one shared size for BOTH lines, capped to the 840px
         text budget so nothing crosses into the right-hand clear strip. ---- */
      var BASE_PX = 82;
      var BUDGET_PX = 840;
      function fitToMeasure() {
        stack.style.fontSize = BASE_PX + "px";
        var widest = Math.max(line1.offsetWidth, line2.offsetWidth);
        if (widest > BUDGET_PX) {
          stack.style.fontSize = Math.floor((BASE_PX * BUDGET_PX) / widest) + "px";
        }
      }
      fitToMeasure();
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(fitToMeasure);
      }

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* ---- Scene 1 (0.0–1.4s) — "WhatsApp rahega." arrives by per-word staggered
         reveal on a long-tail settle. Hero is on screen well before t = 0.5s. ---- */
      var WORD_ENTRY_AT = 0.1;
      var WORD_STAGGER = 0.16;
      var words = line1.querySelectorAll(".wr-word");
      for (var i = 0; i < words.length; i++) {
        tl.fromTo(
          words[i],
          { opacity: 0, y: 38 },
          { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" },
          WORD_ENTRY_AT + i * WORD_STAGGER
        );
      }

      /* ---- Scene 2 (1.4–2.4s) — "Chaos jayega." lands directly beneath as ONE beat:
         spring-pop entrance, smooth long-tail settle, no overshoot. Origin-anchored to
         the left rail so it grows out of the ranged-left edge instead of drifting. ---- */
      tl.fromTo(
        line2,
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.68, ease: "power3.out" },
        1.45
      );

      /* ---- Scene 3 (2.4–3.5s) — held still. No camera, no drift: one bounded
         low-amplitude sine breath (2px), phase-offset per line, with a settle-and-fade
         tail so the frame is completely static at the handoff. ---- */
      var IDLE_START = 2.5;
      var IDLE_DUR = 1.0;
      var CYCLES = 0.5;
      var Y_AMP = 2;
      var FADE_FRAC = 0.25;
      var phase = { p: 0 };
      tl.to(
        phase,
        {
          p: Math.PI * 2 * CYCLES,
          duration: IDLE_DUR,
          ease: "none",
          onUpdate: function () {
            var t = phase.p / (Math.PI * 2 * CYCLES);
            var env = t < 1 - FADE_FRAC ? 1 : Math.max(0, (1 - t) / FADE_FRAC);
            jit1.style.transform =
              "translateY(" + Math.sin(phase.p) * Y_AMP * env + "px)";
            jit2.style.transform =
              "translateY(" +
              Math.sin(phase.p + Math.PI / 2) * Y_AMP * env +
              "px)";
          },
        },
        IDLE_START
      );

      window.__timelines[FRAME_ID] = tl;
    })();
  </script>
