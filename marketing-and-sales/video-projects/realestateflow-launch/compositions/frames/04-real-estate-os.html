  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="04-real-estate-os"]');

      var kicker = root.querySelector("#f04-kicker");
      var tiles = Array.prototype.slice.call(root.querySelectorAll(".f04-tile"));
      var khata = root.querySelector("#f04-khata");
      var khataLabel = root.querySelector("#f04-khata-label");
      var words = Array.prototype.slice.call(root.querySelectorAll(".f04-word"));

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* ——— Scene 1 (0.0–0.8s): ink ground + kicker, nothing else ——— */
      tl.fromTo(
        kicker,
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.44, ease: "power3.out" },
        0.06,
      );

      /* ——— Scene 2 (0.8–3.6s): 16 tiles self-assemble, spring-pop, reading order ———
         Stagger is derived from the tile INDEX only — fully deterministic, no randomness. */
      var TILE_START = 0.74;
      var TILE_STAGGER = 0.15;
      var POP_DUR = 0.56;

      tiles.forEach(function (el, i) {
        tl.fromTo(
          el,
          { scale: 0, opacity: 0, y: 22 },
          { scale: 1, opacity: 1, y: 0, duration: POP_DUR, ease: "power3.out" },
          TILE_START + i * TILE_STAGGER,
        );
      });
      /* last tile (i=15) lands at 0.74 + 2.25 + 0.56 = 3.55s — the cascade closes on Scene 2. */

      /* ——— Scene 3 (3.6–4.6s): Khata Book (row 3, col 3 — index 10) takes marigold ———
         asr-keyword-glow: ONE linear driver, ease "none", attack–sustain–release.
         Two envelopes off the same driver: the FILL resolves to a flat marigold ground
         and holds; the GLOW hugs the glyph via text-shadow and decays fully to zero,
         so no residual bloom survives — the plane stays flat. */
      var GLOW_AT = 3.55;
      var GLOW_DUR = 1.05;

      var INK2 = [37, 28, 22];
      var HAIRLINE = [58, 46, 37];
      var MARIGOLD = [255, 122, 26];
      var PAPER = [251, 242, 228];
      var INK = [28, 21, 18];

      var MAX_BLUR = 22;
      var ATTACK_FILL = 0.3;
      var GLOW_ON = 0.06;
      var GLOW_ATTACK = 0.22;
      var GLOW_SUSTAIN_END = 0.5;
      var GLOW_RELEASE = 0.4;

      function mix(a, b, t) {
        return (
          "rgb(" +
          Math.round(a[0] + (b[0] - a[0]) * t) +
          ", " +
          Math.round(a[1] + (b[1] - a[1]) * t) +
          ", " +
          Math.round(a[2] + (b[2] - a[2]) * t) +
          ")"
        );
      }

      function fillEnvelope(t) {
        if (t <= GLOW_ON) return 0;
        return Math.min((t - GLOW_ON) / ATTACK_FILL, 1);
      }

      function glowEnvelope(t) {
        if (t <= GLOW_ON) return 0;
        if (t < GLOW_ON + GLOW_ATTACK) return (t - GLOW_ON) / GLOW_ATTACK;
        if (t < GLOW_SUSTAIN_END) return 1;
        if (t < GLOW_SUSTAIN_END + GLOW_RELEASE) {
          return 1 - (t - GLOW_SUSTAIN_END) / GLOW_RELEASE;
        }
        return 0;
      }

      var driver = { t: 0 };
      tl.to(
        driver,
        {
          t: GLOW_DUR,
          duration: GLOW_DUR,
          ease: "none",
          onUpdate: function () {
            var fill = fillEnvelope(driver.t);
            var glow = glowEnvelope(driver.t);
            khata.style.backgroundColor = mix(INK2, MARIGOLD, fill);
            khata.style.borderColor = mix(HAIRLINE, MARIGOLD, fill);
            khataLabel.style.color = mix(PAPER, INK, fill);
            khataLabel.style.textShadow =
              "0 0 " + MAX_BLUR * glow + "px rgba(255, 122, 26, " + 0.8 * glow + ")";
          },
        },
        GLOW_AT,
      );

      /* The envelope's scale ride, kept as its own tweens so the pop's transform and the
         glow driver never contend for the same property. Resolves back to 1 — flat. */
      tl.to(khata, { scale: 1.045, duration: 0.22, ease: "power2.out" }, 3.61);
      tl.to(khata, { scale: 1, duration: 0.44, ease: "power2.inOut" }, 3.86);

      /* ——— Scene 4 (4.6–6.0s): closing line, per-word staggered reveal, then hold ——— */
      var WORD_AT = 4.62;
      var WORD_STAGGER = 0.14;

      words.forEach(function (el, i) {
        tl.fromTo(
          el,
          { opacity: 0, y: 28 },
          { opacity: 1, y: 0, duration: 0.52, ease: "power3.out" },
          WORD_AT + i * WORD_STAGGER,
        );
      });
      /* last word lands at 5.56s — grid and line hold together, still, to 6.0s. */

      window.__timelines["04-real-estate-os"] = tl;
    })();
