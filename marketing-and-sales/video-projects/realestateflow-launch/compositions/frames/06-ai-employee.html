    (function () {

        { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" },

      );

      /* svg-icon-enrichment · Pattern 3 (pulse), finite + bounded: no repeat, no yoyo.
         SVG transform ATTRIBUTE around an explicit centre (transform-centre gotcha). */
      var dots = [
        { el: q("#f06-dot-0"), cx: 24 },
        { el: q("#f06-dot-1"), cx: 60 },
        { el: q("#f06-dot-2"), cx: 96 }
      ];
      var pulse = { p: 0 };
      var PULSE_CYCLES = 1.5;
      var DOT_AMP = 0.18;
      var applyDots = function () {
        for (var i = 0; i < dots.length; i++) {
          var d = dots[i];
          if (!d.el) continue;
          var ph = pulse.p + (i * Math.PI * 2) / 3;
          var s = 1 + Math.sin(ph) * DOT_AMP;
          d.el.setAttribute(
            "transform",
            "translate(" + d.cx + " 20) scale(" + s + ") translate(" + -d.cx + " -20)"
          );
          d.el.style.opacity = String(0.55 + Math.sin(ph) * 0.35);
        }
      };
      applyDots();
      tl.to(
        pulse,
        {
          p: Math.PI * 2 * PULSE_CYCLES,
          duration: 0.8,
          ease: "none",
          onUpdate: applyDots
        },
        1.84
      );

      /* ---------- Scene 4 (2.6–3.8s): the machine answers ---------- */

      tl.to(
        q("#f06-typing"),
        { opacity: 0, scale: 0.62, duration: 0.22, ease: "power2.in" },
        2.58

        { opacity: 1, scale: 1, duration: 0.58, ease: "power3.out" },
