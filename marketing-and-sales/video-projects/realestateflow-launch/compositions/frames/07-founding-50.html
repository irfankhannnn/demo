    #root {

    /* — Layer 0: full-bleed ink ground, on a clip (never on #root). — */
    .f07-ground {
      position: absolute;
      inset: 0;

    }

    /* — Layer 1: safe-band stage. Everything lives y 220–1500, right 140px clear. — */

    /* Scene 1 — the mark, centred in the upper portion of the safe band */
    .f07-mark {
      position: absolute;
      left: 350px;
      top: 400px;
      width: 380px;
      height: 380px;
      transform-origin: 50% 50%;
      will-change: transform;
    }

    .f07-mark svg {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 26px;
    }

    /* The supplied logo.svg is the LIGHT-background lockup: a cream #FBF2E4 plate
       carrying an ink counter-form. Dropped straight onto our ink ground it renders
       as the brightest block in the entire video and fights the whole system.
       The brand kit specifies paper-cream artwork + the marigold accent wave for
       dark grounds, so invert the two plates here. CSS beats the SVG's presentation
       attributes, so this holds without rewriting the artwork itself.
         path 1 = the plate            -> ink, so it vanishes into the ground
         path 2 = house + wordmark     -> paper cream, the visible artwork
         path 3 = the one flow wave    -> marigold, left exactly as authored */
    .f07-mark svg path:nth-of-type(1) {
      fill: #1c1512;
      stroke: #1c1512;
    }

    .f07-mark svg path:nth-of-type(2) {
      fill: #fbf2e4;
      stroke: #fbf2e4;
    }
