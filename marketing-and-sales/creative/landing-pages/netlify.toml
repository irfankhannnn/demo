# RealEstateFlow landing pages — Netlify config
# Build runs the Vite + partials pipeline in build/ and publishes dist/.

[build]
  publish = "dist"
  command = "cd build && npm install && npm run build:lps"

# === Pretty-URL rewrites (serve folder index.html) ===
[[redirects]]
  from = "/agency-owners"
  to = "/agency-owners/index.html"
  status = 200

[[redirects]]
  from = "/agents"
  to = "/agents/index.html"
  status = 200

[[redirects]]
  from = "/ai-employee"
  to = "/ai-employee/index.html"
  status = 200

[[redirects]]
  from = "/demo"
  to = "/demo/index.html"
  status = 200

[[redirects]]
  from = "/pricing"
  to = "/pricing/index.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about/index.html"
  status = 200

[[redirects]]
  from = "/grievance"
  to = "/grievance/index.html"
  status = 200

[[redirects]]
  from = "/legal/terms"
  to = "/legal/terms/index.html"
  status = 200

[[redirects]]
  from = "/legal/privacy"
  to = "/legal/privacy/index.html"
  status = 200

[[redirects]]
  from = "/legal/refund"
  to = "/legal/refund/index.html"
  status = 200

[[redirects]]
  from = "/legal/cookies"
  to = "/legal/cookies/index.html"
  status = 200

[[redirects]]
  from = "/vs/*"
  to = "/vs/:splat/index.html"
  status = 200

# === Convenience 301s ===
[[redirects]]
  from = "/legal"
  to = "/legal/terms"
  status = 301

[[redirects]]
  from = "/help"
  to = "/grievance"
  status = 301

# Note: the old /enterprise redirect has been removed (enterprise page retired).

# === Security headers ===
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-XSS-Protection = "1; mode=block"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://js.hcaptcha.com https://www.googletagmanager.com https://connect.facebook.net https://snap.licdn.com https://static.hotjar.com https://eu.posthog.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://eu.i.posthog.com https://api.realestateflow.in https://app.realestateflow.in;"
